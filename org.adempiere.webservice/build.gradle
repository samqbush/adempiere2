plugins {
	id 'java-library'
	id 'maven-publish'
}

sourceSets {
	main {
		java {
			srcDirs = ['src/neutral/java']
		}
	}
	test {
		resources {
			srcDir 'contracts/xfire-v1'
			include 'operations.tsv'
		}
	}
	businessTest {
		java {
			srcDirs = ['src/businessTest/java']
		}
	}
	cxf {
		java {
			srcDirs = ['src/cxf/java']
		}
		resources {
			srcDir 'src/cxf/resources'
		}
	}
	routerTest {
		java {
			srcDirs = [
				'src/router/java',
				'src/routerTest/java'
			]
		}
	}
}

def phase4Runtime = new Properties()
rootProject.file('gradle/phase4/runtime.properties').withInputStream {
	phase4Runtime.load(it)
}
def cxfVersion = phase4Runtime.getProperty('cxf.version')

dependencies {
	api files('WEB-INF/lib/xbean.jar')
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
	businessTestImplementation sourceSets.main.output
	businessTestImplementation files(
		'WEB-INF/classes',
		'WEB-INF/lib/generated_xmlbeans.jar',
		'WEB-INF/lib/xbean.jar',
		'../lib/Adempiere.jar')
	businessTestImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
	businessTestRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
	cxfImplementation sourceSets.main.output
	cxfImplementation files(
		'WEB-INF/classes',
		'WEB-INF/lib/generated_xmlbeans.jar',
		'WEB-INF/lib/xbean.jar',
		'WEB-INF/lib/commons-codec-1.3.jar')
	cxfCompileOnly files('../lib/Adempiere.jar')
	cxfImplementation "org.apache.cxf:cxf-rt-frontend-jaxws:${cxfVersion}"
	cxfImplementation "org.apache.cxf:cxf-rt-transports-http:${cxfVersion}"
	cxfRuntimeOnly 'com.sun.xml.messaging.saaj:saaj-impl:3.0.4'
	cxfCompileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
	routerTestImplementation sourceSets.main.output
	routerTestImplementation files(
		'../lib/Adempiere.jar',
		'../lib/glassfish.jar')
	routerTestImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
	routerTestRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
}

java {
	withJavadocJar()
	withSourcesJar()
}

version = System.getenv('ADEMPIERE_LIBRARY_VERSION') ?: 'local-1.0.0'

jar {
	manifest {
		attributes(
			'Implementation-Title': 'ADempiere Web Service Neutral Seam',
			'Implementation-Version': version,
			'EntityType': 'D')
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId = 'io.github.adempiere'
			artifactId = 'webservice'
			from components.java
		}
	}
}

tasks.named('test') {
	useJUnitPlatform {
		includeTags 'UnitTest'
	}
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

tasks.register('compileLegacyWebService', Exec) {
	description = 'Compiles the Ant-owned legacy WAR classes and shared business seam'
	group = 'build'
	inputs.files fileTree('WEB-INF/src').matching { include '**/*.java', '**/*.xml' }
	inputs.files fileTree('src/neutral/java').matching { include '**/*.java' }
	inputs.files fileTree('src/business/java').matching { include '**/*.java' }
	inputs.file 'build.xml'
	outputs.dir 'WEB-INF/classes'
	commandLine 'ant', '-f', file('build.xml').absolutePath, 'compile'
}

tasks.named('compileBusinessTestJava') {
	dependsOn tasks.named('compileLegacyWebService')
}

tasks.named('compileCxfJava') {
	dependsOn tasks.named('compileLegacyWebService')
}

tasks.register('businessTest', Test) {
	description = 'Runs isolated tests for the transport-neutral business seam'
	group = 'verification'
	testClassesDirs = sourceSets.businessTest.output.classesDirs
	classpath = sourceSets.businessTest.runtimeClasspath
	useJUnitPlatform {
		includeTags 'UnitTest'
	}
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

tasks.register('routerTest', Test) {
	description = 'Runs isolated compatibility-router parser tests'
	group = 'verification'
	testClassesDirs = sourceSets.routerTest.output.classesDirs
	classpath = sourceSets.routerTest.runtimeClasspath
	useJUnitPlatform {
		includeTags 'UnitTest'
	}
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

tasks.register('verifyNeutralSeamPurity') {
	dependsOn tasks.named('classes')
	inputs.files sourceSets.main.allJava
	inputs.dir 'src/business/java'
	doLast {
		def forbidden = [
			'org.codehaus.xfire',
			'javax.servlet',
			'jakarta.servlet',
			'org.apache.cxf'
		]
		def transportNeutralSources = new LinkedHashSet(
			sourceSets.main.allJava.files)
		transportNeutralSources.addAll(
			fileTree('src/business/java').matching {
				include '**/*.java'
			}.files)
		def violations = transportNeutralSources.findAll { source ->
			forbidden.any { source.text.contains(it) }
		}
		if (!violations.isEmpty()) {
			throw new GradleException(
				"Transport framework leaked into a neutral seam: ${violations}")
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyNeutralSeamPurity')
}

def phase3SharedLibrary =
		rootProject.file('build/phase3/runtime/Adempiere/lib/AdempiereSLib.jar')
def phase3PackagesLibrary =
		rootProject.file('build/phase3/runtime/Adempiere/lib/packages.jar')
def adempiereCoreLibrary = rootProject.file('lib/Adempiere.jar')

tasks.register('modernAdempiereCoreJar', Jar) {
	description = 'Builds the servlet-free ADempiere core for the modern SOAP runtime'
	archiveFileName = 'Adempiere-Modern-Core.jar'
	destinationDirectory = layout.buildDirectory.dir('phase4')
	doFirst {
		if (!adempiereCoreLibrary.exists()) {
			throw new GradleException(
					"Missing ADempiere core library: ${adempiereCoreLibrary}")
		}
	}
	from({ zipTree(adempiereCoreLibrary) }) {
		exclude 'META-INF/*.SF'
		exclude 'META-INF/*.RSA'
		exclude 'META-INF/*.DSA'
		exclude 'org/compiere/model/MAd*.class'
		exclude 'org/compiere/util/FileUpload*.class'
		exclude 'org/compiere/util/WebEnv*.class'
		exclude 'org/compiere/util/WebLogin*.class'
		exclude 'org/compiere/util/WebSessionCtx*.class'
		exclude 'org/compiere/util/WebUser*.class'
		exclude 'org/compiere/util/WebUtil*.class'
	}
}

tasks.register('modernLegacyRuntimeJar', Jar) {
	description = 'Builds the minimal legacy dependency bridge for the modern SOAP runtime'
	archiveFileName = 'adempiere-soap-legacy-runtime.jar'
	destinationDirectory = layout.buildDirectory.dir('phase4')
	doFirst {
		if (!phase3SharedLibrary.exists()) {
			throw new GradleException(
					"Missing Phase 3 shared library: ${phase3SharedLibrary}")
		}
	}
	from({ zipTree(phase3SharedLibrary) }) {
		include 'com/mchange/**'
		include 'com/sun/activation/**'
		include 'com/sun/mail/**'
		include 'com/zaxxer/**'
		include 'io/vavr/**'
		include 'javax/activation/**'
		include 'javax/mail/**'
		include 'org/apache/commons/collections4/**'
		include 'org/apache/commons/dbcp/**'
		include 'org/apache/log4j/**'
		include 'org/apache/commons/pool/**'
		include 'org/postgresql/**'
		include 'org/slf4j/**'
		exclude 'META-INF/**'
	}
}

tasks.register('modernAdempierePackagesJar', Jar) {
	description = 'Builds the servlet-free ADempiere package modules for the modern SOAP runtime'
	archiveFileName = 'Adempiere-Modern-Packages.jar'
	destinationDirectory = layout.buildDirectory.dir('phase4')
	doFirst {
		if (!phase3PackagesLibrary.exists()) {
			throw new GradleException(
					"Missing installed package library: ${phase3PackagesLibrary}")
		}
	}
	from({ zipTree(phase3PackagesLibrary) }) {
		exclude 'META-INF/*.SF'
		exclude 'META-INF/*.RSA'
		exclude 'META-INF/*.DSA'
		exclude 'org/compiere/asset/model/MAssetDelivery*.class'
		exclude 'org/compiere/asset/model/MRegistration*.class'
	}
}

tasks.register('modernSoapWar', Zip) {
	description = 'Builds the isolated CXF/Jakarta SOAP API WAR'
	group = 'build'
	dependsOn tasks.named('compileCxfJava')
	dependsOn tasks.named('modernAdempiereCoreJar')
	dependsOn tasks.named('modernAdempierePackagesJar')
	dependsOn tasks.named('modernLegacyRuntimeJar')
	archiveFileName = 'ADInterface-Modern-1.0.war'
	destinationDirectory = layout.buildDirectory.dir('libs')
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	into('WEB-INF/classes') {
		from sourceSets.main.output
		from sourceSets.cxf.output
		from('WEB-INF/classes') {
			exclude 'META-INF/xfire/**'
			exclude 'com/_3e/ADInterface/ADService*.class'
			exclude 'com/_3e/ADInterface/ModelADService*.class'
			exclude 'com/globalqss/ObPOSInterface/ExternalSales*.class'
			exclude 'com/globalqss/ObPOSInterface/WebService*.class'
			exclude 'org/adempiere/webservice/legacy/**'
			exclude 'org/adempiere/webservice/router/**'
		}
	}
	into('WEB-INF/lib') {
		from configurations.cxfRuntimeClasspath.filter {
			it.isFile() && it.name.endsWith('.jar')
		}
		from tasks.named('modernLegacyRuntimeJar').flatMap {
			it.archiveFile
		}
		from tasks.named('modernAdempiereCoreJar').flatMap {
			it.archiveFile
		}
		from tasks.named('modernAdempierePackagesJar').flatMap {
			it.archiveFile
		}
	}
	into('WEB-INF/wsdl') {
		from('contracts/xfire-v1/wsdl')
	}
	into('WEB-INF') {
		from('src/cxf/webapp/WEB-INF/web.xml')
	}
}

tasks.register('verifyModernSoapWar', Exec) {
	description = 'Fails if the modern SOAP WAR contains legacy transport linkage'
	group = 'verification'
	dependsOn tasks.named('modernSoapWar')
	commandLine rootProject.file('scripts/phase4/verify-modern-soap-war.sh'),
			tasks.named('modernSoapWar').flatMap { it.archiveFile }.get().asFile
}
