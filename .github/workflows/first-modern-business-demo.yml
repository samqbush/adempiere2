name: First modern business demo bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-modern-business-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate demo contract
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify accepted contract chain
        uses: ./.github/actions/adempiere-build
        with:
          task: firstModernDemoFinalVerification phase5cFinalVerification

  build:
    name: Build demo bundle
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Stage accepted installed product
        uses: ./.github/actions/adempiere-build
        with:
          task: prepareFirstModernDemoContext
      - name: Build pinned linux/amd64 images
        run: |
          set -euo pipefail
          value() {
            awk -F= -v key="$1" '$1 == key {sub(/^[^=]*=/, ""); print; exit}' \
              demo/first-modern-business/contract.properties
          }
          context=build/first-modern-demo/context
          docker buildx build --platform linux/amd64 --load \
            --build-arg "JAVA_IMAGE=$(value java.image)" \
            --tag "$(value application.image)" \
            --file "$context/runtime/Dockerfile.app" "$context"
          docker buildx build --platform linux/amd64 --load \
            --build-arg "POSTGRES_IMAGE=$(value postgres.image)" \
            --tag "$(value database.image)" \
            --file "$context/runtime/Dockerfile.database" "$context/runtime"
      - name: Assemble bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_URL: >-
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          value() {
            awk -F= -v key="$1" '$1 == key {sub(/^[^=]*=/, ""); print; exit}' \
              demo/first-modern-business/contract.properties
          }
          bundle=build/first-modern-demo/bundle
          rm -rf "$bundle"
          mkdir -p "$bundle"
          docker save --output "$bundle/adempiere-modern-demo-images.tar" \
            "$(value application.image)" "$(value database.image)"
          cp demo/first-modern-business/compose.yaml "$bundle/compose.yaml"
          cp demo/first-modern-business/demo "$bundle/demo"
          cp demo/first-modern-business/contract.properties \
            "$bundle/contract.properties"
          cp docs/modernization/first-modern-business-demo.md \
            "$bundle/first-modern-business-demo.md"
          APP_IMAGE_NAME="$(value application.image)" \
          DB_IMAGE_NAME="$(value database.image)" \
          python3 - <<'PY'
          import json
          import os
          import tarfile
          from pathlib import Path

          archive_path = Path(
              "build/first-modern-demo/bundle/adempiere-modern-demo-images.tar"
          )
          with tarfile.open(archive_path) as archive:
              members_by_name = {}
              for member in archive.getmembers():
                  members_by_name.setdefault(member.name, []).append(member)

              def read_json_member(name):
                  members = members_by_name.get(name, [])
                  if len(members) != 1:
                      raise SystemExit(
                          f"demo image archive must contain exactly one {name}"
                      )
                  extracted = archive.extractfile(members[0])
                  if extracted is None:
                      raise SystemExit(
                          f"demo image archive member is unreadable: {name}"
                      )
                  return json.load(extracted)

              legacy_manifest = read_json_member("manifest.json")
              image_index = read_json_member("index.json")

              expected_tags = {
                  os.environ["APP_IMAGE_NAME"],
                  os.environ["DB_IMAGE_NAME"],
              }
              archived_tags = {
                  entry["RepoTags"][0]
                  for entry in legacy_manifest
                  if len(entry.get("RepoTags", [])) == 1
              }
              if len(legacy_manifest) != 2 or archived_tags != expected_tags:
                  raise SystemExit(
                      "demo image archive must contain exactly the two expected tags"
                  )

              def image_identities(tag):
                  matches = [
                      entry
                      for entry in legacy_manifest
                      if entry.get("RepoTags") == [tag]
                  ]
                  if len(matches) != 1:
                      raise SystemExit(
                          f"demo image archive does not contain exactly one {tag}"
                      )
                  config_path = matches[0].get("Config", "")
                  config_prefix = "blobs/sha256/"
                  if not config_path.startswith(config_prefix):
                      raise SystemExit(
                          f"demo image {tag} has invalid config {config_path}"
                      )
                  config_digest = "sha256:" + config_path.removeprefix(
                      config_prefix
                  )

                  descriptors = []
                  for descriptor in image_index.get("manifests", []):
                      manifest_digest = descriptor.get("digest", "")
                      digest_prefix = "sha256:"
                      if not manifest_digest.startswith(digest_prefix):
                          continue
                      image_manifest = read_json_member(
                          "blobs/sha256/"
                          + manifest_digest.removeprefix(digest_prefix)
                      )
                      if (
                          image_manifest.get("config", {}).get("digest")
                          == config_digest
                      ):
                          descriptors.append(descriptor)
                  if len(descriptors) != 1:
                      raise SystemExit(
                          f"demo image archive does not uniquely map {tag}"
                          " to an OCI manifest"
                      )
                  return config_digest, descriptors[0]["digest"]

              app_config, app_manifest = image_identities(
                  os.environ["APP_IMAGE_NAME"]
              )
              db_config, db_manifest = image_identities(
                  os.environ["DB_IMAGE_NAME"]
              )

          payload = {
              "schema": 2,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "workflow_run_id": os.environ["SOURCE_RUN_ID"],
              "workflow_run_url": os.environ["SOURCE_RUN_URL"].strip(),
              "application_image_config_digest": app_config,
              "application_image_manifest_digest": app_manifest,
              "database_image_config_digest": db_config,
              "database_image_manifest_digest": db_manifest,
          }
          Path("build/first-modern-demo/bundle/provenance.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          (
            cd "$bundle"
            sha256sum \
              adempiere-modern-demo-images.tar \
              compose.yaml demo contract.properties provenance.json \
              first-modern-business-demo.md >SHA256SUMS
          )
          chmod 0755 "$bundle/demo"
          tar -C "$bundle" -czf build/first-modern-demo/adempiere-modern-demo.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: first-modern-business-demo-bundle
          path: build/first-modern-demo/adempiere-modern-demo.tar.gz
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke downloaded demo bundle
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@v4
        with:
          name: first-modern-business-demo-bundle
          path: downloaded
      - name: Extract into a clean directory
        run: |
          set -euo pipefail
          mkdir clean-demo
          tar -C clean-demo -xzf downloaded/adempiere-modern-demo.tar.gz
          chmod 0755 clean-demo/demo
      - name: Exercise lifecycle and verifier
        run: |
          set -euo pipefail
          cd clean-demo
          ./demo init
          ./demo up
          ./demo verify | tee ../verification.txt
          cd ..
          ./gradlew :zkwebui:firstModernDemoPublicOriginSmoke \
            -PfirstModernDemoBaseUrl=http://127.0.0.1:8888 \
            -PfirstModernDemoRecordValue="DEMO-CI-${GITHUB_RUN_ID}" \
            -PfirstModernDemoEvidenceDir="$PWD/browser-evidence" \
            --dependency-verification=strict
          cd clean-demo
          ./demo reset
          ./demo verify | tee -a ../verification.txt
          ./demo status | tee ../status.txt
      - name: Collect logs
        if: always()
        run: |
          set +e
          if [[ -f clean-demo/.demo-state/demo.env ]]; then
            (
              cd clean-demo
              ./demo logs
              ./demo down
            ) >demo-containers.log 2>&1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-modern-business-demo-evidence
          path: |
            verification.txt
            status.txt
            browser-evidence/
            demo-containers.log
            zkwebui/build/test-results/firstModernDemoPublicOriginSmoke/
            zkwebui/build/reports/tests/firstModernDemoPublicOriginSmoke/
          if-no-files-found: error
          retention-days: 14
