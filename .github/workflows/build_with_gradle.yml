# This is a basic workflow to help you get started with Actions
# This file was contributed by Carlos Parada and Yamel Senih from ERP Consultores y Asociados, C.A
# Modifications by Edwin Betancourt

name: ADempiere Reproducible Gradle Gate

# Controls when the action will run.
#
# push and pull_request previously listed the same six branch patterns, so a
# pull request opened from a branch matching one of them triggered this
# workflow twice for the same commit. push is now limited to the long-lived
# branches, where it records trunk state; every other branch is covered by its
# pull request.
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

# Namespaced by workflow identity: concurrency groups are repository-wide, so
# an un-namespaced ref-based group would let this workflow cancel main.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  build-app:
    name: Core and module gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Build and test with the wrapper
        run: |
          scripts/phase1/generate-runtime-jar-inventory.sh
          git diff --exit-code -- gradle/phase1/runtime-jars.tsv
          ./gradlew build cyclonedxBom \
            verifyProjectTopology verifyJava21Bytecode \
            verifyTestClassification verifyTestResults \
            verifyPublicationContracts verifyReleaseVersion \
            verifyJdkInternalApiInventory verifyJdepsInternals \
            verifyPhase2RuntimePins \
            --dependency-verification=strict
          test -s build/reports/bom.json
          test -s build/reports/bom.xml
        env:
          ADEMPIERE_LIBRARY_VERSION: 'test-version'

      - name: Prove the core gate detects behavior mutations
        run: scripts/phase1/verify-mutation.sh

      - name: Restore complete core test evidence
        run: ./gradlew :base:test verifyTestResults --rerun-tasks

      - name: Probe empty Tomcat 9 bridge on JDK 21
        run: scripts/phase2/probe-tomcat9.sh

      - name: Publish test and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-gradle-evidence
          path: |
            base/build/test-results/test/
            base/build/reports/tests/test/
            build/reports/bom.*
            build/phase2/

  publication-contract:
    name: Publication contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Generate POMs and publish to an isolated repository
        run: |
          ./gradlew generatePomFileForMavenJavaPublication \
            publishMavenJavaPublicationToPhase2Repository \
            verifyPublicationContracts --dependency-verification=strict
        env:
          ADEMPIERE_LIBRARY_VERSION: 'test-version'

  phase-2-runtime:
    name: JDK 21 disposable runtime smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Install runtime smoke dependencies
        run: sudo apt-get update && sudo apt-get install --yes xvfb postgresql-client
      - name: Run database, Swing, Groovy, and scheduler smoke
        run: |
          xvfb-run -a ./gradlew :base:phase2RuntimeSmoke \
            -Pphase2DbSystemPassword=postgres \
            --dependency-verification=strict
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-runtime-evidence
          path: |
            base/build/test-results/phase2Smoke/
            base/build/reports/tests/phase2Smoke/
            base/build/phase2/evidence/
      - name: Clean disposable runtime and database
        if: always()
        run: |
          ./gradlew :base:destroyPhase2Database :base:cleanupPhase2Runtime \
            -Pphase2DbSystemPassword=postgres \
            --dependency-verification=strict
