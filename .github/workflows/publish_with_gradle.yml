# This is a basic workflow to help you get started with Actions
# This file was contributed by Carlos Parada and Yamel Senih from ERP Consultores y Asociados, C.A

name: Publish With gradle to maven central

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  release:
    types: 
      - published

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # Build dist application backend
  build-app:
    name: Publish with gradle to maven central
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Reject an existing Maven Central version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          test -n "$RELEASE_VERSION"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://repo1.maven.org/maven2/io/github/adempiere/base/${RELEASE_VERSION}/base-${RELEASE_VERSION}.pom")"
          test "$status" = "404"

      - name: Publish with Gradle
        run: |
          ./gradlew verifyReleaseVersion verifyPublicationContracts publish \
            --dependency-verification=strict
        env:
          ADEMPIERE_RELEASE: 'true'
          ADEMPIERE_LIBRARY_VERSION: ${{ github.event.release.tag_name }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.PGP_SECRET }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.PGP_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.OSSRH_USERNAME }}
