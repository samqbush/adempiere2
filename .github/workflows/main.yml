name: ADempiere Phase 3 Build

on:
  push:
    branches:
      - master
      - develop
      - bugfix/**
      - feature/**
      - hotfix/**
      - test/**
  pull_request:
    branches:
      - master
      - develop
      - bugfix/**
      - feature/**
      - hotfix/**
      - test/**

permissions:
  contents: read

jobs:
  no-database-distribution:
    name: Full product without database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build complete Phase 3 distribution
        uses: ./.github/actions/adempiere-build
        with:
          task: phase3NoDatabaseDistribution
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-no-database-evidence
          if-no-files-found: error
          path: |
            build/phase3/evidence/
            install/build/Adempiere_*.zip
            install/build/Adempiere_*.tar.gz

  installed-product:
    name: PostgreSQL 14.6 and Tomcat 9 installed product
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADEMPIERE_PHASE2_DB_SYSTEM_PASSWORD: postgres
      ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run installed-product gate
        uses: ./.github/actions/adempiere-build
        with:
          task: phase3InstalledProduct
      - name: Upload installed-product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-installed-product-evidence
          if-no-files-found: error
          path: |
            build/phase3/evidence/
            base/build/phase2/evidence/
            base/build/phase3/evidence/
            base/build/test-results/
            base/build/reports/tests/

  phase-4-contracts:
    name: Phase 4 final contract and removal gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify frozen contracts and XFire removal
        uses: ./.github/actions/adempiere-build
        with:
          task: phase4FinalVerification
      - name: Upload Phase 4 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-final-contract-evidence
          if-no-files-found: error
          path: |
            build/phase4/evidence/

  phase-4-installed-api:
    name: Phase 4 installed XFire-free API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify the installed XFire-free SOAP API
        uses: ./.github/actions/adempiere-build
        with:
          task: phase4InstalledApi
      - name: Upload installed Phase 4 API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-installed-api-evidence
          if-no-files-found: error
          path: |
            build/phase4/evidence/

  phase-5b-oracle-contracts:
    name: Phase 5b frozen web oracle and artifact pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify the frozen legacy web oracle, coverage and pins
        uses: ./.github/actions/adempiere-build
        with:
          task: phase5bFinalVerification
      - name: Upload Phase 5b contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5b-oracle-contract-evidence
          if-no-files-found: error
          path: |
            build/phase5/evidence/

  phase-5b-web-oracle:
    name: Phase 5b installed Tomcat 9 web oracle replay
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADEMPIERE_PHASE2_DB_SYSTEM_PASSWORD: postgres
      ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Replay the frozen legacy web oracle against the installed product
        uses: ./.github/actions/adempiere-build
        with:
          task: phase5bLegacyWebOracleSmoke
      - name: Upload Phase 5b oracle replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5b-web-oracle-evidence
          if-no-files-found: error
          path: |
            build/phase5b/replay/

  phase-5c-packaging:
    name: Phase 5c Jakarta web packaging beachhead
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify packaging, transformer, overlay and loopback runtime
        uses: ./.github/actions/adempiere-build
        with:
          task: phase5cFinalVerification
      - name: Upload Phase 5c packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5c-packaging-evidence
          if-no-files-found: error
          path: |
            build/phase5c/
            zkwebui/build/phase5c/transformer/
            zkwebui/build/libs/webui-modern.war

  phase-5c-browser-oracle:
    name: Phase 5c semantic browser oracle replay
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADEMPIERE_PHASE2_DB_SYSTEM_PASSWORD: postgres
      ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Replay browser oracles and rehearse Phase 5c rollback
        uses: ./.github/actions/adempiere-build
        with:
          task: phase5cRollbackRehearsal
      - name: Upload Phase 5c browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5c-browser-oracle-evidence
          if-no-files-found: error
          path: |
            zkwebui/build/phase5c/browser/
            zkwebui/build/test-results/browserTest/
            zkwebui/build/reports/tests/browserTest/
            build/phase3/runtime/Adempiere/tomcat/logs/
            build/phase5b/replay/
            build/phase5c/rollback/rollback-evidence.txt

  phase-5d-functional-slice:
    name: Phase 5d functional ZK CE 10 slice
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify the Phase 5d compile closure, WAR, overlays and rollback
        uses: ./.github/actions/adempiere-build
        with:
          task: phase5dFinalVerification
      - name: Upload Phase 5d functional-slice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5d-functional-slice-evidence
          if-no-files-found: warn
          path: |
            build/phase5/evidence/
            build/phase5/generated/
            build/phase5c/
            build/phase5d/
            zkwebui/build/phase5d/
            zkwebui/build/test-results/modernUiTest/
            zkwebui/build/reports/tests/modernUiTest/
            zkwebui/build/libs/webui-modern.war

  phase-5d-modern-web:
    name: Phase 5d modern web milestone
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADEMPIERE_PHASE2_DB_SYSTEM_PASSWORD: postgres
      ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run the Phase 5d modern browser and coexistence milestone
        uses: ./.github/actions/adempiere-build
        with:
          task: phase5dModernWebSmoke
      - name: Upload Phase 5d browser, database and coexistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5d-modern-web-evidence
          if-no-files-found: warn
          path: |
            build/phase5d/
            build/phase3/runtime/Adempiere/tomcat/logs/
            zkwebui/build/test-results/modernBrowserTest/
            zkwebui/build/reports/tests/modernBrowserTest/

  phase-5e-cohort-routing:
    name: Phase 5e cohort routing contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify the Phase 5e cohort model, bridge, derived artifact, overlay and rollback
        uses: ./.github/actions/adempiere-build
        with:
          task: phase5eFinalVerification
      - name: Upload Phase 5e contract, mutation and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5e-cohort-routing-evidence
          if-no-files-found: warn
          # build/phase5e/rollback/ holds two fully extracted 394LTS trees and
          # the two rebuilt archives - roughly a gigabyte per run, none of which
          # is evidence. Only the recorded outcome and the installer merge log
          # are uploaded; the digests inside them are what a reviewer reads.
          path: |
            build/phase5/evidence/
            build/phase5e/legacy-webui/derived-provenance.tsv
            build/phase5e/rollback/rollback-evidence.txt
            build/phase5e/rollback/setupwlib-ant.log
            org.adempiere.cohort/build/test-results/
            org.adempiere.cohort/build/reports/tests/
            zkwebui/build/test-results/routedContractTest/
            zkwebui/build/reports/tests/routedContractTest/

  phase-5e-public-origin:
    name: Phase 5e public-origin cohort matrix
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADEMPIERE_PHASE2_DB_SYSTEM_PASSWORD: postgres
      ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run the Phase 5e public-origin cohort, isolation and lifecycle matrix
        uses: ./.github/actions/adempiere-build
        with:
          task: phase5eCohortRoutingSmoke
      # The handoff key is generated into build/phase5e/keys and is deliberately
      # NOT in any upload path below. A CI artifact is a published archive, and a
      # published archive is exactly where a shared secret must never be.
      - name: Upload Phase 5e cohort matrix, isolation and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5e-public-origin-evidence
          if-no-files-found: warn
          path: |
            build/phase5e/evidence/
            build/phase3/runtime/Adempiere/tomcat/logs/
            build/phase5e/tomcat10/logs/
            zkwebui/build/test-results/routedBrowserTest/
            zkwebui/build/reports/tests/routedBrowserTest/
