# ADempiere modernization gates
#
# Two lanes, per MODERNIZATION_PLAN.md item 3.7:
#
#   Lane 1 (pull_request, blocking)
#     * Contracts                    - every database-neutral phase gate
#     * Current-phase database smoke - the runtime gate for the phase under
#                                      active development
#
#   Lane 2 (push:develop, nightly, manual; non-blocking)
#     * Regression matrix            - the database-backed smokes for phases
#                                      already merged
#
# The Contracts job runs the head of the Gradle gate chain plus the one gate
# that is not on it. Every earlier database-neutral gate is reached
# transitively, so running them as separate jobs only re-executes work. See
# docs/modernization/ci-topology.md for the measured task counts.
name: ADempiere modernization gates

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop
  schedule:
    # Off the hour: scheduled runs queued at :00 are the most likely to be
    # delayed or dropped by GitHub under load.
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      # A strict choice, never free text: .github/actions/adempiere-build
      # expands `task` unquoted so that a multi-task gate shares one task
      # graph. Only values from this allowlist can reach that expansion.
      debug_gate:
        description: >-
          Debug lane. `full` runs the ordinary manual matrix. Any other value
          runs only that single Phase 5f shard on Current-phase database
          smoke, and suppresses Contracts and the regression matrix.
        required: false
        default: full
        type: choice
        options:
          - full
          - phase5fROOTRoutesSmokeShard
          - phase5fWstoreRoutesSmokeShard
          - phase5fWebuiRoutesSmokeShard
          - phase5fAdminRoutesSmokeShard
          - phase5fMobileRoutesSmokeShard
          - phase5fAdempiereRoutesSmokeShard

permissions:
  contents: read

# Concurrency groups are repository-wide, not scoped to a workflow, so the
# group is namespaced by workflow identity. Without that, this workflow would
# cancel runs of build_with_gradle.yml on the same ref.
#
# Only pull-request runs are cancelled in progress. A push, nightly or manual
# run is a regression record; cancelling it midway would leave the phases it
# covers unverified with no indication that anything was skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --------------------------------------------------------------------------
  # Lane 1: the blocking pull-request gate.
  # --------------------------------------------------------------------------

  # Deliberately phase-neutral name. Branch protection references a check by
  # name, so the name must not move when the current phase advances; only the
  # Gradle task arguments below change from one phase to the next.
  contracts:
    name: Contracts
    # A single-shard debug dispatch exists to buy one cheap runtime data point.
    # Contracts has no bearing on that question and would spend roughly half an
    # hour of runner time re-proving an already-green graph.
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.debug_gate == 'full'
    # 24.04 is required: this graph includes the Phase 5c/5d browser contract
    # tasks, whose pinned browser artifacts are built against that image.
    runs-on: ubuntu-24.04
    # Contracts is database-neutral and completes in roughly half an hour. A run
    # that exceeds this is hung, not slow, and must not hold a runner for the
    # six-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # One invocation, one task graph. phase5g1aFinalVerification chains
      # phase5g0FinalVerification, which chains
      # phase5fFinalVerification, which transitively covers
      # phase3NoDatabaseDistribution, phase4FinalVerification and the Phase
      # 5a/5b/5c/5d/5e gates; phase5cFinalVerification contributes only
      # :zkwebui:check, which is not on that chain.
      - name: Verify every database-neutral phase gate
        uses: ./.github/actions/adempiere-build
        with:
          task: phase5g1aFinalVerification phase5cFinalVerification

      # if-no-files-found: error is satisfied by any one matching path, so an
      # upload block that also matches an evidence directory cannot detect a
      # missing archive. Assert the archives explicitly.
      #
      # scripts/phase3/run-isolated-ant-build.sh rsync-excludes /install/build/
      # and stages the archives into build/phase3/release/. install/build/ is an
      # internal reactor scratch directory, not a stable handoff.
      - name: Assert the distribution archives were staged
        run: |
          set -euo pipefail
          for archive in \
            build/phase3/release/Adempiere_394LTS.zip \
            build/phase3/release/Adempiere_394LTS.tar.gz
          do
            if [[ ! -s "$archive" ]]; then
              echo "Distribution archive missing or empty: $archive" >&2
              exit 1
            fi
            echo "ok  $archive  $(wc -c < "$archive") bytes"
          done

      # The Phase 5f tracked-input immutability finalizer only guards the tasks
      # inside its own aggregate, so any task scheduled after it is unchecked.
      # This postcondition covers the whole invocation regardless of ordering.
      #
      # Two tracked binaries are excluded: the Ant reactor regenerates
      # lib/ADInterface-1.0.war and lib/mysql-connector-java-5.1.13-bin.jar in
      # place as a build side effect. That is a pre-existing repository
      # condition - they are build outputs that happen to be tracked - and is
      # exactly why Phase 5f pins that same pair. Everything else must come out
      # byte-identical.
      - name: Assert the verification did not mutate tracked files
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- . \
            ':(exclude)lib/ADInterface-1.0.war' \
            ':(exclude)lib/mysql-connector-java-5.1.13-bin.jar'
          then
            echo "::error::The verification mutated tracked files outside the two known regenerated build artifacts"
            exit 1
          fi
          # Keep the known side effect visible rather than silent.
          echo 'Known regenerated build artifacts (not a failure):'
          git diff --stat -- \
            lib/ADInterface-1.0.war \
            lib/mysql-connector-java-5.1.13-bin.jar

      - name: Upload contract and distribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-evidence
          # Necessarily 'warn': this is the union of the paths produced by seven
          # former jobs, and no single gate produces all of them. The archives,
          # which are the outputs worth failing over, are asserted with test -s
          # above rather than left to this action.
          if-no-files-found: warn
          path: |
            build/phase3/evidence/
            build/phase4/evidence/
            build/phase5/evidence/
            build/phase5/generated/
            build/phase5c/
            build/phase5d/
            build/phase5e/legacy-webui/derived-provenance.tsv
            build/phase5e/rollback/rollback-evidence.txt
            build/phase5e/rollback/setupwlib-ant.log
            build/phase5f/
            build/phase3/release/Adempiere_394LTS.zip
            build/phase3/release/Adempiere_394LTS.tar.gz
            serverRoot/build/phase5f-wars/
            serverRoot/build/test-results/
            org.adempiere.cohort/build/test-results/
            org.adempiere.cohort/build/reports/tests/
            zkwebui/build/test-results/
            zkwebui/build/reports/tests/
            zkwebui/build/phase5c/transformer/
            zkwebui/build/phase5d/
            zkwebui/build/libs/webui-modern.war

  # The runtime gate for the phase under active development. This slot holds
  # phase5fJakartaWebRoutesSmoke, and this job is meant to reflect the state of
  # the phase under development.
  #
  # All six route shards execute in a single run. Run 33379849664 recorded 129
  # observations with zero vector failures - / (16), /wstore (68), /webui (6),
  # /admin (4), /mobile (14), /adempiere (21) - and passed the strict aggregate
  # verifyPhase5fRuntimeEvidence. The gate is GREEN.
  # See docs/modernization/phase-5f-evidence.md.
  current-phase-smoke:
    name: Current-phase database smoke
    runs-on: ubuntu-24.04
    # Without this, a runtime that never becomes ready holds a runner for the
    # six-hour default. Run 33290776432 burned 1h16m before the lane's own
    # readiness budget expired. The step-level budget in start-routed-lane.sh
    # is the real bound; this is the backstop for a hang that outlives it, and
    # is deliberately loose enough that the always() evidence upload and the
    # marker-guarded database cleanup still run.
    #
    # Raised from 90 with --continue below: the job no longer stops at the
    # first failing shard, so a run now executes the whole matrix. Setup is
    # roughly 22 minutes and the dump-backed observation matrix is roughly 81,
    # which does not fit in 90. The GitHub-hosted ceiling is 360.
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:14.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADEMPIERE_PHASE2_DB_SYSTEM_PASSWORD: postgres
      ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # --continue weakens nothing. verifyPhase5fRuntimeEvidence dependsOn all
      # six shards, so a failed shard skips the strict aggregate and the build
      # still fails; startPhase5fRoutedLane remains finalizedBy
      # stopPhase5fRoutedLane and the marker-guarded database cleanup finalizer
      # still runs. What it buys is six data points per run instead of one,
      # which at roughly two runner-hours per attempt is the difference between
      # converging and guessing.
      - name: Run the current phase public-origin runtime gate
        uses: ./.github/actions/adempiere-build
        with:
          task: >-
            ${{ (github.event_name == 'workflow_dispatch'
                 && inputs.debug_gate != 'full')
                && inputs.debug_gate
                || 'phase5fJakartaWebRoutesSmoke' }}
          args: --continue
      # build/phase5e/keys holds the generated handoff secret and is excluded
      # from every path below. A CI artifact is a published archive.
      - name: Upload current-phase runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-phase-smoke-evidence
          if-no-files-found: warn
          path: |
            build/phase5f/runtime-evidence/
            build/phase5f/tomcat10/logs/
            build/phase5e/evidence/
            build/phase3/runtime/Adempiere/tomcat/logs/
            build/phase5e/tomcat10/logs/
            zkwebui/build/test-results/routedBrowserTest/
            zkwebui/build/reports/tests/routedBrowserTest/

  # --------------------------------------------------------------------------
  # Lane 2: post-merge regression matrix. Non-blocking by design.
  #
  # These smokes cover phases already merged. Moving them off the pull-request
  # gate is a deliberate reduction in pre-merge coverage, recorded as a
  # residual risk in MODERNIZATION_PLAN.md and docs/modernization/ci-topology.md.
  # A red run here must be treated as a stop-the-line event, not a warning.
  # --------------------------------------------------------------------------
  regression-matrix:
    name: Regression matrix (${{ matrix.gate }})
    # Excluded from a single-shard debug dispatch: without the second clause a
    # request for one Phase 5f shard would also launch six historical
    # database-backed smokes.
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_dispatch'
          || inputs.debug_gate == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # One phase failing must not hide the state of the others.
      fail-fast: false
      matrix:
        gate:
          - phase3InstalledProduct
          - phase4InstalledApi
          - phase5bLegacyWebOracleSmoke
          - phase5cRollbackRehearsal
          - phase5dModernWebSmoke
          - phase5eCohortRoutingSmoke
    services:
      postgres:
        image: postgres:14.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADEMPIERE_PHASE2_DB_SYSTEM_PASSWORD: postgres
      ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run ${{ matrix.gate }}
        uses: ./.github/actions/adempiere-build
        with:
          task: ${{ matrix.gate }}
      - name: Upload ${{ matrix.gate }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.gate }}-evidence
          # Necessarily 'warn': this path block is the union across six gates
          # and each produces only its own subset.
          #
          # build/phase5e/ is listed by specific subpath, never wholesale:
          # phase5eCohortRoutingSmoke generates the shared handoff secret into
          # build/phase5e/keys, and a CI artifact is a published archive.
          if-no-files-found: warn
          path: |
            build/phase3/evidence/
            build/phase4/evidence/
            build/phase5b/replay/
            build/phase5c/rollback/rollback-evidence.txt
            build/phase5d/
            build/phase5e/evidence/
            build/phase5e/tomcat10/logs/
            build/phase3/runtime/Adempiere/tomcat/logs/
            base/build/phase2/evidence/
            base/build/phase3/evidence/
            base/build/test-results/
            base/build/reports/tests/
            zkwebui/build/phase5c/browser/
            zkwebui/build/test-results/
            zkwebui/build/reports/tests/
