name: ADempiere guarded Gradle gate
description: >-
  Runs one or more ADempiere modernization Gradle gates through the same guarded
  lifecycle used by local builds.
author: ADempiere
inputs:
  task:
    description: >-
      One or more Gradle lifecycle tasks, space separated. Multiple tasks are
      run in a single invocation so they share one task graph and Gradle
      de-duplicates the work they have in common.
    required: false
    default: ''
  nodbrestore:
    description: Backward-compatible selector; false runs the installed-product gate
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Run the requested Gradle gate
      shell: bash
      run: |
        set -euo pipefail
        task='${{ inputs.task }}'
        if [[ -z "$task" ]]; then
          if [[ '${{ inputs.nodbrestore }}' == 'false' ]]; then
            task=phase3InstalledProduct
          else
            task=phase3NoDatabaseDistribution
          fi
        fi
        # Deliberately unquoted: $task may name several tasks, and they must
        # reach Gradle as separate arguments so they share one task graph.
        # shellcheck disable=SC2086
        xvfb-run -a ./gradlew $task --dependency-verification=strict
