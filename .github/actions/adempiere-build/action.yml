name: ADempiere Phase 3 Build
description: Runs the same guarded Phase 3 Gradle lifecycle used by local builds
author: ADempiere
inputs:
  task:
    description: Phase 3 Gradle lifecycle task
    required: false
    default: ''
  nodbrestore:
    description: Backward-compatible selector; false runs the installed-product gate
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Run Phase 3 lifecycle
      shell: bash
      run: |
        task='${{ inputs.task }}'
        if [[ -z "$task" ]]; then
          if [[ '${{ inputs.nodbrestore }}' == 'false' ]]; then
            task=phase3InstalledProduct
          else
            task=phase3NoDatabaseDistribution
          fi
        fi
        xvfb-run -a ./gradlew "$task" --dependency-verification=strict
