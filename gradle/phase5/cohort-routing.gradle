// Phase 5e: the derived legacy WAR, the routed runtime lane, the installed and
// release overlays, and the two canonical gates.
//
// Two gates, split the way Phase 5b and Phase 5d split theirs:
//
//   phase5eCohortRoutingSmoke   database-backed. Boots the derived Tomcat 9
//                               public ingress and the modern Tomcat 10 lane
//                               against one marker-owned PostgreSQL, drives the
//                               complete public-origin cohort matrix through a
//                               browser, proves concurrent identity isolation
//                               and lifecycle cleanup, and replays the Phase 4
//                               SOAP corpus while modern sessions are
//                               authenticated.
//
//   phase5eFinalVerification    database-neutral. Cohort and handoff unit
//                               tests, the isolated bridge closure, the derived
//                               artifact diff contract, the public route
//                               contract, the installed and release overlays,
//                               rollback that survives setupWLib, and every
//                               still-valid Phase 4 / 5b / 5c / 5d assertion.
//
// phase5dFinalVerification IS chained: Phase 5d's direct /webui-modern lane
// remains a regression gate in its own right, and Phase 5e's changes to the
// modern WAR (the handoff filter, cookie-only tracking, the protocol jar) have
// to leave it green.

def phase5ePristineWar = rootProject.layout.buildDirectory
	.file('phase5d/legacy-webui/webui.war')
def phase5eModernWar = rootProject.layout.projectDirectory
	.file('zkwebui/build/libs/webui-modern.war')
def phase5eDerivedDir = rootProject.layout.buildDirectory.dir('phase5e/legacy-webui')
def phase5eDerivedWar = phase5eDerivedDir.map { it.file('webui.war') }
def phase5eEvidenceDir = rootProject.layout.buildDirectory.dir('phase5e/evidence')
def phase5eInstalledHome =
	rootProject.layout.buildDirectory.dir('phase3/runtime/Adempiere')
def phase5eReleaseHome =
	rootProject.layout.buildDirectory.dir('phase3/release/Adempiere').get()
def phase5eContractDir = rootProject.file('contracts/phase5e-routed-web-v1')

def phase5eWebXmlInsert = rootProject.file('gradle/phase5/derived-web-xml-insert.xml')
def phase5eSessionConfig =
	rootProject.file('gradle/phase5/derived-web-xml-session-config.xml')
def phase5eZkXmlInsert = rootProject.file('gradle/phase5/derived-zk-xml-insert.xml')

def phase5eBridgeJarEntry = 'WEB-INF/lib/webui-cohort-bridge.jar'
def phase5eWebXmlEntry = 'WEB-INF/web.xml'
def phase5eZkXmlEntry = 'WEB-INF/zk.xml'

// The exact anchors the derivation edits. They are declared here rather than
// discovered so a frozen descriptor that no longer contains them fails loudly
// instead of producing an archive with a silently unregistered router.
def phase5eFilterAnchor = '\t<filter>\n\t\t<filter-name>requestFilter</filter-name>'
def phase5eSessionAnchor =
	'\t<session-config>\n\t\t<session-timeout>60</session-timeout>\n\t</session-config>'
def phase5eZkAnchor = '\t<log>'

def phase5eDbHost = providers.gradleProperty('phase3DbHost').orElse('127.0.0.1')
def phase5eDbPort = providers.gradleProperty('phase3DbPort').orElse('5432')
def phase5eDbName = providers.gradleProperty('phase3DbName')
	.orElse('adempiere_phase3_ci')
def phase5eDbUser = providers.gradleProperty('phase3DbUser')
	.orElse('adempiere_phase3_ci')
def phase5eDbPassword = providers.gradleProperty('phase3DbPassword')
	.orElse('adempiere_phase3_ci')
def phase5eDatabaseMarker = 'ADempiere Phase 3 disposable database'

def phase5eSha512 = { byte[] content ->
	java.security.MessageDigest.getInstance('SHA-512')
		.digest(content).encodeHex().toString()
}

def phase5eReadRows = { File file ->
	if (!file.isFile()) {
		throw new GradleException("Missing Phase 5e contract ${file}")
	}
	file.readLines('UTF-8')
		.findAll { !it.trim().isEmpty() && !it.startsWith('#') }
		.collect { it.split('\t', -1) }
}

/** Reads every entry of an archive as name -> bytes, in archive order. */
def phase5eEntries = { File archive ->
	def entries = new LinkedHashMap<String, byte[]>()
	new java.util.zip.ZipFile(archive).withCloseable { zip ->
		zip.entries().each { entry ->
			if (!entry.directory) {
				entries[entry.name] = zip.getInputStream(entry).withCloseable {
					it.readAllBytes()
				}
			}
		}
	}
	entries
}

/**
 * The derived descriptors, computed from the frozen text and the reviewed
 * insert files.
 *
 * <p>Both the derivation and its verification call this, so "the derived
 * descriptor is the frozen descriptor plus exactly these blocks" is recomputed
 * rather than asserted.
 */
def phase5eDeriveWebXml = { String frozen ->
	if (!frozen.contains(phase5eFilterAnchor)) {
		throw new GradleException(
			'The frozen WEB-INF/web.xml no longer declares requestFilter where ' +
			'the Phase 5e overlay inserts the router')
	}
	if (!frozen.contains(phase5eSessionAnchor)) {
		throw new GradleException(
			'The frozen WEB-INF/web.xml no longer declares the 60 minute ' +
			'session-config the Phase 5e overlay replaces')
	}
	frozen
		.replace(phase5eFilterAnchor,
			phase5eWebXmlInsert.getText('UTF-8') + phase5eFilterAnchor)
		.replace(phase5eSessionAnchor,
			phase5eSessionConfig.getText('UTF-8').replaceFirst(/\n$/, ''))
}

def phase5eDeriveZkXml = { String frozen ->
	if (!frozen.contains(phase5eZkAnchor)) {
		throw new GradleException(
			'The frozen WEB-INF/zk.xml no longer contains the <log> element the ' +
			'Phase 5e overlay anchors on')
	}
	frozen.replace(phase5eZkAnchor,
		phase5eZkXmlInsert.getText('UTF-8') + '\n' + phase5eZkAnchor)
}

// ---------------------------------------------------------------------------
// Derived legacy artifact
// ---------------------------------------------------------------------------

/**
 * Writes the derived archive.
 *
 * Deterministic by construction: entries are sorted by name, every timestamp is
 * fixed at the epoch, and the compression level is fixed. The installed product
 * and both release archives pin this artifact's digest, so "the same inputs
 * produce the same bytes" has to be a property of the derivation rather than of
 * the machine that ran it.
 */
ext.phase5eDeriveArchive = { File pristine, File bridgeJar, File target ->
	if (!pristine.isFile()) {
		throw new GradleException("The frozen legacy WAR ${pristine} is missing")
	}
	def entries = phase5eEntries(pristine)
	if (entries.containsKey(phase5eBridgeJarEntry)) {
		throw new GradleException(
			"The frozen legacy WAR already contains ${phase5eBridgeJarEntry}")
	}
	def derived = new LinkedHashMap<String, byte[]>(entries)
	derived[phase5eWebXmlEntry] = phase5eDeriveWebXml(
		new String(entries[phase5eWebXmlEntry], 'UTF-8')).getBytes('UTF-8')
	derived[phase5eZkXmlEntry] = phase5eDeriveZkXml(
		new String(entries[phase5eZkXmlEntry], 'UTF-8')).getBytes('UTF-8')
	derived[phase5eBridgeJarEntry] = bridgeJar.bytes

	target.parentFile.mkdirs()
	def temporary = new File(target.parentFile, target.name + '.tmp')
	new java.util.zip.ZipOutputStream(
			new java.io.BufferedOutputStream(
				new java.io.FileOutputStream(temporary))).withCloseable { out ->
		out.setLevel(java.util.zip.Deflater.BEST_COMPRESSION)
		derived.keySet().sort().each { name ->
			def entry = new java.util.zip.ZipEntry(name)
			entry.setTime(0L)
			out.putNextEntry(entry)
			out.write(derived[name])
			out.closeEntry()
		}
	}
	if (target.exists()) {
		target.delete()
	}
	if (!temporary.renameTo(target)) {
		throw new GradleException("Could not write the derived WAR ${target}")
	}
	[frozen: entries, derived: derived]
}

tasks.register('derivePhase5eLegacyWebWar') {
	group = 'build'
	description = 'Derives the routed Tomcat 9 webui.war from the frozen Phase 5b artifact'
	dependsOn(
		tasks.named('materializePhase5dLegacyWebArtifacts'),
		':org.adempiere.cohort:bridgeOverlayJar')
	inputs.file phase5ePristineWar
	inputs.files(phase5eWebXmlInsert, phase5eSessionConfig, phase5eZkXmlInsert)
	inputs.file project(':org.adempiere.cohort').tasks
		.named('bridgeOverlayJar').flatMap { it.archiveFile }
	outputs.file phase5eDerivedWar
	outputs.file phase5eDerivedDir.map { it.file('derived-provenance.tsv') }
	doLast {
		def pristine = phase5ePristineWar.get().asFile
		def bridgeJar = project(':org.adempiere.cohort').tasks
			.named('bridgeOverlayJar').get().archiveFile.get().asFile
		def target = phase5eDerivedWar.get().asFile
		def result = project.phase5eDeriveArchive(pristine, bridgeJar, target)

		def provenance = new File(target.parentFile, 'derived-provenance.tsv')
		provenance.withWriter('UTF-8') { writer ->
			writer.writeLine('# Phase 5e derived legacy web artifact')
			writer.writeLine('# key\tvalue')
			writer.writeLine("pristine_sha512\t${phase5eSha512(pristine.bytes)}")
			writer.writeLine("derived_sha512\t${phase5eSha512(target.bytes)}")
			writer.writeLine("bridge_sha512\t${phase5eSha512(bridgeJar.bytes)}")
			writer.writeLine("pristine_entries\t${result.frozen.size()}")
			writer.writeLine("derived_entries\t${result.derived.size()}")
		}
		logger.lifecycle(
			"Phase 5e derived legacy WAR: ${result.derived.size()} entries " +
			"(${result.derived.size() - result.frozen.size()} added, 2 descriptors replaced)")
	}
}

tasks.register('verifyPhase5eDerivedLegacyWar') {
	group = 'verification'
	description = 'Proves the derived legacy WAR differs from the frozen one by exactly the reviewed set'
	dependsOn tasks.named('derivePhase5eLegacyWebWar')
	inputs.file phase5eDerivedWar
	inputs.file new File(phase5eContractDir, 'derived-artifact-diff.tsv')
	outputs.file rootProject.layout.buildDirectory
		.file('phase5/evidence/phase5e-derived-artifact.tsv')
	doLast {
		def pristine = phase5eEntries(phase5ePristineWar.get().asFile)
		def derived = phase5eEntries(phase5eDerivedWar.get().asFile)
		def contract = [:]
		phase5eReadRows(new File(phase5eContractDir, 'derived-artifact-diff.tsv'))
			.each { row -> contract[row[0]] = row[1] }
		def problems = []

		// 1. Nothing outside the reviewed diff may change, in either direction.
		(pristine.keySet() + derived.keySet()).sort().each { name ->
			def disposition = contract[name]
			def before = pristine[name]
			def after = derived[name]
			if (disposition == null) {
				if (before == null) {
					problems << "${name} was added without a reviewed disposition"
				} else if (after == null) {
					problems << "${name} was removed without a reviewed disposition"
				} else if (!java.util.Arrays.equals(before, after)) {
					problems << "${name} changed without a reviewed disposition"
				}
				return
			}
			switch (disposition) {
				case 'added':
					if (before != null) {
						problems << "${name} is declared added but exists in the frozen WAR"
					}
					if (after == null) {
						problems << "${name} is declared added but is not in the derived WAR"
					}
					break
				case 'replaced':
					if (before == null || after == null) {
						problems << "${name} is declared replaced but is missing on one side"
					} else if (java.util.Arrays.equals(before, after)) {
						problems << "${name} is declared replaced but is unchanged"
					}
					break
				default:
					problems << "${name} carries the unknown disposition ${disposition}"
			}
		}

		// 2. The replaced descriptors must be exactly the frozen text plus the
		//    reviewed inserts, recomputed here rather than trusted.
		if (pristine[phase5eWebXmlEntry] != null && derived[phase5eWebXmlEntry] != null) {
			def expected = phase5eDeriveWebXml(
				new String(pristine[phase5eWebXmlEntry], 'UTF-8'))
			if (new String(derived[phase5eWebXmlEntry], 'UTF-8') != expected) {
				problems << 'the derived WEB-INF/web.xml is not the frozen ' +
					'descriptor plus gradle/phase5/derived-web-xml-insert.xml'
			}
		}
		if (pristine[phase5eZkXmlEntry] != null && derived[phase5eZkXmlEntry] != null) {
			def expected = phase5eDeriveZkXml(
				new String(pristine[phase5eZkXmlEntry], 'UTF-8'))
			if (new String(derived[phase5eZkXmlEntry], 'UTF-8') != expected) {
				problems << 'the derived WEB-INF/zk.xml is not the frozen ' +
					'descriptor plus gradle/phase5/derived-zk-xml-insert.xml'
			}
		}

		// 3. Both Phase 5e registrations must actually be present.
		def webXml = new String(derived[phase5eWebXmlEntry] ?: new byte[0], 'UTF-8')
		[
			'org.adempiere.web.bridge.CohortRoutingFilter': 'the public cohort router',
			'org.adempiere.web.bridge.CohortBridgeStartupListener':
				'the deployment-completeness listener',
			'phase5eCohortRouter'                        : 'the router filter name',
			'<tracking-mode>COOKIE</tracking-mode>'      : 'cookie-only session tracking',
		].each { needle, reason ->
			if (!webXml.contains(needle)) {
				problems << "the derived WEB-INF/web.xml does not declare ${reason}"
			}
		}
		// The frozen descriptor's schema version must NOT move. Raising it to
		// 3.0 would enable web-fragment and annotation scanning for an archive
		// that was frozen without them, which is a far larger behavioural change
		// than any Phase 5e makes deliberately.
		if (!webXml.contains('version="2.4"')) {
			problems << 'the derived WEB-INF/web.xml no longer declares the frozen ' +
				'Servlet 2.4 descriptor version'
		}
		if (webXml.contains('metadata-complete')) {
			problems << 'the derived WEB-INF/web.xml introduced a metadata-complete ' +
				'attribute the frozen descriptor never had'
		}
		def zkXml = new String(derived[phase5eZkXmlEntry] ?: new byte[0], 'UTF-8')
		if (!zkXml.contains('org.adempiere.web.bridge.CohortDecisionInterceptor')) {
			problems << 'the derived WEB-INF/zk.xml does not register the cohort ' +
				'decision interceptor'
		}

		// 4. The overlay jar carries the bridge and the protocol and nothing
		//    else. A ZK, servlet or ADempiere class inside it would be a second
		//    copy of something the legacy classpath already provides.
		def overlay = derived[phase5eBridgeJarEntry]
		if (overlay == null) {
			problems << "the derived WAR does not carry ${phase5eBridgeJarEntry}"
		} else {
			def classes = [] as TreeSet
			new java.util.zip.ZipInputStream(
					new ByteArrayInputStream(overlay)).withCloseable { zip ->
				for (def entry = zip.nextEntry; entry != null; entry = zip.nextEntry) {
					if (!entry.directory && entry.name.endsWith('.class')) {
						classes << entry.name
					}
				}
			}
			if (classes.isEmpty()) {
				problems << 'the Phase 5e overlay jar carries no class'
			}
			def foreign = classes.findAll {
				!it.startsWith('org/adempiere/web/')
			}
			if (!foreign.isEmpty()) {
				problems << "the Phase 5e overlay jar carries foreign classes: " +
					"${foreign.take(10)}"
			}
			[
				'org/adempiere/web/bridge/CohortRoutingFilter.class',
				'org/adempiere/web/bridge/CohortDecisionInterceptor.class',
				'org/adempiere/web/bridge/CohortBridgeStartupListener.class',
				'org/adempiere/web/cohort/CohortSelector.class',
				'org/adempiere/web/handoff/HandoffTicketCodec.class',
				'org/adempiere/web/route/PublicRouteClassifier.class',
				'org/adempiere/web/route/RoutingCore.class',
				'org/adempiere/web/route/RoutingLifecycle.class',
				'org/adempiere/web/route/LoopbackProxy.class',
			].each { required ->
				if (!classes.contains(required)) {
					problems << "the Phase 5e overlay jar is missing ${required}"
				}
			}
		}

		// 5. No key material, and no placeholder for one, may ship.
		derived.each { name, content ->
			if (name.toLowerCase(Locale.ROOT).contains('handoff')
					&& (name.endsWith('.key') || name.endsWith('.secret'))) {
				problems << "${name} looks like packaged key material"
			}
		}

		if (!problems.isEmpty()) {
			throw new GradleException(
				"The Phase 5e derived legacy artifact is not the reviewed derivation:\n  - " +
				problems.join('\n  - '))
		}

		def evidence = rootProject.layout.buildDirectory
			.file('phase5/evidence/phase5e-derived-artifact.tsv').get().asFile
		evidence.parentFile.mkdirs()
		evidence.withWriter('UTF-8') { writer ->
			writer.writeLine('# entry\tdisposition\tsha512')
			contract.keySet().sort().each { name ->
				writer.writeLine("${name}\t${contract[name]}\t" +
					"${phase5eSha512(derived[name])}")
			}
			writer.writeLine("# unchanged_entries\t${pristine.size() - contract.count { it.value == 'replaced' }}")
		}
		logger.lifecycle(
			"Phase 5e derived artifact: ${contract.size()} reviewed differences, " +
			"${pristine.size()} frozen entries otherwise byte-identical")
	}
}

/**
 * Determinism.
 *
 * The derived WAR is what the installed product and both release archives pin,
 * so "the same inputs produce the same bytes" has to be a measurement. This
 * derives the archive a second time into a separate file and compares the two.
 */
tasks.register('verifyPhase5eDerivedDeterminism') {
	group = 'verification'
	description = 'Derives the routed legacy WAR twice and proves the bytes are identical'
	dependsOn tasks.named('verifyPhase5eDerivedLegacyWar')
	outputs.file rootProject.layout.buildDirectory
		.file('phase5/evidence/phase5e-determinism.tsv')
	doLast {
		def target = phase5eDerivedWar.get().asFile
		def first = phase5eSha512(target.bytes)
		def rederived = new File(target.parentFile, 'webui-determinism-check.war')
		project.phase5eDeriveArchive(
			phase5ePristineWar.get().asFile,
			project(':org.adempiere.cohort').tasks.named('bridgeOverlayJar')
				.get().archiveFile.get().asFile,
			rederived)
		def second = phase5eSha512(rederived.bytes)
		if (first != second) {
			throw new GradleException(
				"The Phase 5e derivation is not deterministic: ${first} then ${second}")
		}
		rederived.delete()
		def evidence = rootProject.layout.buildDirectory
			.file('phase5/evidence/phase5e-determinism.tsv').get().asFile
		evidence.parentFile.mkdirs()
		evidence.text = "derived_sha512\t${first}\nrederived_sha512\t${second}\n"
	}
}

// ---------------------------------------------------------------------------
// Public route, cohort, cookie and audit contracts
// ---------------------------------------------------------------------------

tasks.register('verifyPhase5eCohortContracts') {
	group = 'verification'
	description = 'Proves the reviewed Phase 5e route, header, cookie and audit contracts match the code'
	dependsOn ':org.adempiere.cohort:jar'
	inputs.dir phase5eContractDir
	outputs.file rootProject.layout.buildDirectory
		.file('phase5/evidence/phase5e-public-routes.tsv')
	doLast {
		def classpath = project(':org.adempiere.cohort').sourceSets.main
			.runtimeClasspath.files.collect { it.toURI().toURL() } as URL[]
		def loader = new URLClassLoader(classpath, null as ClassLoader)
		def problems = []
		try {
			def classifier = loader.loadClass(
				'org.adempiere.web.route.PublicRouteClassifier')
			def headerPolicy = loader.loadClass(
				'org.adempiere.web.route.ProxyHeaderPolicy')
			def audit = loader.loadClass('org.adempiere.web.route.RoutingAudit')
			def parser = loader.loadClass(
				'org.adempiere.web.cohort.CohortConfigurationParser')
			def protocol = loader.loadClass(
				'org.adempiere.web.handoff.HandoffProtocol')
			def replay = loader.loadClass('org.adempiere.web.handoff.ReplayCache')

			// 1. Every reviewed public route row must classify exactly as the
			//    contract says, including the rows that must NOT be proxyable.
			def routes = phase5eReadRows(
				new File(phase5eContractDir, 'public-route-classes.tsv'))
			routes.each { row ->
				def actual = classifier.getMethod('classify', String, String)
					.invoke(null, row[0], row[1])
				if (actual.toString() != row[2]) {
					problems << "${row[0]} ${row[1]} classifies as ${actual}, " +
						"the contract says ${row[2]}"
				}
				def proxyable = actual.getClass().getMethod('proxyable')
					.invoke(actual)
				if (proxyable.toString() != row[3]) {
					problems << "${row[0]} ${row[1]} proxyable=${proxyable}, " +
						"the contract says ${row[3]}"
				}
			}
			if (routes.count { it[3] == 'false' } == 0) {
				problems << 'the public route contract records no refused route, ' +
					'so "the affinity unit is closed" would be vacuously true'
			}

			// 2. The header allowlists.
			def headers = phase5eReadRows(
				new File(phase5eContractDir, 'proxy-header-policy.tsv'))
			headers.each { row ->
				def method = row[1] == 'request'
					? 'forwardRequestHeader'
					: 'forwardResponseHeader'
				def forwarded = headerPolicy.getMethod(method, String)
					.invoke(null, row[0])
				if (forwarded.toString() != row[2]) {
					problems << "${row[1]} header ${row[0]} forwarded=${forwarded}, " +
						"the contract says ${row[2]}"
				}
			}
			['cookie', 'authorization', 'host'].each { denied ->
				if (!headers.any { it[0] == denied && it[2] == 'false' }) {
					problems << "the header contract does not record that ${denied} " +
						'is never forwarded'
				}
			}

			// 3. The audit policy must refuse to write anything it forbids.
			def forbidden = audit.getMethod('forbidden').invoke(null)
			forbidden.each { needle ->
				try {
					audit.getMethod('sanitised', String)
						.invoke(null, "x ${needle} y".toString())
					problems << "the audit policy accepted a line containing ${needle}"
				} catch (java.lang.reflect.InvocationTargetException expected) {
					if (!(expected.cause instanceof IllegalStateException)) {
						problems << "the audit policy failed unexpectedly on ${needle}"
					}
				}
			}

			// 4. The documented grammar and the implemented grammar are one
			//    string, not two.
			def grammar = parser.getMethod('identifierGrammar').invoke(null)
			def documented = phase5eReadRows(
				new File(phase5eContractDir, 'cohort-configuration.tsv'))
				.find { it[0] == 'identifier_grammar' }
			if (documented == null || documented[1] != grammar.toString()) {
				problems << "the documented identifier grammar " +
					"${documented == null ? '(absent)' : documented[1]} is not the " +
					"implemented one ${grammar}"
			}

			// 5. The ticket TTL, the reserved namespace and the replay capacity
			//    are the values the ADR justifies.
			def ttl = protocol.getField('TTL_MILLIS').getLong(null)
			def skew = protocol.getField('CLOCK_SKEW_MILLIS').getLong(null)
			def capacity = replay.getField('DEFAULT_CAPACITY').getInt(null)
			def documentedRate = phase5eReadRows(
				new File(phase5eContractDir, 'cohort-configuration.tsv'))
				.find { it[0] == 'max_accepted_login_rate_per_second' }
			if (documentedRate == null) {
				problems << 'the contract does not document the maximum accepted ' +
					'login rate the replay capacity is derived from'
			} else {
				def ceiling = ((ttl + skew) / 1000L) * Long.parseLong(documentedRate[1])
				if (capacity <= ceiling) {
					problems << "the replay cache capacity ${capacity} does not " +
						"exceed the documented ceiling ${ceiling}"
				}
			}
			if (ttl != 30_000L) {
				problems << "the ticket TTL is ${ttl}ms, the ADR fixes it at 30000ms"
			}
			def reserved = protocol.getField('RESERVED_HEADER_PREFIX').get(null)
			if (reserved != 'X-ADempiere-Handoff-') {
				problems << "the reserved internal namespace is ${reserved}"
			}

			// 6. The documented byte caps are the enforced byte caps, and the
			//    enforcement is exercised rather than read off a constant.
			def limits = loader.loadClass('org.adempiere.web.route.ProxyLimits')
			def transfer = loader.loadClass(
				'org.adempiere.web.route.BoundedTransfer')
			def configuration = [:]
			phase5eReadRows(
				new File(phase5eContractDir, 'cohort-configuration.tsv'))
				.each { configuration[it[0]] = it[1] }
			[
				max_request_bytes: 'MAX_REQUEST_BYTES',
				max_response_bytes: 'MAX_RESPONSE_BYTES',
			].each { key, field ->
				def enforced = limits.getField(field).getLong(null)
				if (configuration[key] == null) {
					problems << "the contract does not document ${key}"
				} else if (Long.parseLong(configuration[key]) != enforced) {
					problems << "the contract documents ${key}=${configuration[key]} " +
						"but ${field} is ${enforced}"
				}
			}
			def sink = new java.io.ByteArrayOutputStream()
			def copied = transfer.getMethod(
					'copy', InputStream, OutputStream, long.class)
				.invoke(null, new java.io.ByteArrayInputStream(new byte[9 * 1024]),
					sink, 8L * 1024)
			if (copied) {
				problems << 'the streaming byte cap did not stop an oversized body'
			}
			if (sink.size() > 8 * 1024) {
				problems << "the streaming byte cap forwarded ${sink.size()} bytes " +
					'past its 8192 byte limit'
			}
			def declared = transfer.getMethod(
					'declaredWithin', long.class, long.class)
				.invoke(null, 8L * 1024 + 1, 8L * 1024)
			if (declared) {
				problems << 'an oversized declared Content-Length was accepted'
			}
		} finally {
			loader.close()
		}

		if (!problems.isEmpty()) {
			throw new GradleException(
				"The Phase 5e cohort and routing contracts do not match the code:\n  - " +
				problems.join('\n  - '))
		}

		def evidence = rootProject.layout.buildDirectory
			.file('phase5/evidence/phase5e-public-routes.tsv').get().asFile
		evidence.parentFile.mkdirs()
		evidence.text = new File(
			phase5eContractDir, 'public-route-classes.tsv').text
		logger.lifecycle('Phase 5e route, header, audit, cohort and ticket ' +
			'contracts match the implementation')
	}
}

/**
 * Mutation proof.
 *
 * A contract that no mutation can break is a description, not a gate. This
 * applies five reviewed mutations to the built classes and requires that a
 * named assertion fails for each. It runs the mutations against copies; the
 * checked-out sources are never modified.
 */
tasks.register('verifyPhase5eMutationProof', Exec) {
	group = 'verification'
	description = 'Proves a named Phase 5e assertion fails for each reviewed mutation'
	dependsOn(':org.adempiere.cohort:test', ':org.adempiere.cohort:bridgeTest')
	inputs.file rootProject.file('scripts/phase5/verify-cohort-mutation-proof.sh')
	// The mutated sources AND the tests that must notice them are inputs. Only
	// the script was declared before, so an ordinary change to a mutated class
	// or to the assertion that catches it left this task UP-TO-DATE and the
	// previous run's TSV standing as evidence for code it had never seen - a
	// gate reporting a pass it did not execute, which is precisely what the
	// phase-gating rules forbid.
	inputs.dir rootProject.file('org.adempiere.cohort/src/main/java')
	inputs.dir rootProject.file('org.adempiere.cohort/src/bridge/java')
	inputs.dir rootProject.file('org.adempiere.cohort/src/test/java')
	inputs.dir rootProject.file('org.adempiere.cohort/src/bridgeTest/java')
	outputs.file rootProject.layout.buildDirectory
		.file('phase5/evidence/phase5e-mutation-proof.tsv')
	commandLine(
		'bash',
		rootProject.file('scripts/phase5/verify-cohort-mutation-proof.sh'),
		rootProject.projectDir,
		rootProject.layout.buildDirectory
			.file('phase5/evidence/phase5e-mutation-proof.tsv').get().asFile)
}

/**
 * The lifecycle capture's own parser.
 *
 * The routed lane's session-cleanup evidence is only as good as the parser that
 * reads it out of `catalina.out`, and that parser has already been wrong twice
 * in ways that made the lifecycle rows report a pass they had not earned. It is
 * therefore gated here, in the database-neutral lane, against fixtures in the
 * exact shape `CLogFormatter` writes - including the cache-line-less routed
 * Tomcat 9 destruction block that the frozen listener produces for a session the
 * rotation already unregistered.
 */
tasks.register('verifyPhase5eSessionCensusParser', Exec) {
	group = 'verification'
	description = 'Runs the session-cache census parser tests against the reviewed log fixtures'
	inputs.file rootProject.file('scripts/phase5/session-cache-census.py')
