	// leave the Context descriptor in a directory that is about to be recreated,
	// which is precisely the "it worked on the first run" defect.
	mustRunAfter tasks.named('verifyPhase4InstalledApi')
	// Phase 5e REMOVES the Phase 5c/5d additive overlay it supersedes, so the
	// Phase 5c gates that own that overlay have to make their assertions first.
