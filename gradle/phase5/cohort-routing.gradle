	inputs.dir rootProject.file('scripts/phase5/fixtures/session-cache-census')
	outputs.file rootProject.layout.buildDirectory
		.file('phase5/evidence/phase5e-session-census-parser.txt')
	def report = rootProject.layout.buildDirectory
		.file('phase5/evidence/phase5e-session-census-parser.txt')
	doFirst {
		report.get().asFile.parentFile.mkdirs()
		standardOutput = new java.io.FileOutputStream(report.get().asFile)
		errorOutput = standardOutput
	}
	commandLine(
		'python3',
		rootProject.file('scripts/phase5/session_cache_census_test.py'))
}

