	// output because it only exists once the lane has run: the deployed
	// tomcat/webapps/webui.war and its expansion. stop-routed-lane.sh restores
	// the PRISTINE archive there, so a skipped staging step would leave
	// verifyPhase5eRoutedOverlay inspecting a deployment the previous run put
	// back. Re-running is cheap next to being wrong about what the product
	// serves.
	outputs.upToDateWhen { false }
	outputs.files(
		phase5eInstalledHome.map { it.file('lib/webui.war') },
		phase5eInstalledHome.map { it.file('lib/webuiOriginal.war') },
		phase5eInstalledHome.map {
			it.file('tomcat10-api/phase5e/webui-modern.war')
		},
		phase5eInstalledHome.map {
			it.file('tomcat10-api/conf/Catalina/localhost/webui.xml')
