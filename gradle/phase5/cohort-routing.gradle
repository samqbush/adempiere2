tasks.register('verifyPhase5eRoutedEvidence') {
	group = 'verification'
	description = 'Fails when the routed lane did not record cohort, isolation and lifecycle evidence'
	mustRunAfter ':zkwebui:routedBrowserTest'
	doLast {
		def evidence = phase5eEvidenceDir.get().asFile
		def problems = []
		def read = { String name ->
			def file = new File(evidence, name)
			if (!file.isFile()) {
				problems << "missing ${rootProject.relativePath(file)}"
				return [:]
			}
			def values = [:].withDefault { [] }
			file.readLines('UTF-8').findAll { it && !it.startsWith('#') }.each {
				def fields = it.split('\t', -1)
				values[fields[0]] << (fields.length > 1 ? fields[1] : '')
			}
			values
		}

		def lane = read('routed-lane.tsv')
		if (lane['public_webui'] != ['200']) {
			problems << "the public /webui ingress did not answer 200: ${lane['public_webui']}"
		}
		// The modern context records the status it actually returned. 403 is the
		// healthy armed state - it refuses an unbootstrapped session that
		// presents no ticket - and 200 is the healthy unarmed state. Anything
		// else is a failure, and neither is rewritten into the other.
		if (!(lane['modern_internal'] in [['200'], ['403']])) {
			problems << 'the internal modern /webui context answered ' +
				"${lane['modern_internal']}; only 200 (unarmed) or 403 " +
				'(armed and fail-closed) are healthy'
		}
		if (lane['modern_api'] != ['200']) {
			problems << "the modern SOAP endpoint did not answer 200: ${lane['modern_api']}"
		}
		// The listeners are read from the running process, so this is a
		// statement about the socket rather than about the configuration file
		// that was supposed to produce it.
		def modernListeners = lane['modern_listener']
		if (modernListeners.isEmpty()) {
			problems << 'no bound listener was observed for the modern runtime'
		} else {
			def offHost = modernListeners.findAll { listener ->
				!(listener.startsWith('127.0.0.1:') || listener.startsWith('[::1]:')
					|| listener.startsWith('localhost:'))
			}
			if (!offHost.isEmpty()) {
				problems << "the modern runtime is not loopback-only: ${offHost}"
			}
			def expected = lane['modern_expected_port'].isEmpty()
				? null
				: lane['modern_expected_port'][0]
			if (expected != null && !modernListeners.any { it.endsWith(':' + expected) }) {
				problems << "the modern runtime is not listening on ${expected}: " +
					"${modernListeners}"
			}
		}
		if (lane['public_listener'].isEmpty()) {
			problems << 'no bound listener was observed for the public ingress'
		}
		if (lane['modern_default_context'] != ['absent']) {
			problems << 'the routed lane still deploys the default /webui-modern ' +
				'context, so more than one modern UI context exists'
		}
		if (lane['handoff_key_mode'] != ['600']) {
			problems << "the handoff key is not mode 0600: ${lane['handoff_key_mode']}"
		}
		if (lane['handoff_key_in_archive'] != ['no']) {
			problems << 'the handoff key is inside an archive under ADEMPIERE_HOME'
		}
		if (lane['handoff_key_search'].isEmpty()
				|| !lane['handoff_key_search'][0].contains('zip(')) {
			problems << 'the handoff key search did not inspect archive entries, ' +
				'so its "absent" answer covers only the filesystem'
		}

		def matrix = read('cohort-matrix.tsv')
		[
			'master-off', 'user-allowlisted', 'role-allowlisted', 'not-allowlisted',
			'config-duplicate', 'config-malformed', 'config-unreadable',
			'config-client-scoped', 'bootstrap-single-use', 'role-unselected',
			'cohort-reentry-after-logout',
			'client-supplied-internal-header', 'missing-affinity',
			'backend-unavailable', 'interceptor-mutation',
			'concurrent-identity-isolation', 'logout-baseline', 'timeout-baseline',
			'container-destruction-baseline',
		].each { required ->
			if (matrix[required].isEmpty()) {
				problems << "the public-origin cohort matrix records no ${required} case"
			} else if (matrix[required] != ['pass']) {
				problems << "${required} did not pass: ${matrix[required]}"
			}
		}
		// The ticket expiry, tamper, wrong-session and partial-identity rules are		// owned by HandoffTicketCodecTest in the database-neutral gate. A browser
		// cannot present a ticket, so a matrix row claiming to test them here
		// could only be a second reserved-header rejection under another name.
		// Fail if one reappears rather than let the matrix regrow duplicates.
		[
			'ticket-expired', 'ticket-tampered', 'ticket-wrong-session',
			'ticket-partial-identity', 'ticket-replay',
		].each { duplicate ->
			if (!matrix[duplicate].isEmpty()) {
				problems << "${duplicate} is recorded as a runtime case, but a " +
					'browser cannot present a ticket; that rule belongs to ' +
					'HandoffTicketCodecTest'
			}
		}

		// Lifecycle evidence completeness. Each row records a mark and an
		// observation per runtime, and each of those has to say where its
		// reading came from - `census-line`, `destruction-block` or `none`, the
		// last meaning a destruction this action owns that the frozen Tomcat 9
		// listener recorded with no cache lines because the rotation had already
		// unregistered the session. `absent` means no post-mutation record was
		// found at all and is never a healthy state; a missing provenance row
		// means the reading cannot be interpreted at all, which is how a
		// borrowed reading used to pass unnoticed.
		['logout', 'timeout', 'destruction'].each { kind ->
			['before', 'after'].each { end ->
				def name = "session-caches-${kind}-${end}.tsv"
				def file = new File(evidence, name)
				if (!file.isFile()) {
					problems << "missing ${rootProject.relativePath(file)}"
					return
				}
				def sources = [:]
				file.readLines('UTF-8').each { line ->
					def fields = line.split('\t', -1)
					if (fields.length == 3 && fields[1] == 'census') {
						sources[fields[0]] = fields[2]
					}
				}
				['public', 'modern'].each { runtime ->
					if (!sources.containsKey(runtime)) {
						problems << "${name} records no census provenance for " +
							"the ${runtime} runtime, so its cache reading " +
							'cannot be interpreted'
					} else if (sources[runtime] == 'absent') {
						problems << "${name} found no post-mutation record at " +
							"all for the ${runtime} runtime"
					} else if (!(sources[runtime] in
							['census-line', 'destruction-block', 'none'])) {
						problems << "${name} records an unknown census " +
							"provenance for ${runtime}: ${sources[runtime]}"
					}
				}
			}
		}

		if (!problems.isEmpty()) {
			throw new GradleException(
				"The Phase 5e routed runtime evidence is incomplete:\n  - " +
				problems.join('\n  - '))
		}
		logger.lifecycle(
			"Phase 5e routed evidence: " +
			"${matrix.count { key, outcomes -> !outcomes.isEmpty() }} " +
			'public-origin matrix cases recorded, all passed')
	}
}

