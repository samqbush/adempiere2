/**
 * Isolation.
 *
 * The bridge must not leak into the modern closure and the modern closure must
 * not leak into the bridge. This is the H1/H2 mitigation expressed as a check
 * over the built artifacts rather than as a convention.
 */
tasks.register('verifyPhase5eBridgeIsolation') {
	group = 'verification'
	description = 'Proves the ZK 3.6 bridge and the Jakarta modern WAR share only the neutral protocol'
	dependsOn(
		':org.adempiere.cohort:bridgeOverlayJar',
		':org.adempiere.cohort:protocolJar',
		':zkwebui:verifyPhase5dModernWebWar')
	outputs.file rootProject.layout.buildDirectory
		.file('phase5/evidence/phase5e-bridge-isolation.tsv')
	doLast {
		def problems = []
		def cohort = project(':org.adempiere.cohort')
		def bridgeJar = cohort.tasks.named('bridgeOverlayJar').get()
			.archiveFile.get().asFile
		def protocolJar = cohort.tasks.named('protocolJar').get()
			.archiveFile.get().asFile
		def modernWar = rootProject.file('zkwebui/build/libs/webui-modern.war')

		def namesOf = { File archive ->
			def names = [] as TreeSet
			new java.util.zip.ZipFile(archive).withCloseable { zip ->
				zip.entries().findAll { !it.directory }.each { names << it.name }
			}
			names
		}
		def bridgeNames = namesOf(bridgeJar)
		def protocolNames = namesOf(protocolJar)

		// 1. The protocol jar is a strict subset of the bridge jar: the same
		//    compiled code, shipped to both runtimes.
		def missing = protocolNames.findAll {
			it.endsWith('.class') && !bridgeNames.contains(it)
		}
		if (!missing.isEmpty()) {
			problems << "the protocol jar carries classes the bridge jar does not: " +
				"${missing.take(5)}"
		}

		// 2. The protocol jar carries no bridge class and therefore no javax
		//    servlet reference. This is the claim that keeps the Jakarta runtime
		//    free of the legacy namespace.
		def bridgeClassesInProtocol = protocolNames.findAll {
			it.startsWith('org/adempiere/web/bridge/')
		}
		if (!bridgeClassesInProtocol.isEmpty()) {
			problems << "the protocol jar carries bridge classes: " +
				"${bridgeClassesInProtocol}"
		}

		// 3. The modern WAR carries the protocol jar and no bridge class
		//    anywhere, in WEB-INF/classes or in any packaged library.
		if (modernWar.isFile()) {
			def warNames = namesOf(modernWar)
			if (!warNames.contains('WEB-INF/lib/webui-cohort-protocol.jar')) {
				problems << 'the modern WAR does not carry the neutral protocol jar'
			}
			if (warNames.any { it.contains('webui-cohort-bridge') }) {
				problems << 'the modern WAR carries the Javax/ZK 3.6 bridge jar'
			}
			new java.util.zip.ZipFile(modernWar).withCloseable { zip ->
				zip.entries().findAll {
					!it.directory && it.name.startsWith('WEB-INF/lib/')
						&& it.name.endsWith('.jar')
				}.each { entry ->
					def bytes = zip.getInputStream(entry).withCloseable {
						it.readAllBytes()
					}
					new java.util.zip.ZipInputStream(
							new ByteArrayInputStream(bytes)).withCloseable { inner ->
						for (def nested = inner.nextEntry; nested != null;
								nested = inner.nextEntry) {
							if (nested.name.startsWith('org/adempiere/web/bridge/')) {
								problems << "${entry.name} carries the bridge class " +
									nested.name
							}
						}
					}
				}
			}
		} else {
			problems << 'the modern WAR has not been built'
		}

		if (!problems.isEmpty()) {
			throw new GradleException(
				"The Phase 5e compile closures are not isolated:\n  - " +
				problems.join('\n  - '))
		}
		def evidence = rootProject.layout.buildDirectory
			.file('phase5/evidence/phase5e-bridge-isolation.tsv').get().asFile
		evidence.parentFile.mkdirs()
		evidence.withWriter('UTF-8') { writer ->
			writer.writeLine('# artifact\tclasses\tdisposition')
			writer.writeLine("webui-cohort-bridge.jar\t" +
				"${bridgeNames.count { it.endsWith('.class') }}\ttomcat9-javax-zk36")
			writer.writeLine("webui-cohort-protocol.jar\t" +
				"${protocolNames.count { it.endsWith('.class') }}\tneutral-both-runtimes")
		}
	}
}

// ---------------------------------------------------------------------------
// Shared staging routine
// ---------------------------------------------------------------------------

/**
 * Stages every Phase 5e routing artifact into an ADEMPIERE_HOME-shaped tree.
 *
 * Five things are staged or removed, and each of them has to be here rather
 * than somewhere more convenient:
 *
 *   lib/webui.war                 the routed artifact the installer deploys
 *   lib/webuiOriginal.war         the rollback material setupWLib merges FROM
 *   tomcat10-api/phase5e/webui-modern.war
 *                                 the modern archive the Context descriptor
 *                                 resolves to. It is staged OUTSIDE webapps on
 *                                 purpose: an archive under webapps is
 *                                 auto-deployed as well as mounted, which is
 *                                 how one application acquires two context
 *                                 paths, two cookie paths and two session sets.
 *   tomcat10-api/conf/Catalina/localhost/webui.xml
 *                                 the modern Context descriptor, which is what
 *                                 mounts webui-modern.war at the internal
 *                                 /webui path with URL rewriting disabled
 *   config/phase5e-routing.sha256 the manifest both verifiers check
 *
 * and the Phase 5c/5d additive overlay - tomcat10-api/webapps/webui-modern.war,
 * its exploded context and its own manifest - is REMOVED. Phase 5e supersedes
 * that deployment location rather than adding to it. Leaving both would ship a
 * product with two modern UI contexts, and leaving the Phase 5c manifest behind
 * would ship a checksum file that names a path the product no longer has.
 */
ext.stagePhase5eRouting = { File home ->
	def derived = phase5eDerivedWar.get().asFile
	def pristine = phase5ePristineWar.get().asFile
	def modern = phase5eModernWar.asFile
	if (!modern.isFile()) {
		throw new GradleException(
			"The Phase 5d modern WAR ${modern} has not been built")
	}
	def remove
	remove = { File victim ->
		if (!victim.exists()) {
			return
		}
		if (victim.isDirectory()) {
			victim.listFiles().each { remove(it) }
		}
		if (!victim.delete()) {
			throw new GradleException("Could not remove ${victim}")
		}
	}
	def lib = new File(home, 'lib')
	lib.mkdirs()
	// The pristine artifact is the rollback material AND the installer's merge
	// input. Writing it first means a later setupWLib rebuilds the routed
	// archive from the frozen base rather than from an already-derived one.
	new File(lib, 'webuiOriginal.war').bytes = pristine.bytes
	new File(lib, 'webui.war').bytes = derived.bytes

	def routedModern = new File(home, 'tomcat10-api/phase5e/webui-modern.war')
	routedModern.parentFile.mkdirs()
	routedModern.bytes = modern.bytes

	// Exactly one modern UI context. The auto-deployed archive, any expansion of
	// it, and the Phase 5c manifest that names it all go.
	remove(new File(home, 'tomcat10-api/webapps/webui-modern.war'))
	remove(new File(home, 'tomcat10-api/webapps/webui-modern'))
	remove(new File(home, 'config/phase5c-web-overlay.sha256'))

	// The Tomcat 9 deployment is derived from lib/webui.war, so a stale routed
	// or pristine expansion left in webapps would decide what the next start
	// actually serves.
	def publicWebapps = new File(home, 'tomcat/webapps')
	if (publicWebapps.isDirectory()) {
		remove(new File(publicWebapps, 'webui'))
		if (new File(publicWebapps, 'webui.war').isFile()) {
			new File(publicWebapps, 'webui.war').bytes = derived.bytes
		}
	}

	def config = new File(home, 'config')
	config.mkdirs()
	def digest = { File file ->
		java.security.MessageDigest.getInstance('SHA-256')
			.digest(file.bytes).encodeHex().toString()
	}
	def contexts = new File(home, 'tomcat10-api/conf/Catalina/localhost')
	contexts.mkdirs()
	new File(contexts, 'webui.xml').text = project.phase5eContextDescriptor()

	new File(config, 'phase5e-routing.sha256').text =
		"${digest(new File(lib, 'webui.war'))}  lib/webui.war\n" +
		"${digest(new File(lib, 'webuiOriginal.war'))}  lib/webuiOriginal.war\n" +
		"${digest(routedModern)}  tomcat10-api/phase5e/webui-modern.war\n" +
		"${digest(new File(contexts, 'webui.xml'))}  " +
		"tomcat10-api/conf/Catalina/localhost/webui.xml\n"
}

/**
 * The Tomcat 10 Context descriptor that mounts the modern WAR at /webui.
 *
 * The context path comes from the file name, so this file is what makes the
 * public path and the internal path identical - which is in turn what lets the
 * router forward bodies verbatim instead of rewriting HTML, JavaScript, CSS and
 * ZK asynchronous-update payloads.
 */
ext.phase5eContextDescriptor = { ->
	'''<?xml version="1.0" encoding="UTF-8"?>
<!--
  Phase 5e: mounts the Phase 5d modern ZK CE 10 archive at the INTERNAL context
  path /webui.

  The context path is taken from this file's name, so the modern application
  answers on exactly the same path publicly and internally. That identity is
  the reason the Phase 5e router never rewrites a response body: every URL the
  modern application emits is already correct for the public origin.

  The routed lane deploys this descriptor INSTEAD OF webapps/webui-modern.war,
  so exactly one modern UI context exists. Deploying both would give the same
  application two context paths, two cookie paths and two sets of sessions.

  disableURLRewriting is set here as well as in the archive's own
  <tracking-mode>COOKIE</tracking-mode>: a site customisation can replace the
  descriptor inside a WAR, and cannot replace this file without the operator
  noticing.
-->
<Context docBase="${catalina.base}/phase5e/webui-modern.war"
         disableURLRewriting="true"
         sessionCookiePath="/webui"
         sessionCookiePathUsesTrailingSlash="false"
         crossContext="false"
         useHttpOnly="true"
         privileged="false"
         reloadable="false"/>
'''
}

tasks.register('verifyPhase5eContractManifest', Exec) {
	group = 'verification'
	description = 'Verifies the Phase 5e reviewed contract file manifest'
	inputs.dir phase5eContractDir
	workingDir phase5eContractDir
	commandLine 'shasum', '-a', '256', '--check', 'manifest.sha256'
}

tasks.named('verifyPhase5eCohortContracts') {
	dependsOn tasks.named('verifyPhase5eContractManifest')
}

// ---------------------------------------------------------------------------
// Lane lifecycle
// ---------------------------------------------------------------------------
//
// The routed lane owns two Tomcats and one installed webapps directory, so it
// has to be stopped and the installed deployment restored whatever happens -
// including when the browser matrix fails, which is exactly when a left-running
// lane makes the next run impossible to interpret.
gradle.projectsEvaluated {
	def routedBrowserTest = project(':zkwebui').tasks.named('routedBrowserTest')
	def startLane = tasks.named('startPhase5eRoutedLane')
	def stopLane = tasks.named('stopPhase5eRoutedLane')
	routedBrowserTest.configure {
		dependsOn(
			tasks.named('installPhase5cBrowser'),
			startLane)
		finalizedBy stopLane
	}
	startLane.configure { finalizedBy stopLane }
	stopLane.configure {
		mustRunAfter(
			project(':zkwebui').tasks.named('compileRoutedBrowserTestJava'),
			routedBrowserTest,
			tasks.named('verifyPhase5eRoutedEvidence'))
	}
	// The disposable database must outlive every Phase 5e task that reads it.
	tasks.named('cleanupPhase3Database') {
		mustRunAfter(
			tasks.named('phase5eCohortRoutingSmoke'),
			tasks.named('verifyPhase5eRoutedEvidence'),
			routedBrowserTest,
			startLane,
			stopLane)
	}
}
