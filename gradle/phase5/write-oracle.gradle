import java.security.MessageDigest

// Phase 5g-1a: the legacy Business Partner CRUD write oracle.
//
// This file registers the DATABASE-NEUTRAL half of the increment. It proves the
// contract is internally consistent, that it still describes the repository, and
// that the normalizer removes enough without removing too much. It deliberately
// proves nothing about runtime behaviour: the capture itself needs a booted
// Tomcat 9 lane and a marker-owned PostgreSQL, and lives in the database-backed
// smoke.
//
// Nothing here ships modern runtime code. The Phase 5g ADR forbids a branch from
// both inventing the expected answer and implementing the thing being scored, so
// 5g-1a is an oracle increment only.

def phase5g1aContractDir =
	rootProject.layout.projectDirectory.dir('contracts/legacy-web-write-v1')
def phase5g1aBuildRoot = rootProject.layout.buildDirectory.dir('phase5g1a')
def phase5g1aGeneratedDir = phase5g1aBuildRoot.map { it.dir('generated') }
def phase5g1aScript = { String name -> rootProject.file("scripts/phase5/${name}") }

// The manifest cannot contain its own digest; it is excluded by construction and
// its integrity comes from review, exactly as in the Phase 5b oracle manifest
// and the Phase 5d browser contract manifest.
def phase5g1aManifestName = 'manifest.sha256'

def phase5g1aSha256 = { byte[] content ->
	MessageDigest.getInstance('SHA-256').digest(content).encodeHex().toString()
}

tasks.register('generatePhase5gWriteAttribution', Exec) {
	group = 'verification'
	description = 'Generates the Phase 5g table-scoped callout and registered-validator attribution'
	inputs.file rootProject.file('db/ddlutils/adempiere-data.xml')
	inputs.file phase5g1aScript('generate-phase5g-write-attribution.py')
	inputs.file phase5g1aContractDir.file('attribution-scope.tsv')
	// The analyzer resolves validator superclass chains and model-class
	// Table_Name constants through the core and extension source trees, so those
	// trees are declared inputs. Declaring only the seed would let a source
	// change that moves a validator onto a fixture table hide behind an
	// UP-TO-DATE result.
	inputs.file rootProject.file('gradle/phase5/phase5g-scan-roots.tsv')
	['base/src', 'client/src'].each { root ->
		inputs.files(rootProject.fileTree(rootProject.file(root)) {
			include '**/*.java'
			exclude '**/build/**'
			exclude '**/bin/**'
		}).withPropertyName("coreRoot_${root.replace('/', '_')}")
	}
	rootProject.file('gradle/phase5/phase5g-scan-roots.tsv').readLines()
		.findAll { !it.trim().isEmpty() && !it.startsWith('#') }
		.collect { it.split('\t')[0] }
		.findAll { it != 'path' }
		.each { root ->
			inputs.files(rootProject.fileTree(rootProject.file(root)) {
				include '**/*.java'
				exclude '**/build/**'
				exclude '**/bin/**'
			}).withPropertyName("scanRoot_${root.replace('/', '_').replace('.', '_')}")
		}
	outputs.dir phase5g1aGeneratedDir
	commandLine(
		'python3',
		phase5g1aScript('generate-phase5g-write-attribution.py').absolutePath,
		'--repo-root', rootProject.projectDir,
		'--output-dir', phase5g1aGeneratedDir.get().asFile,
		'--scope', phase5g1aContractDir.file('attribution-scope.tsv').asFile)
}

tasks.register('verifyPhase5gWriteAttribution', Exec) {
	group = 'verification'
	description =
		'Proves C_BPartner fires no callout and no registered model validator, and that the analyzer is actually looking'
	dependsOn tasks.named('generatePhase5gWriteAttribution')
	inputs.dir phase5g1aContractDir
	inputs.dir phase5g1aGeneratedDir
	inputs.file phase5g1aScript('validate-phase5g-write-attribution.py')
	outputs.file phase5g1aBuildRoot.map { it.file('attribution-summary.tsv') }
	commandLine(
		'python3',
		phase5g1aScript('validate-phase5g-write-attribution.py').absolutePath,
		'--repo-root', rootProject.projectDir,
		'--generated-dir', phase5g1aGeneratedDir.get().asFile,
		'--summary', phase5g1aBuildRoot.get().file('attribution-summary.tsv').asFile)
}

tasks.register('verifyPhase5gWriteNormalizerMutationProof', Exec) {
	group = 'verification'
	description =
		'Scores the write-capture normalizer in both directions against the committed raw fixture'
	inputs.file phase5g1aScript('normalize_write_capture.py')
	inputs.file phase5g1aScript('measure-write-effect.py')
	inputs.file phase5g1aScript('verify-write-normalizer-mutation-proof.py')
	inputs.dir phase5g1aContractDir.dir('raw')
	outputs.file phase5g1aBuildRoot.map { it.file('normalizer-mutations.tsv') }
	commandLine(
		'python3',
		phase5g1aScript('verify-write-normalizer-mutation-proof.py').absolutePath,
		'--repo-root', rootProject.projectDir,
		'--report', phase5g1aBuildRoot.get().file('normalizer-mutations.tsv').asFile)
	doLast {
		// The proof writes its report even when it fails, so a green Exec is not
		// on its own evidence that every declared mutation ran. Re-read the
		// report here and require the full declared set: an infrastructure
		// failure that produced a short report must not pass as coverage.
		def report = phase5g1aBuildRoot.get().file('normalizer-mutations.tsv').asFile
		if (!report.isFile()) {
			throw new GradleException('The normalizer mutation proof produced no report')
		}
		def rows = report.readLines()
			.findAll { it && !it.startsWith('#') && !it.startsWith('mutation\t') }
		def detect = rows.findAll { it.split('\t')[1] == 'must-detect' }
		def normalize = rows.findAll { it.split('\t')[1] == 'must-normalize' }
		if (detect.size() < 12 || normalize.size() < 7) {
			throw new GradleException(
				"The normalizer mutation proof scored ${detect.size()} must-detect and " +
					"${normalize.size()} must-normalize mutation(s); the reviewed set is " +
					'12 and 7. A shrinking proof is a weakening proof.')
		}
		logger.lifecycle(
			"Normalizer mutation proof scored ${detect.size()} defect and " +
				"${normalize.size()} volatility class(es)")
	}
}

tasks.register('verifyPhase5gTransportClassPolicyProof', Exec) {
	group = 'verification'
	description =
		'Proves the 5g-1a-x transport-class relaxation still rejects what it must reject'
	inputs.file phase5g1aScript('score-write-oracle-capture.py')
	inputs.file phase5g1aScript('verify-transport-class-policy-proof.py')
	inputs.file phase5g1aContractDir.file('transport-class-policy.tsv')
	inputs.file phase5g1aContractDir.file('network-classes.tsv')
	inputs.file phase5g1aContractDir.file('allowed-browser-errors.tsv')
	outputs.file phase5g1aBuildRoot.map { it.file('transport-class-policy-proof.tsv') }
	commandLine(
		'python3',
		phase5g1aScript('verify-transport-class-policy-proof.py').absolutePath,
		'--repo-root', rootProject.projectDir,
		'--report', phase5g1aBuildRoot.get().file('transport-class-policy-proof.tsv').asFile)
	doLast {
		// Same reason the normalizer proof re-reads its own report: a relaxation
		// whose proof scored nothing would look exactly like a relaxation whose
		// proof passed.
		def report = phase5g1aBuildRoot.get().file('transport-class-policy-proof.tsv').asFile
		if (!report.isFile()) {
			throw new GradleException('The transport-class policy proof produced no report')
		}
		def rows = report.readLines()
			.findAll { it && !it.startsWith('#') && !it.startsWith('case\t') }
		def mustFail = rows.findAll { it.split('\t')[1] == 'must-fail' }
		def mustPass = rows.findAll { it.split('\t')[1] == 'must-pass' }
		if (mustFail.size() < 10 || mustPass.size() < 6) {
			throw new GradleException(
				"The transport-class policy proof scored ${mustFail.size()} must-fail and " +
					"${mustPass.size()} must-pass case(s); the reviewed set is 10 and 6. " +
					'A relaxation is exactly the change whose proof must not be allowed to ' +
					'shrink alongside it.')
		}
		logger.lifecycle(
			"Transport-class policy proof enforced ${mustFail.size()} rejection(s) over " +
				"${mustPass.size()} accepted capture shape(s)")
	}
}

tasks.register('verifyPhase5gAmbientClassificationMutationProof', Exec) {
	group = 'verification'
	description =
		'Proves the reviewed ambient-state classification is what decides the undeclared-table backstop'
	inputs.file phase5g1aScript('measure-write-effect.py')
	inputs.file phase5g1aScript('verify-ambient-classification-mutation-proof.py')
	inputs.file phase5g1aContractDir.file('ambient-tables.tsv')
	outputs.file phase5g1aBuildRoot.map { it.file('ambient-mutations.tsv') }
	commandLine(
		'python3',
		phase5g1aScript('verify-ambient-classification-mutation-proof.py').absolutePath,
		'--ambient', phase5g1aContractDir.file('ambient-tables.tsv').asFile,
		'--report', phase5g1aBuildRoot.get().file('ambient-mutations.tsv').asFile)
	doLast {
		// Same reasoning as the normalizer proof: the report is written even on
		// failure, so a green Exec is not on its own evidence that every declared
		// direction ran. The three directions are re-read here because a proof
		// that quietly stopped scoring one of them would leave the ambient list
		// unguarded while still exiting zero.
		def report = phase5g1aBuildRoot.get().file('ambient-mutations.tsv').asFile
		if (!report.isFile()) {
			throw new GradleException('The ambient-classification mutation proof produced no report')
		}
		def rows = report.readLines()
			.findAll { it && !it.startsWith('#') && !it.startsWith('mutation\t') }
		def directions = rows.collect { it.split('\t')[1] } as Set
		def expected = ['must-detect', 'must-forgive', 'must-detect-reclassification'] as Set
		if (directions != expected) {
			throw new GradleException(
				"The ambient-classification mutation proof scored ${directions.sort()}; " +
					"the reviewed set is ${expected.sort()}. A shrinking proof is a " +
					'weakening proof.')
		}
		// Named explicitly, not merely counted: this is the one mutation whose
		// capture and contract are byte-identical, so it is the only one that
		// can prove the undeclared-table backstop fires on its own rather than
		// riding on a payload byte-diff. Losing it would leave three green
		// directions and no backstop coverage at all.
		def isolating = 'undeclared-business-table-fails-even-when-the-payload-matches'
		if (!rows.any { it.startsWith("${isolating}\t") }) {
			throw new GradleException(
				"The ambient-classification mutation proof no longer scores '${isolating}', " +
					'which is the only direction that isolates the undeclared-table backstop.')
		}
		logger.lifecycle(
			"Ambient-classification mutation proof scored ${rows.size()} mutation(s) over ${directions.size()} direction(s)")
	}
}

tasks.register('generatePhase5gWriteOracleManifest') {
	group = 'verification'
	description =
		'Regenerates contracts/legacy-web-write-v1/manifest.sha256 over every contract file except itself'
	doLast {
		def dir = phase5g1aContractDir.asFile
		def rows = []
		dir.eachFileRecurse { file ->
			if (!file.isFile()) {
				return
			}
			def relative = dir.toPath().relativize(file.toPath()).toString()
			if (relative == phase5g1aManifestName) {
				return
			}
			rows << "${phase5g1aSha256(file.bytes)}\t${relative}"
		}
		rows.sort()
		new File(dir, phase5g1aManifestName).withWriter('UTF-8') { writer ->
			writer.println('# Phase 5g-1a legacy Business Partner write oracle manifest')
			writer.println(
				'# SHA-256 over every file in contracts/legacy-web-write-v1/ except this file.')
			writer.println('# sha256\tpath')
			rows.each { writer.println(it) }
		}
		logger.lifecycle("Wrote write oracle manifest covering ${rows.size()} files")
	}
}

tasks.register('verifyPhase5gWriteOracleManifest') {
	group = 'verification'
	description =
		'Fails when the write oracle contract has a missing, unexpected, or altered file'
	inputs.dir phase5g1aContractDir
	outputs.file phase5g1aBuildRoot.map { it.file('manifest-verified.txt') }
	doLast {
		def dir = phase5g1aContractDir.asFile
		def manifest = new File(dir, phase5g1aManifestName)
		if (!manifest.isFile()) {
			throw new GradleException("Missing ${manifest}")
		}
		def expected = [:]
		manifest.readLines().findAll { it && !it.startsWith('#') }.each { line ->
			def fields = line.split('\t', -1)
			expected[fields[1]] = fields[0]
		}
		def actual = [:]
		dir.eachFileRecurse { file ->
			if (!file.isFile()) {
				return
			}
			def relative = dir.toPath().relativize(file.toPath()).toString()
			if (relative == phase5g1aManifestName) {
				return
			}
			actual[relative] = phase5g1aSha256(file.bytes)
		}
		def missing = (expected.keySet() - actual.keySet()).sort()
		// An unexpected file is a real failure: an unreviewed fixture must never
		// be able to join the contract silently.
		def unexpected = (actual.keySet() - expected.keySet()).sort()
		def altered = expected.keySet().intersect(actual.keySet())
			.findAll { expected[it] != actual[it] }.sort()
		def problems = []
		if (missing) { problems << "missing: ${missing}" }
		if (unexpected) { problems << "unexpected: ${unexpected}" }
		if (altered) { problems << "altered: ${altered}" }
		if (!problems.isEmpty()) {
			throw new GradleException(
				"contracts/legacy-web-write-v1 does not match ${phase5g1aManifestName} " +
					"(${problems.join('; ')}). Re-review the change, then run " +
					'generatePhase5gWriteOracleManifest.')
		}

		// A manifest that faithfully records a contract someone emptied is a
		// green gate over no coverage. The files that carry the increment's claim
		// must be present, and the ones that can be emptied without changing the
		// file list must still have content.
		// path -> minimum byte length. The floors are the reviewed content's order
		// of magnitude, not its exact size, so ordinary edits do not trip them.
		def required = [
			'README.md': 4500,
			'attribution-scope.tsv': 500,
			'attribution.tsv': 2000,
			'measurement-scope.tsv': 500,
			'fixture.sql': 4000,
			'exclusions.tsv': 1500,
			'normalization-policy.md': 2500,
			// The only file in the contract that can make an unexpected write
			// acceptable, so it carries a floor and a data-row check like any
			// other ledger, and a mutation proof besides.
			'ambient-tables.tsv': 1500,
			// Deliberately the smallest floor in the set: the "before" capture
			// legitimately holds only the sentinel and empty scope tables,
			// because the point of it is that the write has not happened yet.
			'raw/before.json': 120,
			'raw/after.json': 800,
			'raw/README.md': 800,
			// The captured facts. Floors are an order of magnitude below the
			// frozen bytes, so ordinary re-capture does not trip them while
			// truncation to a header does.
			'write-flow.tsv': 100,
			'effect-model.tsv': 400,
			'business-values.tsv': 1000,
			'foreign-key-graph.tsv': 60,
			'semantic-facts.tsv': 100,
			'network-classes.tsv': 80,
			'concurrency-facts.tsv': 80,
			'allowed-browser-errors.tsv': 100,
			// The reviewed comparison semantics for every fact class. Without it
			// the scorer has no declared policy and fails closed, so it carries a
			// floor like every other reviewed ledger.
			'transport-class-policy.tsv': 1500,
		]
		def absent = required.keySet().findAll { !actual.containsKey(it) }
		if (!absent.isEmpty()) {
			throw new GradleException(
				"The Phase 5g-1a write oracle contract is missing required file(s): ${absent}")
		}

		// Presence alone is not coverage. None of these files is read by any other
		// task in this gate, so without a content floor any of them could be
		// truncated to zero bytes, the manifest regenerated, and the gate would go
		// green over a contract that had lost its recorded exclusions, its
		// measurement scope and its preconditions.
		def thin = required.findAll { path, floor -> new File(dir, path).length() < floor }
		if (!thin.isEmpty()) {
			throw new GradleException(
				'The Phase 5g-1a write oracle contract has file(s) below their reviewed ' +
					"content floor: ${thin.keySet()}. A manifest that faithfully records an " +
					'emptied contract is a green gate over no coverage.')
		}

		// Each TSV must carry data rows, not only its commentary preamble. A scope
		// or exclusion list reduced to comments asserts nothing while still looking
		// substantial to a byte-length check.
		['attribution-scope.tsv', 'attribution.tsv', 'measurement-scope.tsv',
		 'exclusions.tsv', 'ambient-tables.tsv', 'write-flow.tsv',
		 'effect-model.tsv', 'business-values.tsv', 'foreign-key-graph.tsv',
		 'semantic-facts.tsv', 'network-classes.tsv', 'concurrency-facts.tsv',
		 'transport-class-policy.tsv'].each { name ->
			def dataRows = new File(dir, name).readLines()
				.findAll { !it.trim().isEmpty() && !it.startsWith('#') }
			if (dataRows.size() < 2) {
				throw new GradleException(
					"contracts/legacy-web-write-v1/${name} carries ${dataRows.size()} " +
						'non-comment line(s); a header plus at least one data row is required.')
			}
		}

		// allowed-browser-errors.tsv is held to one data row rather than two. It
		// is an allowlist with no header row -- every line is a declared error --
		// and 5g-1a-x deduplicated it, because freezing the run's repetitions
		// froze a count that tracked how many browser sessions the flow opened.
		// Emptying it entirely still fails: an empty allowlist would permit no
		// error at all, which is a real assertion, but it would also mean the
		// legacy theme defect had gone unrecorded.
		def allowedErrors = new File(dir, 'allowed-browser-errors.tsv').readLines()
			.findAll { !it.trim().isEmpty() && !it.startsWith('#') }
		if (allowedErrors.isEmpty()) {
			throw new GradleException(
				'contracts/legacy-web-write-v1/allowed-browser-errors.tsv carries no ' +
					'declared error. Its content is the record of which browser errors the ' +
					'legacy runtime was reviewed to produce.')
		}

		// The step ledgers must agree. A step captured but undeclared, or declared
		// but uncaptured, is exactly the drift that would let the oracle claim
		// coverage it does not have -- and neither the byte floor nor the data-row
		// check can see it, because both files stay substantial either way.
		def flowRows = new File(dir, 'write-flow.tsv').readLines()
			.findAll { it && !it.startsWith('#') }
			.collect { it.split('\t', -1) }
		// Step 0 is the post-login baseline snapshot. An effect is a diff between
		// two snapshots, so the baseline has none by construction -- it is the
		// thing everything else is measured against. Excluding it here is the only
		// exemption; every other step must appear in both ledgers.
		def baseline = flowRows.findAll { it[0] == '0' }.collect { it[1] } as Set
		if (baseline.size() != 1) {
			throw new GradleException(
				"write-flow.tsv must declare exactly one step 0 baseline; found ${baseline}")
		}
		def flowSteps = (flowRows.collect { it[1] } as Set) - baseline
		def modelRows = new File(dir, 'effect-model.tsv').readLines()
			.findAll { it && !it.startsWith('#') && !it.startsWith('step_id\t') }
		def modelSteps = modelRows.collect { it.split('\t', -1)[0] } as Set
		if (flowSteps != modelSteps) {
			throw new GradleException(
				'The Phase 5g-1a step ledgers disagree. write-flow.tsv declares ' +
					"${(flowSteps - modelSteps).sort()} that effect-model.tsv does not, and " +
					"effect-model.tsv declares ${(modelSteps - flowSteps).sort()} that " +
					'write-flow.tsv does not. A step can be neither captured undeclared nor ' +
					'declared uncaptured.')
		}

		// Every indexed effect document must exist, must carry the [step] section
		// the scorer compares, and must name its own step. `score` strips comments
		// before comparing, so a document that identified itself only in a header
		// would let one step's effect score cleanly against another's frozen model.
		modelRows.each { row ->
			def fields = row.split('\t', -1)
			def stepId = fields[0]
			def document = new File(dir, fields[2])
			if (!document.isFile()) {
				throw new GradleException(
					"effect-model.tsv indexes ${fields[2]}, which does not exist")
			}
			def lines = document.readLines()
			def marker = lines.indexOf('[step]')
			if (marker < 0 || marker + 1 >= lines.size() || lines[marker + 1] != stepId) {
				throw new GradleException(
					"${fields[2]} does not carry a [step] section naming ${stepId}. " +
						'Without it a step would score against another step\'s frozen answer.')
			}
		}

		// The recorded domain review must describe the bytes that are actually
		// committed. Re-freezing from a different capture changes this digest, so a
		// sign-off cannot silently carry over to facts nobody reviewed.
		def readme = new File(dir, 'README.md')
		def readmeText = readme.text
		['Not yet present', 'Not yet recorded'].each { phrase ->
			if (readmeText.contains(phrase)) {
				throw new GradleException(
					"contracts/legacy-web-write-v1/README.md still says \"${phrase}\". The " +
						'facts are frozen, so the increment\'s recorded incompleteness must be ' +
						'replaced by its recorded review.')
			}
		}
		// The R12 repair changed the shape of two things every frozen effect
		// document carries: a changed-table row now names WHY it changed, and the
		// no-effect marker now claims content stability rather than mere row-count
		// stability. A document still written in the old shape is a stale answer,
		// and a stale answer must fail here -- in the database-neutral gate that
		// runs on every pull request -- rather than hours later in the capture
		// lane, or worse, never, because the neutral gate only ever hashed bytes.
		def noEffectMarker = 'no-keyed-change-in-scope\tno-content-change-outside-ambient'
		new File(dir, 'effect-model').listFiles().sort { it.name }.each { document ->
			def section = null
			document.readLines().eachWithIndex { line, index ->
				if (line.startsWith('[')) {
					section = line
					return
				}
				if (line.isEmpty() || line.startsWith('#')) {
					return
				}
				if (section == '[changed-tables]') {
					def fields = line.split('\t', -1)
					if (fields.length != 3 || !(fields[2] in ['rows', 'content'])) {
						throw new GradleException(
							"${document.name}:${index + 1} carries a changed-table row in the " +
								"pre-R12 shape: ${line}. A frozen row must name its change kind " +
								'(rows or content). Re-capture the legacy answer with --freeze.')
					}
				} else if (section == '[no-effect]' && line != noEffectMarker) {
					throw new GradleException(
						"${document.name}:${index + 1} asserts no-effect with the pre-R12 marker: " +
							"${line}. That marker claimed only that no row COUNT changed outside " +
							'ambient tables, so a content-only write underneath this step was ' +
							'invisible. Re-capture the legacy answer with --freeze.')
				}
			}
		}

		def factFiles = ['effect-model.tsv', 'business-values.tsv', 'foreign-key-graph.tsv',
			'semantic-facts.tsv', 'network-classes.tsv', 'concurrency-facts.tsv',
			'allowed-browser-errors.tsv', 'write-flow.tsv',
			// In the digest because it decides HOW every other fact class is
			// compared. A relaxation that did not force a re-review would be the
			// cheapest way to make a failing oracle pass.
			'transport-class-policy.tsv']
		def reviewDigest = java.security.MessageDigest.getInstance('SHA-256')
		factFiles.each { name ->
			reviewDigest.update(name.getBytes('UTF-8'))
			reviewDigest.update(new File(dir, name).bytes)
		}
		new File(dir, 'effect-model').listFiles().sort { it.name }.each { document ->
			reviewDigest.update(document.name.getBytes('UTF-8'))
			reviewDigest.update(document.bytes)
		}
		def reviewed = reviewDigest.digest().encodeHex().toString()
		if (!readmeText.contains(reviewed)) {
			throw new GradleException(
				"The Phase 5g-1a domain review does not record the committed facts: their " +
					"digest is ${reviewed}, which README.md does not carry. Re-review the " +
					'capture and record the new digest.')
		}

		phase5g1aBuildRoot.get().file('manifest-verified.txt').asFile.with {
			parentFile.mkdirs()
			text = "verified ${expected.size()} write oracle contract file(s)\n"
		}
		logger.lifecycle("Verified ${expected.size()} write oracle contract files")
	}
}

tasks.register('phase5g1aFinalVerification') {
	group = 'verification'
	description =
		'Runs the database-neutral Phase 5g-1a write oracle gate and every earlier phase gate'
	dependsOn(
		tasks.named('verifyPhase5gWriteOracleManifest'),
		tasks.named('verifyPhase5gWriteAttribution'),
		tasks.named('verifyPhase5gWriteNormalizerMutationProof'),
		tasks.named('verifyPhase5gTransportClassPolicyProof'),
		tasks.named('verifyPhase5gAmbientClassificationMutationProof'),
		tasks.named('phase5g0FinalVerification'))
}

// ---------------------------------------------------------------------------
// Phase 5g-1a-y: corrected-legacy workflow-attribution oracle amendment.
// ---------------------------------------------------------------------------
//
// The patch is contract data, not production source. These tasks prove the
// branch remains oracle-only and that the capture-only materializer is bounded
// before CI is allowed to run the corrected legacy runtime.

def phase5g1ayContractDir =
	rootProject.layout.projectDirectory.dir('contracts/phase5g1ay-workflow-attribution-v1')
def phase5g1ayBuildRoot = rootProject.layout.buildDirectory.dir('phase5g1ay')

tasks.register('verifyPhase5g1ayOracleContract', Exec) {
	group = 'verification'
	description =
		'Verifies the corrected-legacy patch, source/artifact immutability, bounded materializer, and contract manifest'
	inputs.dir phase5g1ayContractDir
	inputs.files(
		phase5g1aScript('validate-phase5g1ay-oracle.py'),
		phase5g1aScript('derive-write-oracle-facts.py'),
		phase5g1aScript('normalize_write_capture.py'),
		phase5g1aScript('materialize-phase5g1ay-corrected-runtime.sh'),
		phase5g1aScript('guard-phase5g1ay-ordinary-runtime.sh'),
		phase5g1aScript('run-write-oracle-smoke.sh'),
		phase5g1aContractDir.file('measurement-scope.tsv'),
		phase5g1aContractDir.file('ambient-tables.tsv'),
		phase5g1aContractDir.file('normalization-policy.md'),
		phase5g1aContractDir.file('business-values.tsv'),
		phase5g1aContractDir.file('foreign-key-graph.tsv'),
		phase5g1aContractDir.file('effect-model/create.txt'),
		rootProject.file('gradle/phase5/write-oracle.gradle'),
		rootProject.file('scripts/phase3/run-isolated-ant-build.sh'),
		rootProject.file('install/build.xml'),
		rootProject.file('install/Adempiere/build.xml'))
	outputs.file phase5g1ayBuildRoot.map { it.file('oracle-contract-summary.tsv') }
	outputs.upToDateWhen { false }
	commandLine(
		'python3',
		phase5g1aScript('validate-phase5g1ay-oracle.py').absolutePath,
		'--repo-root', rootProject.projectDir,
		'--contract-dir', phase5g1ayContractDir.asFile,
		'--summary',
		phase5g1ayBuildRoot.get().file('oracle-contract-summary.tsv').asFile)
}

tasks.register('verifyPhase5g1ayProvenanceSchema', Exec) {
	group = 'verification'
	description =
		'Proves the corrected-legacy capture provenance fixture carries every required field'
	inputs.files(
		phase5g1aScript('validate-phase5g1ay-provenance.py'),
		phase5g1ayContractDir.file('capture-contract.tsv'),
		phase5g1ayContractDir.file('allowed-patched-paths.txt'),
		phase5g1ayContractDir.file('provenance-schema-fixture.json'))
	commandLine(
		'python3',
		phase5g1aScript('validate-phase5g1ay-provenance.py').absolutePath,
		'--provenance', phase5g1ayContractDir.file('provenance-schema-fixture.json').asFile,
		'--contract-dir', phase5g1ayContractDir.asFile,
		'--repo-root', rootProject.projectDir,
		'--schema-fixture')
}

tasks.register('verifyPhase5g1ayMutationProof', Exec) {
	group = 'verification'
	description =
		'Proves the corrected-legacy patch, manifest, path, and provenance validators fail closed'
	inputs.files(
		phase5g1aScript('validate-phase5g1ay-oracle.py'),
		phase5g1aScript('validate-phase5g1ay-provenance.py'),
		phase5g1aScript('verify-phase5g1ay-mutation-proof.py'),
		phase5g1aScript('materialize-phase5g1ay-corrected-runtime.sh'),
		phase5g1aScript('run-write-oracle-smoke.sh'),
		phase5g1aScript('guard-phase5g1ay-ordinary-runtime.sh'),
		rootProject.file('gradle/phase5/write-oracle.gradle'),
		phase5g1aContractDir.file('measurement-scope.tsv'),
		phase5g1aContractDir.file('ambient-tables.tsv'),
		phase5g1aContractDir.file('normalization-policy.md'),
		phase5g1aContractDir.file('business-values.tsv'),
		phase5g1aContractDir.file('foreign-key-graph.tsv'),
		phase5g1aContractDir.file('effect-model/create.txt'))
	inputs.dir phase5g1ayContractDir
	outputs.file phase5g1ayBuildRoot.map { it.file('mutation-proof.tsv') }
	commandLine(
		'python3',
		phase5g1aScript('verify-phase5g1ay-mutation-proof.py').absolutePath,
		'--repo-root', rootProject.projectDir,
		'--report', phase5g1ayBuildRoot.get().file('mutation-proof.tsv').asFile)
	doLast {
		def report = phase5g1ayBuildRoot.get().file('mutation-proof.tsv').asFile
		def rows = report.readLines()
			.findAll { it && !it.startsWith('mutation\t') }
		if (rows.size() != 62 || rows.any { !it.endsWith('\tdetected') }) {
			throw new GradleException(
				"The Phase 5g-1a-y mutation proof recorded ${rows.size()} case(s); " +
					'the reviewed set is exactly 62 detected mutations.')
		}
		logger.lifecycle(
			"Phase 5g-1a-y mutation proof detected ${rows.size()} weakening(s)")
	}
}

tasks.register('phase5g1ayFinalVerification') {
	group = 'verification'
	description =
		'Runs the database-neutral corrected-legacy oracle-amendment validators and every earlier phase gate'
	dependsOn(
		tasks.named('phase5g1aFinalVerification'),
		tasks.named('verifyPhase5g1ayOracleContract'),
		tasks.named('verifyPhase5g1ayProvenanceSchema'),
		tasks.named('verifyPhase5g1ayMutationProof'))
}

// ---------------------------------------------------------------------------
// The database-backed capture lane.
// ---------------------------------------------------------------------------
//
// Everything above is database-neutral. This is the half that actually observes
// the legacy runtime, and it is the only half that can produce the oracle.

def phase5g1aProperty = { String name, Object fallback ->
	rootProject.providers.gradleProperty(name).getOrElse(fallback.toString())
}
def phase5g1ayMode = rootProject.providers
	.gradleProperty('phase5g1ayMode')
	.orElse(rootProject.providers.environmentVariable('ADEMPIERE_PHASE5G1AY_MODE'))
	.getOrElse('legacy')

// CI supplies the system password as an environment variable, not as a Gradle
// property, exactly as every other database-backed gate accepts it. Reading
// only the property would have made the gate fail in the one place it must run.
def phase5g1aSystemPassword = rootProject.providers
	.gradleProperty('phase3DbSystemPassword')
	.orElse(rootProject.providers.environmentVariable(
		'ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD'))
	.getOrElse('')

def phase5g1ayInstalledHome =
	rootProject.layout.buildDirectory.dir('phase3/runtime/Adempiere')
def phase5g1ayRuntimeGuardDir =
	phase5g1ayBuildRoot.map { it.dir('ordinary-runtime-guard') }
def phase5g1ayRuntimeGuardScript =
	phase5g1aScript('guard-phase5g1ay-ordinary-runtime.sh')

def snapshotPhase5g1ayOrdinaryRuntime =
	tasks.register('snapshotPhase5g1ayOrdinaryRuntime', Exec) {
		group = 'verification'
		description =
			'Snapshots the ordinary installed Adempiere.jar copies before corrected-runtime activation'
		dependsOn tasks.named('phase3AntDatabaseBuild')
		onlyIf { phase5g1ayMode == 'corrected-legacy-workflow-attribution' }
		outputs.upToDateWhen { false }
		commandLine(
			'bash',
			phase5g1ayRuntimeGuardScript.absolutePath,
			'snapshot',
			rootProject.projectDir,
			phase5g1ayInstalledHome.get().asFile,
			phase5g1ayRuntimeGuardDir.get().asFile)
	}

def restorePhase5g1ayOrdinaryRuntime =
	tasks.register('restorePhase5g1ayOrdinaryRuntime', Exec) {
		group = 'verification'
		description =
			'Restores and verifies the ordinary installed Adempiere.jar copies after the corrected lane'
		onlyIf { phase5g1ayMode == 'corrected-legacy-workflow-attribution' }
		outputs.upToDateWhen { false }
		commandLine(
			'bash',
			phase5g1ayRuntimeGuardScript.absolutePath,
			'restore',
			rootProject.projectDir,
			phase5g1ayInstalledHome.get().asFile,
			phase5g1ayRuntimeGuardDir.get().asFile,
			'--cleanup')
	}

tasks.register('phase5g1aLegacyWriteOracleSmoke', Exec) {
	group = 'verification'
	description =
		'Captures the legacy Business Partner write flow twice through the public /webui origin and scores both against the frozen oracle'
	dependsOn tasks.named('phase3AntDatabaseBuild')
	dependsOn snapshotPhase5g1ayOrdinaryRuntime
	// The write driver runs in the checksum-verified Phase 5c browser
	// installation. This increment adds no browser artifact.
	dependsOn tasks.named('installPhase5cBrowser')
	finalizedBy restorePhase5g1ayOrdinaryRuntime
	commandLine 'bash', phase5g1aScript('run-write-oracle-smoke.sh').absolutePath,
		phase5g1aProperty('phase3DbHost', '127.0.0.1'),
		phase5g1aProperty('phase3DbPort', '5432'),
		phase5g1aProperty('phase3DbName', 'adempiere_phase3_ci'),
		phase5g1aProperty('phase3DbUser', 'adempiere_phase3_ci'),
		phase5g1aProperty('phase3DbSystemUser', 'postgres'),
		'ADempiere Phase 3 disposable database',
		phase5g1aBuildRoot.get().dir('runtime-evidence').asFile.absolutePath,
		// Freeze mode is how the oracle is first produced. It is NOT an
		// acceptance run and the gate never uses it: a run that invents the
		// expected answer cannot also be the run that verifies it.
		phase5g1aProperty('phase5g1aFreeze', 'false'),
		phase5g1ayMode
	environment 'ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD', phase5g1aSystemPassword
	environment 'ADEMPIERE_PHASE5D_DB_PASSWORD',
		phase5g1aProperty('phase3DbPassword', 'adempiere_phase3_ci')
	doFirst {
		if (!(phase5g1ayMode in [
			'legacy',
			'corrected-legacy-workflow-attribution'
		])) {
			throw new GradleException(
				"Unsupported -Pphase5g1ayMode=${phase5g1ayMode}. The only corrected " +
					'legacy mode is corrected-legacy-workflow-attribution.')
		}
		if (!phase5g1aSystemPassword) {
			throw new GradleException(
				'-Pphase3DbSystemPassword or ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD is ' +
					'required: the write oracle lane restores a golden archive and ' +
					'cannot do so without the system role.')
		}
	}
}

// The Phase 3 cleanup finalizer drops the disposable database. It is attached to
// phase3AntDatabaseBuild, so without explicit ordering it can run before the
// capture lane that needs the database still standing -- and the lane would then
// fail against a database that no longer exists, for a reason that has nothing
// to do with the oracle.
tasks.matching { it.name == 'cleanupPhase3Database' }.configureEach { cleanup ->
	cleanup.mustRunAfter(tasks.named('phase5g1aLegacyWriteOracleSmoke'))
}
