def phase5fImplementation = { String context, String name ->
	if (phase5fServletClasses[context]?.containsKey(name)) {
		return phase5fServletClasses[context][name]
	}
	if (context == '/mobile') {
		return name == 'DisplayChart'
			? 'org.jfree.chart.servlet.DisplayChart'
			: "org.compiere.mobile.${name}"
	}
	if (context == '/adempiere') {
		return name == 'WRequest'
			? 'org.compiere.wstore.RequestServlet'
			: "org.compiere.www.${name}"
	}
	if (context == '/wstore') {
		def jsp = [
			Basket: '/basket.jsp', Index: '/index.jsp', Info: '/info.jsp',
			Login: '/login.jsp', Request: '/request.jsp',
		]
		return jsp.containsKey(name) ? [jsp: jsp[name]] : "org.compiere.wstore.${name}"
	}
	throw new GradleException("No Phase 5f implementation rule for ${context} ${name}")
}

def phase5fReadRoutes = {
	def rows = phase5fContract.readLines('UTF-8').drop(1).findAll { it }
		.collect { line ->
			def fields = line.split('\t', -1)
			def id = fields[0].split('::', -1)
			[context: fields[1], name: id[1], pattern: id[2]]
		}
	rows.findAll { it.context in phase5fContexts.values()*.context }
}

def phase5fXml = { String value ->
	value.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
}

// A legacy <error-page> whose <location> resolves to a mapped servlet makes
// sendError() observable as that servlet's response rather than as the raw
// status. The ROOT context relies on this: sendError(404) is dispatched to '/',
// which Broadcast serves, so the legacy runtime answers 302. Phase 5f
// synthesizes a curated metadata-complete descriptor, so these entries have to
// be carried over from the legacy descriptor explicitly; otherwise the modern
// context returns the container default error page and diverges from the frozen
// legacy oracle.
def phase5fLegacyErrorPages = { String context ->
	def entry = phase5fContexts.values().find { it.context == context }
	if (entry == null) {
		throw new GradleException(
			"No Phase 5f context definition for ${context}")
	}
	def descriptor = file("${entry.web}/WEB-INF/web.xml")
	if (!descriptor.isFile()) {
		throw new GradleException(
			"Missing legacy descriptor ${descriptor} for ${context}")
	}
	(descriptor.getText('UTF-8') =~ /(?s)<error-page>(.*?)<\/error-page>/)
		.collect { match ->
			def body = match[1]
			def code = (body =~ /(?s)<error-code>\s*(.*?)\s*<\/error-code>/)
			def location = (body =~ /(?s)<location>\s*(.*?)\s*<\/location>/)
			if (!code || !location) {
				throw new GradleException(
					"Unsupported legacy <error-page> in ${descriptor}: Phase 5f "
						+ 'only carries over <error-code>/<location> pairs')
			}
			[code: code[0][1], location: location[0][1]]
		}
}

def phase5fDescriptor = { String context, int timeout ->
	def routes = phase5fReadRoutes().findAll { it.context == context }
	def filterNames = [
		'/admin': ['AdempiereMonitorFilter'],
		'/mobile': ['WFilter'],
		'/adempiere': ['WFilter'],
		'/wstore': ['WebStoreFilter'],
	].get(context, [])
	def declarations = new LinkedHashMap()
	routes.findAll { !filterNames.contains(it.name) }.each { row ->
		declarations.putIfAbsent(row.name, phase5fImplementation(context, row.name))
	}
	def out = new StringBuilder()
	out << '<?xml version="1.0" encoding="UTF-8"?>\n'
	out << '<web-app xmlns="https://jakarta.ee/xml/ns/jakartaee"\n'
	out << '  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"\n'
	out << '  xsi:schemaLocation="https://jakarta.ee/xml/ns/jakartaee '
	out << 'https://jakarta.ee/xml/ns/jakartaee/web-app_6_0.xsd"\n'
	out << '  version="6.0" metadata-complete="true">\n'
	out << '  <absolute-ordering/>\n'
	if (context == '/admin') {
		out << '  <filter><filter-name>AdempiereMonitorFilter</filter-name>'
		out << '<filter-class>org.compiere.web.AdempiereMonitorFilter</filter-class></filter>\n'
		out << '  <filter-mapping><filter-name>AdempiereMonitorFilter</filter-name>'
		out << '<url-pattern>/adempiereMonitor/*</url-pattern></filter-mapping>\n'
	}
	if (context == '/mobile') {
		out << '  <filter><filter-name>WFilter</filter-name>'
		out << '<filter-class>org.compiere.mobile.WFilter</filter-class></filter>\n'
		out << '  <filter-mapping><filter-name>WFilter</filter-name>'
		out << '<url-pattern>/*</url-pattern></filter-mapping>\n'
	}
	if (context == '/adempiere') {
		out << '  <filter><filter-name>WFilter</filter-name>'
		out << '<filter-class>org.compiere.www.WFilter</filter-class></filter>\n'
		out << '  <filter-mapping><filter-name>WFilter</filter-name>'
		out << '<url-pattern>/*</url-pattern></filter-mapping>\n'
	}
	if (context == '/wstore') {
		out << '  <filter><filter-name>WebStoreFilter</filter-name>'
		out << '<filter-class>org.compiere.wstore.StoreFilter</filter-class></filter>\n'
		out << '  <filter-mapping><filter-name>WebStoreFilter</filter-name>'
		out << '<url-pattern>/*</url-pattern></filter-mapping>\n'
	}
	if (context == '/') {
		['org.compiere.cm.utils.Counter', 'org.compiere.cm.utils.Attributes'].each {
			out << "  <listener><listener-class>${it}</listener-class></listener>\n"
		}
	}
	declarations.each { name, implementation ->
		out << "  <servlet><servlet-name>${phase5fXml(name)}</servlet-name>"
		if (implementation instanceof Map) {
			out << "<jsp-file>${implementation.jsp}</jsp-file>"
		} else {
			out << "<servlet-class>${implementation}</servlet-class>"
		}
		out << '</servlet>\n'
	}
	routes.findAll { !filterNames.contains(it.name) }.each { row ->
		out << "  <servlet-mapping><servlet-name>${phase5fXml(row.name)}</servlet-name>"
		out << "<url-pattern>${phase5fXml(row.pattern)}</url-pattern></servlet-mapping>\n"
	}
	if (context == '/wstore') {
		out << '  <security-constraint><web-resource-collection><web-resource-name>'
		out << 'SSL pages</web-resource-name><url-pattern>/login.jsp</url-pattern>'
		out << '<url-pattern>/login.jsp/*</url-pattern>'
		out << '<url-pattern>/loginServlet</url-pattern><url-pattern>/checkOutServlet</url-pattern>'
		out << '<url-pattern>/loginServlet/*</url-pattern>'
		out << '<url-pattern>/checkOutServlet/*</url-pattern>'
		out << '<url-pattern>/orderServlet</url-pattern>'
		out << '<url-pattern>/orderServlet/*</url-pattern></web-resource-collection>'
		out << '<user-data-constraint><transport-guarantee>CONFIDENTIAL</transport-guarantee>'
		out << '</user-data-constraint></security-constraint>\n'
	}
	phase5fLegacyErrorPages(context).each { page ->
		out << "  <error-page><error-code>${phase5fXml(page.code)}</error-code>"
		out << "<location>${phase5fXml(page.location)}</location></error-page>\n"
	}
	out << "  <session-config><session-timeout>${timeout}</session-timeout>"
	out << '<tracking-mode>COOKIE</tracking-mode></session-config>\n'
	out << '  <resource-ref><res-ref-name>java/AdempiereDS</res-ref-name>'
	out << '<res-type>javax.sql.DataSource</res-type><res-auth>Container</res-auth></resource-ref>\n'
	out << '  <resource-ref><res-ref-name>java/AdempiereSRDS</res-ref-name>'
	out << '<res-type>javax.sql.DataSource</res-type><res-auth>Container</res-auth></resource-ref>\n'
	out << '</web-app>\n'
	out.toString()
}

tasks.register('preparePhase5fJakartaSources') {
	group = 'build'
	description = 'Creates the closed, manifest-owned Jakarta Servlet 6 source closure'
	def output = phase5fBuildDir.map { it.dir('sources') }
	outputs.dir output
	inputs.files(
		phase5fContexts.values().collectMany { it.sources }.collect { fileTree(it) } +
		phase5fSharedSources.collect { file(it) })
	doLast {
		delete output
		phase5fSharedSources.each { path ->
			copy {
				from file(path)
				into output.get().dir("shared/${new File(path).parent}")
				filter { String line -> line.replace('javax.servlet', 'jakarta.servlet') }
			}
		}
		phase5fContexts.each { name, spec ->
			spec.sources.each { sourceRoot ->
				copy {
					from sourceRoot
					into output.get().dir(name.toString())
					if (spec.includes) {
						include spec.includes
					} else {
						include '**/*.java'
					}
					filter { String line ->
						def migrated = line.replace('javax.servlet', 'jakarta.servlet')
						if (migrated.contains(
							'import org.apache.taglibs.standard.tag.el.core.ExpressionUtil;')) {
							return ''
						}
						def replacements = [
							'String info = (String)ExpressionUtil.evalNotNull ("location", "countryID",':
								'String info = JspExpression.evaluate(m_countryID_el, String.class, pageContext);',
							'String info = (String)ExpressionUtil.evalNotNull ("location", "regionID",':
								'String info = JspExpression.evaluate(m_regionID_el, String.class, pageContext);',
							'String city = (String)ExpressionUtil.evalNotNull ("location", "city",':
								'String city = JspExpression.evaluate(m_city_el, String.class, pageContext);',
							'String postal = (String)ExpressionUtil.evalNotNull ("location", "postal",':
								'String postal = JspExpression.evaluate(m_postal_el, String.class, pageContext);',
							'String regionName = (String)ExpressionUtil.evalNotNull ("location", "regionName",':
								'String regionName = JspExpression.evaluate(m_regionName_el, String.class, pageContext);',
							'info = (String)ExpressionUtil.evalNotNull ("workflow", "activityID",':
								'info = JspExpression.evaluate(m_activityID_el, String.class, pageContext);',
								'String info = (String)ExpressionUtil.evalNotNull ("requestOrder", "bpartnerID",':
									'String info = JspExpression.evaluate(m_bpartnerID_el, String.class, pageContext);',
						]
						def hit = replacements.find { from, to -> migrated.contains(from) }
						if (hit != null) {
							return migrated.substring(0, migrated.indexOf(migrated.trim())) + hit.value
						}
						if (migrated ==~ /\s*m_(countryID|regionID|city|postal|regionName|activityID|bpartnerID)_el, String\.class, this, pageContext\);\s*/) {
							return ''
						}
						migrated
					}
				}
			}
		}
		// Each transform below implements exactly one reviewed deviation from
		// contracts/phase5f-jakarta-web-v1/known-deviations.tsv. The anchor
		// count is asserted so an upstream source edit fails the build instead
		// of silently dropping the deviation.
		def replaceExactly = { String relativePath, String from, String to ->
			def source = output.get().file(relativePath).asFile
			def text = source.getText('UTF-8')
			if (text.count(from) != 1) {
				throw new GradleException(
					"The generated ${relativePath} source no longer has exactly "
						+ 'one reviewed occurrence of the transformed statement')
			}
			source.setText(text.replace(from, to), 'UTF-8')
		}
		// DEV-P5F-ERR-01 /::AdRedirector::/AdRedirector
		replaceExactly(
			'ROOT/org/compiere/cm/AdRedirector.java',
			'response.sendError(500,"Unknown or illegal Ad set, can\'t handle request...");',
			'response.sendError(HttpServletResponse.SC_BAD_REQUEST, "Unknown or illegal Ad set, can\'t handle request...");')
		// DEV-P5F-ERR-02 /::Community::/communityServlet. getAllIDs is called
		// with an empty transaction name, so Trx.get rejects it and the
		// resulting DBException escaped as a 500. The reviewed deviation keeps
		// the query unchanged and reports the bad request instead. The thrown
		// type is DBException; the IllegalArgumentException is only its cause.
		replaceExactly(
			'ROOT/org/compiere/cm/Community.java',
			'int [] allIDs = X_W_Store.getAllIDs ("W_Store", "AD_Client_ID=" + ctx.get ("#AD_Client_ID"), "");',
			'''int [] allIDs;
			try
			{
				allIDs = X_W_Store.getAllIDs ("W_Store", "AD_Client_ID=" + ctx.get ("#AD_Client_ID"), "");
			}
			catch (org.adempiere.exceptions.DBException missingTransaction)
			{
				response.sendError(HttpServletResponse.SC_BAD_REQUEST, "No Transaction Name");
				return;
			}''')
		// DEV-P5F-ERR-03 /::XMLBroadcast::/xml/*. setStatus is deliberate:
		// the ROOT descriptor maps error code 404 to '/', so sendError(404)
		// would be dispatched to Broadcast and observed as a 302 redirect.
		replaceExactly(
			'ROOT/org/compiere/cm/XMLBroadcast.java',
			'resetInternalMediaURL (request);',
			'''if (thisRequest.getWebProject() == null)
		{
			response.setStatus(HttpServletResponse.SC_NOT_FOUND);
			return;
		}
		resetInternalMediaURL (request);''')
		// DEV-P5F-ERR-04 /wstore::PaymentServlet::/paymentServlet. A GET without
		// a payment amount fell through to doPost, so the mutation handler ran
		// on a GET and failed with 500. Reject it before any response is
		// committed; parameterized GETs keep their legacy behaviour.
		replaceExactly(
			'wstore/org/compiere/wstore/PaymentServlet.java',
			'log.info("Get from " + request.getRemoteHost() + " - " + request.getRemoteAddr());',
			'''log.info("Get from " + request.getRemoteHost() + " - " + request.getRemoteAddr());
		String phase5fAmt = WebUtil.getParameter (request, "Amt");
		if (phase5fAmt == null || phase5fAmt.length() == 0)
		{
			response.setHeader("Allow", "POST");
			response.sendError(HttpServletResponse.SC_METHOD_NOT_ALLOWED,
				"Payment mutation is not defined for plain GET");
			return;
		}''')
		def helper = output.get().file(
			'wstore/org/compiere/wstore/JspExpression.java').asFile
		helper.parentFile.mkdirs()
		helper.setText('''package org.compiere.wstore;

import jakarta.el.ExpressionFactory;
import jakarta.servlet.jsp.PageContext;

final class JspExpression {
    private JspExpression() {
    }

    static <T> T evaluate(String expression, Class<T> expectedType, PageContext pageContext) {
        if (expression == null) {
            return null;
        }
        Object value = ExpressionFactory.newInstance()
            .createValueExpression(pageContext.getELContext(), expression, expectedType)
            .getValue(pageContext.getELContext());
        return expectedType.cast(value);
    }
}
''', 'UTF-8')
	}
}

tasks.register('preparePhase5fJakartaWebAssets') {
	group = 'build'
	description = 'Creates isolated Jakarta JSP, tag, and static web trees without changing legacy assets'
	def output = phase5fBuildDir.map { it.dir('web') }
	outputs.dir output
	inputs.files phase5fContexts.values().collect {
		fileTree(it.web) { exclude phase5fWebAssetExcludes }
	}
	doLast {
		delete output
		phase5fContexts.each { name, spec ->
			def destination = output.get().dir(name.toString())
			copy {
				from spec.web
				into destination
				exclude phase5fWebAssetExcludes
				exclude phase5fTextAssetExtensions.collect { "**/*.${it}" }
			}
			copy {
				from spec.web
				into destination
				include phase5fTextAssetExtensions.collect { "**/*.${it}" }
				exclude phase5fWebAssetExcludes
				filter { String line ->
					line
						.replace('javax.servlet', 'jakarta.servlet')
						.replace('http://java.sun.com/jsp/jstl/core', 'jakarta.tags.core')
						.replace('http://java.sun.com/jsp/jstl/fmt', 'jakarta.tags.fmt')
						.replace('http://java.sun.com/jsp/jstl/functions', 'jakarta.tags.functions')
						.replace('http://java.sun.com/xml/ns/j2ee', 'https://jakarta.ee/xml/ns/jakartaee')
						.replace('web-jsptaglibrary_2_0.xsd', 'web-jsptaglibrary_3_0.xsd')
						.replace('version="2.0"', 'version="3.0"')
				}
			}
		}
	}
}

tasks.register('verifyPhase5fBinaryWebAssets') {
	group = 'verification'
	description = 'Proves every generated and packaged binary web asset is byte-identical to legacy input'
	dependsOn tasks.named('phase5fJakartaWebWars')
	doLast {
		def problems = []
		def binaryCount = 0
		def representative = ['gif', 'jpg', 'png', 'ico'].collectEntries { [(it): 0] }
		phase5fContexts.each { name, spec ->
			def sourceRoot = file(spec.web)
			def generatedRoot = phase5fBuildDir.get().dir("web/${name}").asFile
			def warName = name == 'ROOT' ? 'ROOT-modern.war' : "${name}-modern.war"
			def war = project(':serverRoot').layout.buildDirectory
				.file("phase5f-wars/${warName}").get().asFile
			new java.util.zip.ZipFile(war).withCloseable { archive ->
				archive.entries().findAll { !it.directory }.each { entry ->
					def path = entry.name
					if (path.endsWith('.war') ||
						path.startsWith('build/') ||
						path.startsWith('dist/') ||
						path.contains('/build/') ||
						path.contains('/dist/')) {
						problems << "${war.name} packages nested build output ${path}"
					}
				}
				fileTree(generatedRoot).files.each { generated ->
					def path = generatedRoot.toPath().relativize(generated.toPath())
						.toString().replace('\\', '/')
					if (path.endsWith('.war') ||
						path.startsWith('build/') ||
						path.startsWith('dist/') ||
						path.contains('/build/') ||
						path.contains('/dist/')) {
						problems << "${name}:${path} survives in generated assets"
					}
				}
				fileTree(sourceRoot).files.sort { it.path }.each { source ->
					def relative = sourceRoot.toPath().relativize(source.toPath())
						.toString().replace('\\', '/')
					if (phase5fExcludedWebAsset(relative) || phase5fTextAsset(relative)) {
						return
					}
					binaryCount++
					def extension = relative.contains('.')
						? relative.substring(relative.lastIndexOf('.') + 1).toLowerCase(Locale.ROOT)
						: ''
					if (representative.containsKey(extension)) {
						representative[extension]++
					}
					def generated = new File(generatedRoot, relative)
					if (!generated.isFile() ||
						!java.util.Arrays.equals(source.bytes, generated.bytes)) {
						problems << "${name}:${relative} changed in generated assets"
						return
					}
					def entry = archive.getEntry(relative)
					if (entry == null) {
						problems << "${name}:${relative} is absent from ${war.name}"
						return
					}
					def packaged = archive.getInputStream(entry).withCloseable { it.bytes }
					if (!java.util.Arrays.equals(source.bytes, packaged)) {
						problems << "${name}:${relative} changed in ${war.name}"
					}
				}
			}
		}
		if (binaryCount == 0) {
			problems << 'no binary assets were checked'
		}
		representative.each { extension, count ->
			if (count == 0) {
				problems << "no representative .${extension} asset was checked"
			}
		}
		if (!problems.empty) {
			throw new GradleException(
				"Phase 5f binary asset integrity failed:\n  - " +
					problems.take(50).join('\n  - '))
		}
		logger.lifecycle(
			"Phase 5f binary assets: ${binaryCount} generated and packaged files " +
				"are byte-identical; representatives ${representative}")
	}
}

tasks.register('writePhase5fServlet6Descriptors') {
	group = 'build'
	description = 'Writes explicit metadata-complete Servlet 6 descriptors from the reviewed route ledger'
	inputs.file phase5fContract
	// The generated descriptor now carries the legacy <error-page> entries over,
	// so each legacy descriptor is a real input. Without this a change to one of
	// them leaves the task UP-TO-DATE and packages a stale WEB-INF/web.xml.
	inputs.files phase5fContexts.values().collect {
		file("${it.web}/WEB-INF/web.xml")
	}
	def output = phase5fBuildDir.map { it.dir('descriptors') }
	outputs.dir output
	doLast {
		delete output
		phase5fContexts.each { name, spec ->
			def descriptor = output.get().file("${name}/WEB-INF/web.xml").asFile
			descriptor.parentFile.mkdirs()
			descriptor.setText(phase5fDescriptor(spec.context, spec.sessionTimeout), 'UTF-8')
		}
	}
}

def phase5fOwner = project(':serverRoot')
phase5fOwner.ext.phase5fConfigure = {
	def shared = phase5fOwner.sourceSets.create('phase5fShared') {
		java.srcDir(rootProject.layout.buildDirectory.dir(
			'phase5f/jakarta-web/sources/shared'))
		resources.srcDirs = []
	}
	phase5fOwner.tasks.named(shared.compileJavaTaskName) {
		dependsOn rootProject.tasks.named('preparePhase5fJakartaSources')
	}
	[
		phase5fOwner.project(':base'),
		phase5fOwner.project(':org.adempiere.asset'),
	].each {
		phase5fOwner.dependencies.add('phase5fSharedImplementation', it)
	}
	phase5fOwner.dependencies.add(
		'phase5fSharedCompileOnly', "jakarta.servlet:jakarta.servlet-api:${phase5fServletApi}")
	phase5fOwner.dependencies.add(
		'phase5fSharedImplementation', 'com.sun.mail:javax.mail:1.4.7')

	def sharedJar = phase5fOwner.tasks.register('phase5fSharedJakartaJar', Jar) {
		dependsOn phase5fOwner.tasks.named(shared.classesTaskName)
		archiveFileName = 'phase5f-shared-jakarta.jar'
		destinationDirectory = phase5fOwner.layout.buildDirectory.dir('phase5f-runtime')
		from shared.output
		reproducibleFileOrder = true
		preserveFileTimestamps = false
	}
	def sanitizedBase = phase5fOwner.tasks.register('phase5fLegacyBaseRuntimeJar', Jar) {
		dependsOn ':base:jar'
		inputs.property('phase5fServletLinkedCoreClasses', [
			'MAd', 'FileUpload', 'WebEnv', 'WebLogin', 'WebSessionCtx', 'WebUser', 'WebUtil'])
		archiveFileName = 'phase5f-base-runtime.jar'
		destinationDirectory = phase5fOwner.layout.buildDirectory.dir('phase5f-runtime')
		from { zipTree(project(':base').tasks.named('jar').get().archiveFile) }
		exclude(
			'org/compiere/model/MAd.class',
			'org/compiere/model/MAd$*.class',
			'org/compiere/util/FileUpload*.class',
			'org/compiere/util/WebEnv*.class',
			'org/compiere/util/WebLogin*.class',
			'org/compiere/util/WebSessionCtx*.class',
			'org/compiere/util/WebUser*.class',
			'org/compiere/util/WebUtil*.class',
			'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA')
		reproducibleFileOrder = true
		preserveFileTimestamps = false
	}
	def sanitizedAsset = phase5fOwner.tasks.register('phase5fLegacyAssetRuntimeJar', Jar) {
		dependsOn ':org.adempiere.asset:jar'
		inputs.property(
			'phase5fServletLinkedAssetClasses', ['MAssetDelivery', 'MRegistration'])
		archiveFileName = 'phase5f-asset-runtime.jar'
		destinationDirectory = phase5fOwner.layout.buildDirectory.dir('phase5f-runtime')
		from { zipTree(project(':org.adempiere.asset').tasks.named('jar').get().archiveFile) }
		exclude(
			'org/compiere/asset/model/MAssetDelivery*.class',
			'org/compiere/asset/model/MRegistration.class',
			'org/compiere/asset/model/MRegistration$*.class',
			'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA')
		reproducibleFileOrder = true
		preserveFileTimestamps = false
	}
	phase5fContexts.each { name, spec ->
		def sourceSetName = "phase5f${name.toString().capitalize()}"
		def sourceSet = phase5fOwner.sourceSets.create(sourceSetName) {
			java.srcDir(rootProject.layout.buildDirectory.dir(
				"phase5f/jakarta-web/sources/${name}"))
			resources.srcDirs = []
		}
		phase5fOwner.tasks.named(sourceSet.compileJavaTaskName) {
			dependsOn rootProject.tasks.named('preparePhase5fJakartaSources')
			options.compilerArgs += ['-Xlint:all,-serial,-deprecation']
		}
		phase5fOwner.dependencies.add(
			"${sourceSetName}Implementation", phase5fOwner.files(shared.output))
		phase5fOwner.dependencies.add(
			"${sourceSetName}Implementation", phase5fOwner.files(phase5fOwner.sourceSets.main.output))
		phase5fOwner.dependencies.add(
			"${sourceSetName}Implementation", phase5fOwner.project(':base'))
		phase5fOwner.dependencies.add(
			"${sourceSetName}Implementation", phase5fOwner.project(':client'))
		phase5fOwner.dependencies.add(
			"${sourceSetName}Implementation", phase5fOwner.project(':JasperReports'))
		phase5fOwner.dependencies.add(
			"${sourceSetName}Implementation", phase5fOwner.project(':org.adempiere.asset'))
		phase5fOwner.dependencies.add(
			"${sourceSetName}Implementation", 'org.jfree:jfreechart:1.0.14')
		phase5fOwner.dependencies.add(
			"${sourceSetName}Implementation", 'commons-codec:commons-codec:1.15')
		phase5fOwner.dependencies.add(
			"${sourceSetName}Implementation", 'commons-lang:commons-lang:2.6')
		phase5fOwner.dependencies.add(
			"${sourceSetName}Implementation", 'com.sun.mail:javax.mail:1.4.7')
		phase5fOwner.dependencies.add(
			"${sourceSetName}CompileOnly", "jakarta.servlet:jakarta.servlet-api:${phase5fServletApi}")
		phase5fOwner.dependencies.add(
			"${sourceSetName}CompileOnly", "jakarta.servlet.jsp:jakarta.servlet.jsp-api:${phase5fPagesApi}")
		phase5fOwner.dependencies.add(
			"${sourceSetName}CompileOnly", 'jakarta.el:jakarta.el-api:5.0.1')
		phase5fOwner.dependencies.add(
			"${sourceSetName}CompileOnly", "jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:${phase5fTagsApi}")
		if (name == 'wstore') {
			phase5fOwner.dependencies.add(
				"${sourceSetName}RuntimeOnly",
				"jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:${phase5fTagsApi}")
			phase5fOwner.dependencies.add(
				"${sourceSetName}RuntimeOnly",
				'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1')
		}

		def warTask = phase5fOwner.tasks.register("phase5f${name.toString().capitalize()}War", War) {
			group = 'build'
			description = "Builds the deterministic source-native Jakarta ${spec.context} WAR"
			dependsOn rootProject.tasks.named('writePhase5fServlet6Descriptors')
			dependsOn rootProject.tasks.named('preparePhase5fJakartaWebAssets')
			dependsOn phase5fOwner.tasks.named(sourceSet.classesTaskName)
			dependsOn sharedJar, sanitizedBase, sanitizedAsset
			archiveFileName = name == 'ROOT' ? 'ROOT-modern.war' : "${name}-modern.war"
			destinationDirectory = phase5fOwner.layout.buildDirectory.dir('phase5f-wars')
			classpath = phase5fOwner.configurations[
				sourceSet.runtimeClasspathConfigurationName].filter { dependency ->
				!(dependency.name ==~ /(?i)(javaee-api|javax\.servlet-api|jakarta\.servlet-api|servlet-api|jsp-api)-.*\.jar/)
					&& !dependency.absolutePath.endsWith('/tools/lib/harness-1.0.0.jar')
					&& !(dependency.name ==~ /base-.*\.jar/)
					&& !(dependency.name ==~ /org\.adempiere\.asset-.*\.jar/)
			}
			from(sourceSet.output) { into 'WEB-INF/classes' }
			from(rootProject.layout.buildDirectory.dir(
				"phase5f/jakarta-web/web/${name}"))
			into('WEB-INF/lib') {
				from sharedJar
				from sanitizedBase
				from sanitizedAsset
			}
			from(rootProject.layout.buildDirectory.file(
				"phase5f/jakarta-web/descriptors/${name}/WEB-INF/web.xml")) {
				into 'WEB-INF'
			}
			reproducibleFileOrder = true
			preserveFileTimestamps = false
			duplicatesStrategy = DuplicatesStrategy.FAIL
		}
		rootProject.tasks.named('phase5fJakartaWebWars').configure { dependsOn warTask }
	}
}

