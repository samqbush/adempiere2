tasks.register('verifyPhase5fJakartaNamespaceClosure') {
	group = 'verification'
	description = 'Proves the generated source closure migrated Servlet APIs while preserving Java SE javax'
	dependsOn tasks.named('preparePhase5fJakartaSources')
	doLast {
		def sources = fileTree(phase5fBuildDir.map { it.dir('sources') }) { include '**/*.java' }
		if (sources.empty) {
			throw new GradleException('Phase 5f Jakarta source closure is empty')
		}
		def servlet = []
		def javaSe = 0
		sources.each { source ->
			def text = source.getText('UTF-8')
			if (text.contains('javax.servlet')) {
				servlet << relativePath(source)
			}
			if (text =~ /javax\.(swing|print|sql|naming|xml)\b/) {
				javaSe++
			}
		}
		if (!servlet.empty) {
			throw new GradleException("Legacy Servlet namespace remains: ${servlet}")
		}
		if (javaSe == 0) {
			throw new GradleException('The closure no longer proves retention of Java SE javax namespaces')
		}
		def bridge = fileTree('org.adempiere.cohort/src/bridge') { include '**/*.java' }
		if (!bridge.any { it.getText('UTF-8').contains('javax.servlet') }) {
			throw new GradleException('The frozen Phase 5e Javax bridge was unexpectedly migrated')
		}
	}
}

tasks.register('verifyPhase5fServletDiscoveryAbsence') {
	group = 'verification'
	description = 'Rejects annotations, web fragments, and ServletContainerInitializers in modern WARs'
	dependsOn tasks.named('phase5fJakartaWebWars')
	doLast {
		def problems = []
		fileTree(phase5fBuildDir.map { it.dir('sources') }) { include '**/*.java' }.each { source ->
			def text = source.getText('UTF-8')
			['@WebServlet', '@WebFilter', '@WebListener', 'ServletContainerInitializer'].each {
				if (text.contains(it)) problems << "${relativePath(source)} contains ${it}"
			}
		}
		fileTree(project(':serverRoot').layout.buildDirectory.dir('phase5f-wars')) {
			include '*.war'
		}.each { war ->
			zipTree(war).matching {
				include 'META-INF/web-fragment.xml'
				include 'META-INF/services/jakarta.servlet.ServletContainerInitializer'
			}.each { problems << "${war.name} contains discovery metadata ${it}" }
			new java.util.zip.ZipFile(war).withCloseable { archive ->
				archive.entries().findAll {
					!it.directory && it.name.startsWith('WEB-INF/lib/') &&
						it.name.endsWith('.jar')
				}.each { library ->
					def nested = new java.util.zip.ZipInputStream(
						archive.getInputStream(library))
					try {
						for (def entry = nested.nextEntry; entry != null; entry = nested.nextEntry) {
							if (entry.name in [
								'META-INF/web-fragment.xml',
								'META-INF/services/jakarta.servlet.ServletContainerInitializer',
							]) {
								problems << "${war.name}!/${library.name}!/${entry.name}"
							}
						}
					} finally {
						nested.close()
					}
				}
			}
		}
		if (!problems.empty) {
			throw new GradleException("Implicit Servlet discovery is forbidden: ${problems}")
		}
	}
}

tasks.register('verifyPhase5fServlet6Descriptors') {
	group = 'verification'
	description = 'Checks explicit Servlet 6 descriptors against all contracted context routes'
	dependsOn tasks.named('writePhase5fServlet6Descriptors')
	doLast {
		phase5fContexts.each { name, spec ->
			def descriptor = phase5fBuildDir.get().file(
				"descriptors/${name}/WEB-INF/web.xml").asFile
			def text = descriptor.getText('UTF-8')
			[
				'version="6.0"', 'metadata-complete="true"', '<absolute-ordering/>',
				'<tracking-mode>COOKIE</tracking-mode>',
			].each { required ->
				if (!text.contains(required)) {
					throw new GradleException("${descriptor} lacks ${required}")
				}
			}
			phase5fLegacyErrorPages(spec.context).each { page ->
				def carried =
					"<error-page><error-code>${phase5fXml(page.code)}</error-code>" +
						"<location>${phase5fXml(page.location)}</location></error-page>"
				if (!text.contains(carried)) {
					throw new GradleException(
						"${descriptor} omits the legacy error-page "
							+ "${page.code} -> ${page.location}, so sendError "
							+ 'would return the container default page instead '
							+ 'of the legacy dispatch target')
				}
			}
			phase5fReadRoutes().findAll { it.context == spec.context }.each { route ->
				if (!text.contains("<url-pattern>${phase5fXml(route.pattern)}</url-pattern>")) {
					throw new GradleException("${descriptor} omits ${route.name} ${route.pattern}")
				}
				if (spec.context == '/wstore') {
					[
						'/login.jsp', '/login.jsp/*',
						'/loginServlet', '/loginServlet/*',
						'/checkOutServlet', '/checkOutServlet/*',
						'/orderServlet', '/orderServlet/*',
					].each { confidential ->
						if (!text.contains(
								"<url-pattern>${confidential}</url-pattern>")) {
							throw new GradleException(
								"${descriptor} omits CONFIDENTIAL ${confidential}")
						}
					}
				}
			}
		}
	}
}

tasks.register('verifyPhase5fWstoreJspSources') {
	group = 'verification'
	description = 'Validates the closed retained JSP set and Jakarta Pages/Tags compatibility'
	dependsOn tasks.named('preparePhase5fJakartaWebAssets')
	inputs.file phase5fJspContract
	doLast {
		def contract = file('contracts/phase5f-jakarta-web-v1/jsp-precompile-contract.tsv')
			.readLines('UTF-8').drop(1).findAll { it }.collect { it.split('\t', -1)[0] }
		def modernRoot = phase5fBuildDir.get().dir('web/wstore').asFile
		def actual = fileTree(modernRoot) { include '*.jsp' }.files
			.collect { modernRoot.toPath().relativize(it.toPath()).toString() }
		def retainedNames = contract.collect { new File(it).name }.sort()
		if (!actual.containsAll(retainedNames)) {
			throw new GradleException(
				"Generated web tree omits retained JSPs: expected ${retainedNames}, got ${actual.sort()}")
		}
		def problems = []
		retainedNames.each { path ->
			def text = new File(modernRoot, path).getText('UTF-8')
			if (text.contains('javax.servlet') || text.contains('java.sun.com/jstl')) {
				problems << path
			}
		}
		def legacy = file('webStore/src/web/WEB-INF/jspf/page.jspf').getText('UTF-8')
		if (!legacy.contains('http://java.sun.com/jsp/jstl/core')) {
			throw new GradleException('The frozen legacy JSTL asset was unexpectedly migrated')
		}
		if (!problems.empty) {
			throw new GradleException("Retained JSPs contain legacy Servlet/JSTL references: ${problems}")
		}
	}
}

tasks.register('phase5fPrecompileWstoreJsp', JavaExec) {
	group = 'verification'
	description = 'Precompiles all 25 retained wstore JSPs with Tomcat 10.1 Jasper'
	dependsOn(
		tasks.named('verifyPhase5fWstoreJspSources'),
		tasks.named('preparePhase5fJakartaWebAssets'),
		':serverRoot:phase5fWstoreClasses')
	classpath = configurations.phase5fJspCompiler
	mainClass = 'org.apache.jasper.JspC'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
	def output = phase5fBuildDir.map { it.dir('jsp-precompile') }
	outputs.dir output
	doFirst {
		delete output
		output.get().asFile.mkdirs()
		def modernRoot = phase5fBuildDir.get().dir('web/wstore').asFile
		def retained = phase5fJspContract.readLines('UTF-8').drop(1)
			.findAll { it }
			.collect { new File(modernRoot, new File(it.split('\t', -1)[0]).name).absolutePath }
		def compileClasspath = (
			project(':serverRoot').sourceSets.phase5fWstore.output.classesDirs.files +
			project(':serverRoot').configurations.phase5fWstoreRuntimeClasspath.files
		).collect { it.absolutePath }.join(File.pathSeparator)
		args = [
			'-uriroot', modernRoot.absolutePath,
			'-d', output.get().asFile.absolutePath,
			'-compile',
			'-classpath', compileClasspath,
		] + retained
	}
	doLast {
		def compiled = fileTree(output) { include '**/*_jsp.class' }.files.size()
		if (compiled != 25) {
			throw new GradleException(
				"Expected 25 precompiled retained JSP classes, found ${compiled}")
		}
	}
}

tasks.register('phase5fSourceNativeJakartaFoundation') {
	group = 'verification'
	description = 'Compiles, packages, and verifies the Phase 5f source-native Jakarta web foundation'
	dependsOn(
