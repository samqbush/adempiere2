	'css', 'html', 'htm', 'jnlp', 'js', 'jsp', 'jspf', 'properties',
	'tld', 'txt', 'xml', 'xsl', 'xslt',
] as Set
def phase5fWebAssetExcludes = [
	'META-INF/MANIFEST.MF',
	'WEB-INF/web.xml',
	'WEB-INF/c.tld',
	'WEB-INF/fmt.tld',
	'WEB-INF/fn.tld',
	'WEB-INF/sql.tld',
	'WEB-INF/x.tld',
	'WEB-INF/classes/**',
	'WEB-INF/lib/**',
	'WEB-INF/src/**',
	'build/**',
	'dist/**',
	'**/build/**',
	'**/dist/**',
]
def phase5fExcludedWebAsset = { String relativePath ->
	def path = relativePath.replace('\\', '/')
	path == 'META-INF/MANIFEST.MF' ||
		path == 'WEB-INF/web.xml' ||
		path in [
			'WEB-INF/c.tld',
			'WEB-INF/fmt.tld',
			'WEB-INF/fn.tld',
			'WEB-INF/sql.tld',
			'WEB-INF/x.tld',
		] ||
		path.startsWith('WEB-INF/classes/') ||
		path.startsWith('WEB-INF/lib/') ||
		path.startsWith('WEB-INF/src/') ||
		path.startsWith('build/') ||
		path.startsWith('dist/') ||
		path.contains('/build/') ||
		path.contains('/dist/')
}
def phase5fTextAsset = { String relativePath ->
	def name = new File(relativePath).name
	def separator = name.lastIndexOf('.')
	separator >= 0 &&
		phase5fTextAssetExtensions.contains(name.substring(separator + 1).toLowerCase(Locale.ROOT))
}
