// The Tomcat 9 container log is where ContextRoutingFilter and
// CohortRoutingFilter record PHASE5F-PROXY-FAIL. A fail-closed proxy answers
// 502 with no indication of why, so each shard harvests it into its evidence.
def phase5fContainerLog = phase5fInstalledHome.map {
	it.file('tomcat/logs/catalina.out')
}

// Declaration order is not execution order: these six shards are independent
// siblings whose only dependency is the lane, so Gradle may run them in any
// order and has. The explicit mustRunAfter chain below fixes the order, and
// it is ordered by risk: only '/' and '/wstore' are ELIGIBLE for modern
// routing, and '/webui' carries the Phase 5e sticky-session disposition, so
// those three report before the legacy-observation-only contexts.
def phase5fSwitchBaselineFile = layout.buildDirectory.file(
	'phase5f/switch-baseline.tsv')

// AD_SysConfig is shared mutable state that every shard reads. Bracketing the
// shards with a captured baseline and an equality check turns a leaked or
// half-applied switch row into an attributed failure of this gate rather than a
// silent mis-routing of whichever shard happens to run next.
def phase5fSwitchStateTask = { String taskName, String switchAction, String desc ->
	tasks.register(taskName, Exec) {
		group = 'verification'
		description = desc
		dependsOn tasks.named('startPhase5fRoutedLane')
		outputs.upToDateWhen { false }
		environment 'ADEMPIERE_PHASE5F_DB_PASSWORD', phase5fDbPassword.get()
		commandLine(
			'bash',
			rootProject.file('scripts/phase5/reset-phase5f-context-switch.sh'),
			phase5fDbHost.get(),
			phase5fDbPort.get(),
			phase5fDbName.get(),
			phase5fDbUser.get(),
			phase5fDatabaseMarker,
			'/',
			switchAction,
			phase5fSwitchBaselineFile.get().asFile)
	}
}

def phase5fCaptureSwitchBaseline = phase5fSwitchStateTask(
	'capturePhase5fSwitchBaseline', 'baseline',
	'Captures the pre-shard state of all five Phase 5f context switches')
def phase5fVerifySwitchBaseline = phase5fSwitchStateTask(
	'verifyPhase5fSwitchBaseline', 'verify',
	'Verifies every Phase 5f context switch was restored to its captured state')

