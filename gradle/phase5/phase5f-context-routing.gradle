def phase5fOriginalName = { Map spec ->
	spec.legacy.substring(0, spec.legacy.length() - 4) + 'Original.war'
}

def phase5fDigest = { File file ->
	MessageDigest.getInstance('SHA-256')
		.digest(file.bytes).encodeHex().toString()
}

def phase5fEntries = { File archive ->
	def result = new LinkedHashMap<String, byte[]>()
	new ZipFile(archive).withCloseable { zip ->
		zip.entries().each { entry ->
			if (!entry.directory) {
				result[entry.name] = zip.getInputStream(entry).withCloseable {
					it.readAllBytes()
				}
			}
		}
	}
	result
}

def phase5fRemove
phase5fRemove = { File victim ->
	if (!victim.exists()) {
		return
	}
	if (victim.isDirectory()) {
		victim.listFiles().each { phase5fRemove(it) }
	}
	if (!victim.delete()) {
		throw new GradleException("Could not remove ${victim}")
	}
}

def phase5fDescriptorOverlay = { String frozen ->
	def root = frozen.indexOf('<web-app')
	def close = root < 0 ? -1 : frozen.indexOf('>', root)
	if (root < 0 || close < 0) {
		throw new GradleException('The pristine descriptor has no web-app root')
	}
	def insert = '''
	<listener>
		<listener-class>org.adempiere.web.context.ContextRoutingStartupListener</listener-class>
	</listener>
	<filter>
		<filter-name>phase5fContextRouter</filter-name>
		<filter-class>org.adempiere.web.context.ContextRoutingFilter</filter-class>
	</filter>
	<filter-mapping>
		<filter-name>phase5fContextRouter</filter-name>
		<url-pattern>/*</url-pattern>
	</filter-mapping>
'''
	def routed = frozen.substring(0, close + 1) + insert + frozen.substring(close + 1)
	if (routed.contains('<tracking-mode>')) {
		return routed
	}
	if (routed.contains('</session-config>')) {
		return routed.replaceFirst(
			'</session-config>',
			'<tracking-mode>COOKIE</tracking-mode></session-config>')
	}
	routed.replaceFirst(
		'</web-app>',
		'<session-config><tracking-mode>COOKIE</tracking-mode></session-config>\\n</web-app>')
}

def phase5fWriteArchive = { Map<String, byte[]> entries, File target ->
	target.parentFile.mkdirs()
	def temporary = new File(target.parentFile, target.name + '.building')
	new ZipOutputStream(new BufferedOutputStream(
			new FileOutputStream(temporary))).withCloseable { output ->
		output.setLevel(java.util.zip.Deflater.BEST_COMPRESSION)
		entries.keySet().sort().each { name ->
			def entry = new ZipEntry(name)
			entry.time = 0L
			output.putNextEntry(entry)
			output.write(entries[name])
			output.closeEntry()
		}
	}
	if (target.exists() && !target.delete()) {
		throw new GradleException("Could not replace ${target}")
	}
	if (!temporary.renameTo(target)) {
		throw new GradleException("Could not write ${target}")
	}
}

tasks.register('materializePhase5fPristineContextWars') {
	group = 'build'
	description = 'Freezes the five canonical Tomcat 9 context WARs before routing'
	dependsOn tasks.named('stagePhase5eInstalledRouting')
	def output = phase5fRoutingDir.map { it.dir('pristine') }
	outputs.dir output
	outputs.upToDateWhen { false }
	doLast {
		delete output
		phase5fRoutingContexts.each { name, spec ->
			def lib = phase5fInstalledHome.get().dir('lib')
			def original = lib.file(phase5fOriginalName(spec)).asFile
			def active = lib.file(spec.legacy).asFile
			def activeEntries = active.isFile()
				? phase5fEntries(active)
				: [:]
			def activeIsRouted = activeEntries.containsKey(
				'WEB-INF/lib/phase5f-context-routing-bridge.jar')
			def pristine = activeIsRouted && original.isFile()
				? original
				: active
			if (!pristine.isFile()) {
				throw new GradleException("Missing pristine context ${pristine}")
			}
			def entries = phase5fEntries(pristine)
			if (!entries.containsKey('WEB-INF/web.xml')) {
				throw new GradleException("${pristine} has no WEB-INF/web.xml")
			}
			if (entries.containsKey(
					'WEB-INF/lib/phase5f-context-routing-bridge.jar')) {
				throw new GradleException("${pristine} is already routed")
			}
			def frozen = output.get().file(spec.legacy).asFile
			frozen.parentFile.mkdirs()
			frozen.bytes = pristine.bytes
		}
	}
}

tasks.register('derivePhase5fLegacyContextWars') {
	group = 'build'
	description = 'Derives five independently routed Tomcat 9 context archives'
	dependsOn(
		tasks.named('materializePhase5fPristineContextWars'),
		':org.adempiere.cohort:contextBridgeOverlayJar')
	def output = phase5fRoutingDir.map { it.dir('legacy') }
	inputs.dir phase5fRoutingDir.map { it.dir('pristine') }
	inputs.file project(':org.adempiere.cohort').tasks
		.named('contextBridgeOverlayJar').flatMap { it.archiveFile }
	outputs.dir output
	doLast {
		delete output
		def bridge = project(':org.adempiere.cohort').tasks
			.named('contextBridgeOverlayJar').get().archiveFile.get().asFile
		phase5fRoutingContexts.each { name, spec ->
			def pristine = phase5fRoutingDir.get()
				.file("pristine/${spec.legacy}").asFile
			def entries = phase5fEntries(pristine)
			entries['WEB-INF/web.xml'] = phase5fDescriptorOverlay(
				new String(entries['WEB-INF/web.xml'], 'UTF-8')).getBytes('UTF-8')
			entries['WEB-INF/lib/phase5f-context-routing-bridge.jar'] = bridge.bytes
			phase5fWriteArchive(entries,
				output.get().file(spec.deployed).asFile)
		}
	}
}

tasks.register('verifyPhase5fLegacyContextWars') {
	group = 'verification'
	description = 'Proves each deterministic legacy derivation changes only its descriptor and bridge'
	dependsOn tasks.named('derivePhase5fLegacyContextWars')
	def evidence = phase5fRoutingDir.map { it.file('derived-contexts.tsv') }
	inputs.dir phase5fRoutingDir.map { it.dir('pristine') }
	inputs.dir phase5fRoutingDir.map { it.dir('legacy') }
	outputs.file evidence
	doLast {
		def rows = ['context\tpristine_sha256\tderived_sha256\tchanged_entries']
		phase5fRoutingContexts.each { name, spec ->
			def pristineFile = phase5fRoutingDir.get()
				.file("pristine/${spec.legacy}").asFile
			def routedFile = phase5fRoutingDir.get()
				.file("legacy/${spec.deployed}").asFile
			def pristine = phase5fEntries(pristineFile)
			def routed = phase5fEntries(routedFile)
			def changed = (pristine.keySet() + routed.keySet()).findAll { entry ->
				!java.util.Arrays.equals(pristine[entry], routed[entry])
			}.sort()
			def expected = [
				'WEB-INF/lib/phase5f-context-routing-bridge.jar',
				'WEB-INF/web.xml',
			].sort()
			if (changed != expected) {
				throw new GradleException(
					"${spec.context} derived diff is ${changed}, expected ${expected}")
			}
			def descriptor = new String(routed['WEB-INF/web.xml'], 'UTF-8')
			[
				'ContextRoutingStartupListener',
				'ContextRoutingFilter',
				'<filter-name>phase5fContextRouter</filter-name>',
				'<tracking-mode>COOKIE</tracking-mode>',
			].each { required ->
				if (!descriptor.contains(required)) {
					throw new GradleException(
						"${spec.deployed} omits ${required}")
				}
			}
			def determinismCheck = phase5fRoutingDir.get()
				.file("determinism/${spec.deployed}").asFile
			phase5fWriteArchive(new LinkedHashMap<String, byte[]>(routed),
				determinismCheck)
			if (!java.util.Arrays.equals(routedFile.bytes, determinismCheck.bytes)) {
				throw new GradleException(
					"${spec.context} legacy routing derivation is not deterministic")
			}
			rows << "${spec.context}\t${phase5fDigest(pristineFile)}\t" +
				"${phase5fDigest(routedFile)}\t${changed.join(',')}"
		}
		def report = evidence.get().asFile
		report.parentFile.mkdirs()
		report.text = rows.join('\n') + '\n'
	}
}

ext.phase5fModernContextDescriptor = { String name, Map spec ->
	def descriptorName = name == 'ROOT' ? 'ROOT' : name
	def cookiePath = spec.context
	"""<?xml version="1.0" encoding="UTF-8"?>
<Context docBase="\${catalina.base}/phase5f/${spec.modern}"
         disableURLRewriting="true"
         sessionCookieName="JSESSIONID_${descriptorName.toUpperCase(Locale.ROOT)}"
         sessionCookiePath="${cookiePath}"
         sessionCookiePathUsesTrailingSlash="false"
         crossContext="false"
         useHttpOnly="true"
         privileged="false"
         reloadable="false">
${project.phase5fJarScannerElement(name.toString())}
  <Valve className="org.apache.catalina.valves.RemoteIpValve"
         internalProxies="127\\.0\\.0\\.1|::1"
         protocolHeader="x-forwarded-proto"
         protocolHeaderHttpsValue="https"/>
</Context>
"""
}

ext.stagePhase5fContextRouting = { File home ->
	def lib = new File(home, 'lib')
	def modernDir = new File(home, 'tomcat10-api/phase5f')
	def descriptors = new File(home, 'tomcat10-api/conf/Catalina/localhost')
	def publicWebapps = new File(home, 'tomcat/webapps')
	def manifestRows = []
	modernDir.mkdirs()
	descriptors.mkdirs()
	phase5fRoutingContexts.each { name, spec ->
		def pristineSource = phase5fRoutingDir.get()
			.file("pristine/${spec.legacy}").asFile
		def original = new File(lib, phase5fOriginalName(spec))
		def active = new File(lib, spec.legacy)
		original.parentFile.mkdirs()
		original.bytes = pristineSource.bytes
		active.bytes = phase5fRoutingDir.get()
			.file("legacy/${spec.deployed}").asFile.bytes

		if (publicWebapps.isDirectory()) {
			phase5fRemove(new File(publicWebapps,
				spec.deployed.substring(0, spec.deployed.length() - 4)))
			def deployed = new File(publicWebapps, spec.deployed)
			if (deployed.isFile()) {
				deployed.bytes = active.bytes
			}
		}

		def modern = phase5fModernWarDir.get().file(spec.modern).asFile
		if (!modern.isFile()) {
			throw new GradleException("Missing modern context ${modern}")
		}
		def stagedModern = new File(modernDir, spec.modern)
		stagedModern.bytes = modern.bytes
		phase5fRemove(new File(home, "tomcat10-api/webapps/${spec.modern}"))
		phase5fRemove(new File(home, "tomcat10-api/webapps/" +
			spec.modern.substring(0, spec.modern.length() - 4)))
		phase5fRemove(new File(home, "tomcat10-api/webapps/${spec.deployed}"))
		phase5fRemove(new File(home, "tomcat10-api/webapps/" +
			spec.deployed.substring(0, spec.deployed.length() - 4)))

		def descriptorName = name == 'ROOT' ? 'ROOT.xml' : "${name}.xml"
		def descriptor = new File(descriptors, descriptorName)
		descriptor.text = project.phase5fModernContextDescriptor(
			name.toString(), spec)
		manifestRows << "${phase5fDigest(active)}  lib/${spec.legacy}"
		manifestRows << "${phase5fDigest(original)}  lib/${original.name}"
		manifestRows << "${phase5fDigest(stagedModern)}  tomcat10-api/phase5f/${spec.modern}"
		manifestRows << "${phase5fDigest(descriptor)}  tomcat10-api/conf/Catalina/localhost/${descriptorName}"
	}
	def config = new File(home, 'config')
	config.mkdirs()
	new File(config, 'phase5f-context-routing.sha256').text =
		manifestRows.sort().join('\n') + '\n'
}

