tasks.register('phase5fTopologyMutationProof') {
	group = 'verification'
	description = 'Proves topology verification rejects duplicate deployment and public connector mutations'
	dependsOn tasks.named('verifyPhase5fInstalledReleaseTopology')
	def evidence = phase5fRoutingDir.map { it.file('topology-mutations.tsv') }
	outputs.file evidence
	doLast {
		def source = phase5fInstalledHome.get().asFile
		def mutated = phase5fRoutingDir.get().dir('mutation-home').asFile
		delete mutated
		copy {
			from source
			into mutated
		}
		def duplicate = new File(mutated,
			'tomcat10-api/webapps/wstore-modern.war')
		duplicate.parentFile.mkdirs()
		duplicate.bytes = new File(mutated,
			'tomcat10-api/phase5f/wstore-modern.war').bytes
		def result = exec {
			ignoreExitValue = true
			commandLine(
				'bash',
				rootProject.file('scripts/phase5/verify-phase5f-installed-topology.sh'),
				mutated,
				phase5fReleaseHome.asFile,
				rootProject.file('build/phase3/release/Adempiere_394LTS.zip'),
				rootProject.file('build/phase3/release/Adempiere_394LTS.tar.gz'),
				phase5fRoutingDir.get().asFile,
				phase5fModernWarDir.get().asFile)
		}
		if (result.exitValue == 0) {
			throw new GradleException(
				'The topology verifier accepted a duplicate auto-deployed modern WAR')
		}
		duplicate.delete()
		def serverXml = new File(mutated, 'tomcat10-api/conf/server.xml')
		serverXml.text = serverXml.text.replace(
			'<Connector address="127.0.0.1"',
			'<Connector address="0.0.0.0"')
		result = exec {
			ignoreExitValue = true
			commandLine(
				'bash',
				rootProject.file('scripts/phase5/verify-phase5f-installed-topology.sh'),
				mutated,
				phase5fReleaseHome.asFile,
				rootProject.file('build/phase3/release/Adempiere_394LTS.zip'),
				rootProject.file('build/phase3/release/Adempiere_394LTS.tar.gz'),
				phase5fRoutingDir.get().asFile,
				phase5fModernWarDir.get().asFile)
		}
		if (result.exitValue == 0) {
			throw new GradleException(
				'The topology verifier accepted a public Tomcat 10 connector')
		}
		def report = evidence.get().asFile
		report.parentFile.mkdirs()
		report.text =
			"mutation\tdetected\n" +
			"duplicate-auto-deploy\ttrue\n" +
			"public-modern-connector\ttrue\n"
	}
}

