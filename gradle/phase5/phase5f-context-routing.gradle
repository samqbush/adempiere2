	admin: '/admin',
	mobile: '/mobile',
	adempiere: '/adempiere',
].each { name, contextPath ->
	def shard = tasks.register("phase5f${name.toString().capitalize()}RoutesSmokeShard", Exec) {
		group = 'verification'
		description = "Replays the ${contextPath} Phase 5f route shard through the public origin"
		dependsOn tasks.named('startPhase5fRoutedLane'),
			phase5fCaptureSwitchBaseline
		inputs.files(
			phase5fRuntimeContractDir.file('route-validation.tsv'),
			phase5fRuntimeContractDir.file('database-effect-ownership.tsv'),
			rootProject.file('scripts/phase5/phase5f-route-smoke.py'),
			rootProject.file('scripts/phase5/reset-phase5f-context-switch.sh'))
		outputs.dir phase5fSmokeEvidence.map { it.dir(name.toString()) }
		outputs.upToDateWhen { false }
		environment 'ADEMPIERE_PHASE5F_DB_PASSWORD', phase5fDbPassword.get()
		doFirst {
			if (!phase5fDbSystemPassword.isPresent()) {
				throw new GradleException(
					"${path} requires -Pphase3DbSystemPassword or "
						+ 'ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD; no runtime '
						+ 'observation was recorded')
			}
			// Deleted by name, not by wiping the directory: the shard now
			// republishes these ledgers after every vector so that an abort
			// still uploads what it observed, and a wholesale delete would
			// discard a previous attempt's evidence before this one has
			// produced any of its own.
			delete phase5fSmokeEvidence.get().dir(name.toString())
				.file('route-observations.tsv').asFile,
				phase5fSmokeEvidence.get().dir(name.toString())
					.file('route-observations.tsv.partial').asFile,
				phase5fSmokeEvidence.get().dir(name.toString())
					.file('route-failures.tsv').asFile,
				phase5fSmokeEvidence.get().dir(name.toString())
					.file('route-failures.tsv.partial').asFile,
				phase5fSmokeEvidence.get().dir(name.toString())
					.file('proxy-failures.log').asFile,
				phase5fSmokeEvidence.get().dir(name.toString())
					.file('modern-unexecuted.tsv').asFile,
				phase5fSmokeEvidence.get().dir(name.toString())
					.file('provenance.json').asFile
			phase5fSmokeEvidence.get().dir(name.toString()).asFile.mkdirs()
		}
		commandLine(
			'python3',
			rootProject.file('scripts/phase5/phase5f-route-smoke.py'),
			'--context', contextPath,
			'--public-origin', phase5fPublicOrigin.get(),
			'--public-https-origin', phase5fPublicHttpsOrigin.get(),
			'--contract', phase5fRuntimeContractDir.file('route-validation.tsv').asFile,
			'--effects',
				phase5fRuntimeContractDir.file('database-effect-ownership.tsv').asFile,
			'--evidence-dir',
				phase5fSmokeEvidence.get().dir(name.toString()).asFile,
			'--switch-script',
				rootProject.file('scripts/phase5/reset-phase5f-context-switch.sh'),
			'--db-host', phase5fDbHost.get(),
			'--db-port', phase5fDbPort.get(),
			'--db-name', phase5fDbName.get(),
			'--db-user', phase5fDbUser.get(),
			'--db-marker', phase5fDatabaseMarker,
			'--container-log', phase5fContainerLog.get().asFile)
	}
	if (phase5fPreviousShard != null) {
		def previous = phase5fPreviousShard
		shard.configure { mustRunAfter previous }
	}
	phase5fPreviousShard = shard
	phase5fShardTasks << shard
}

phase5fVerifySwitchBaseline.configure { mustRunAfter phase5fShardTasks }

tasks.register('capturePhase5fSoapCoexistence', Exec) {
	group = 'verification'
	description = 'Replays the complete Phase 4 SOAP corpus while Phase 5f contexts are active'
	dependsOn tasks.named('startPhase5fRoutedLane'), phase5fVerifySwitchBaseline
	mustRunAfter phase5fShardTasks, phase5fVerifySwitchBaseline
	environment 'ADEMPIERE_PHASE5F_DB_PASSWORD', phase5fDbPassword.get()
	commandLine(
		'bash',
		rootProject.file('scripts/phase5/capture-phase5f-coexistence.sh'),
		rootProject.projectDir,
		phase5fSmokeEvidence.get().asFile,
		phase5fDbHost.get(),
		phase5fDbPort.get(),
		phase5fDbName.get(),
		phase5fDbUser.get(),
		phase5fDatabaseMarker)
}

tasks.register('verifyPhase5fRuntimeEvidence', Exec) {
	group = 'verification'
	description = 'Validates provenance, exact 82-route coverage, effects and coexistence evidence'
	dependsOn(
		phase5fShardTasks,
		phase5fVerifySwitchBaseline,
		tasks.named('capturePhase5fSoapCoexistence'))
	mustRunAfter phase5fShardTasks, phase5fVerifySwitchBaseline,
		tasks.named('capturePhase5fSoapCoexistence')
	outputs.file phase5fSmokeEvidence.map { it.file('summary.tsv') }
	commandLine(
		'python3',
		rootProject.file('scripts/phase5/validate-phase5f-runtime-evidence.py'),
		phase5fRuntimeContractDir.file('database-effect-ownership.tsv'),
		'--evidence-root', phase5fSmokeEvidence.get().asFile,
		'--contract', phase5fRuntimeContractDir.file('route-validation.tsv').asFile,
		'--effects',
			phase5fRuntimeContractDir.file('database-effect-ownership.tsv').asFile,
		'--summary', phase5fSmokeEvidence.get().file('summary.tsv').asFile)
}

tasks.register('phase5fRuntimeEvidenceValidatorMutationProof', Exec) {
	group = 'verification'
	description = 'Proves runtime evidence validation rejects omissions, fabrication and drift'
	inputs.files(
		phase5fRuntimeContractDir.file('route-validation.tsv'),
		phase5fRuntimeContractDir.file('database-effect-ownership.tsv'),
		rootProject.file('scripts/phase5/validate-phase5f-runtime-evidence.py'),
		rootProject.file('scripts/phase5/verify-phase5f-runtime-evidence-validator.py'))
	outputs.file layout.buildDirectory.file(
		'phase5f/evidence-validator/mutation-report.tsv')
	commandLine(
		'python3',
		rootProject.file(
			'scripts/phase5/verify-phase5f-runtime-evidence-validator.py'),
		'--repo-root', rootProject.projectDir,
		'--work-dir', layout.buildDirectory.dir(
			'phase5f/evidence-validator/work').get().asFile,
		'--report', layout.buildDirectory.file(
			'phase5f/evidence-validator/mutation-report.tsv').get().asFile)
}

tasks.register('phase5fJakartaWebRoutesSmoke') {
	group = 'verification'
	description = 'Canonical database-backed Phase 5f six-context public-origin route replay'
	dependsOn tasks.named('verifyPhase5fRuntimeEvidence')
	doFirst {
		if (!phase5fDbSystemPassword.isPresent()) {
			throw new GradleException(
				'phase5fJakartaWebRoutesSmoke requires '
					+ '-Pphase3DbSystemPassword or '
					+ 'ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD; the '
					+ 'database-backed route replay was not executed')
		}
	}
}

def phase5fTrackedInputs = [
	rootProject.file('lib/mysql-connector-java-5.1.13-bin.jar'),
	rootProject.file('lib/ADInterface-1.0.war'),
]
def phase5fTrackedInputBefore = layout.buildDirectory.file(
	'phase5f/immutability/tracked-inputs-before.tsv')
def phase5fTrackedInputAfter = layout.buildDirectory.file(
	'phase5f/immutability/tracked-inputs-after.tsv')

tasks.register('capturePhase5fTrackedInputHashes') {
	group = 'verification'
	description = 'Captures candidate tracked binary hashes before canonical Phase 5f verification'
	inputs.files phase5fTrackedInputs
	outputs.file phase5fTrackedInputBefore
	outputs.upToDateWhen { false }
	doLast {
		def output = phase5fTrackedInputBefore.get().asFile
		output.parentFile.mkdirs()
		output.text = 'path\tsha256\n' + phase5fTrackedInputs.collect { input ->
			if (!input.isFile()) {
				throw new GradleException("Missing tracked Phase 5f input ${input}")
			}
			"${rootProject.relativePath(input)}\t${phase5fDigest(input)}"
		}.join('\n') + '\n'
	}
}

tasks.register('verifyPhase5fTrackedInputImmutability') {
	group = 'verification'
	description = 'Fails if canonical Phase 5f verification rewrites tracked legacy binaries'
	dependsOn tasks.named('capturePhase5fTrackedInputHashes')
	mustRunAfter 'phase5fFinalVerificationBody'
	outputs.file phase5fTrackedInputAfter
	outputs.upToDateWhen { false }
	doLast {
		def beforeFile = phase5fTrackedInputBefore.get().asFile
		if (!beforeFile.isFile()) {
			throw new GradleException('Phase 5f tracked-input preflight evidence is missing')
		}
		def before = beforeFile.readLines('UTF-8').drop(1).findAll { it }
			.collectEntries { line ->
				def fields = line.split('\t', -1)
				[(fields[0]): fields[1]]
			}
		def after = [:]
		phase5fTrackedInputs.each { input ->
			after[rootProject.relativePath(input)] = phase5fDigest(input)
		}
		def changed = before.findAll { path, digest -> after[path] != digest }
		def output = phase5fTrackedInputAfter.get().asFile
		output.parentFile.mkdirs()
		output.text = 'path\tbefore_sha256\tafter_sha256\timmutable\n' +
			before.collect { path, digest ->
				"${path}\t${digest}\t${after[path]}\t${after[path] == digest}"
			}.join('\n') + '\n'
		if (!changed.isEmpty()) {
			throw new GradleException(
				"Canonical Phase 5f verification mutated tracked inputs: ${changed.keySet()}")
		}
	}
}

tasks.register('phase5fTrackedInputImmutabilitySmoke') {
	group = 'verification'
	description = 'Runs the isolated legacy build and proves tracked Phase 5f inputs are unchanged'
	dependsOn(
		tasks.named('capturePhase5fTrackedInputHashes'),
		tasks.named('phase3AntNoDatabaseBuild'),
		tasks.named('verifyPhase5fTrackedInputImmutability'))
}

tasks.register('phase5fFinalVerificationBody') {
	group = 'verification'
	description = 'Runs the complete database-neutral Phase 5f verification body'
	dependsOn tasks.named('capturePhase5fTrackedInputHashes')
	dependsOn(
		tasks.named('phase5fOracleContractValidation'),
		tasks.named('phase5fRuntimeEvidenceValidatorMutationProof'),
		':org.adempiere.cohort:test',
		':org.adempiere.cohort:contextBridgeTest',
		':org.adempiere.cohort:verifyRoutingCoreIsolation',
		tasks.named('phase5fSourceNativeJakartaFoundation'),
		':zkwebui:verifyPhase5fWebuiInheritedRoutes',
		tasks.named('verifyPhase5fLegacyContextWars'),
		tasks.named('phase5fInstalledTopologyVerification'),
		tasks.named('verifyPhase5Inventories'),
		tasks.named('phase5eFinalVerification'),
		tasks.named('phase5dFinalVerification'),
		tasks.named('phase4FinalVerification'))
	finalizedBy tasks.named('verifyPhase5fTrackedInputImmutability')
}

tasks.register('phase5fFinalVerification') {
	group = 'verification'
	description = 'Runs canonical Phase 5f verification with tracked-input immutability enforcement'
	dependsOn tasks.named('phase5fFinalVerificationBody')
}

gradle.projectsEvaluated {
	tasks.named('phase3AntNoDatabaseBuild') {
		mustRunAfter tasks.named('capturePhase5fTrackedInputHashes')
	}
	tasks.named('verifyPhase5fTrackedInputImmutability') {
		mustRunAfter tasks.named('phase3AntNoDatabaseBuild')
	}
	def installedTopology =
		tasks.named('verifyPhase5fInstalledReleaseTopology')
	project(':org.adempiere.cohort').tasks.named(
		'phase5fRollbackCoreTest').configure {
			mustRunAfter installedTopology
		}
	project(':org.adempiere.cohort').tasks.named(
		'phase5fRollbackBridgeTest').configure {
			mustRunAfter installedTopology
		}
	def stopLane = tasks.named('stopPhase5fRoutedLane')
	def startLane = tasks.named('startPhase5fRoutedLane')
	startLane.configure { finalizedBy stopLane }
	stopLane.configure {
		mustRunAfter(
			phase5fShardTasks,
			tasks.named('capturePhase5fSoapCoexistence'),
			tasks.named('verifyPhase5fRuntimeEvidence'),
			tasks.named('phase5fJakartaWebRoutesSmoke'))
	}
	tasks.named('cleanupPhase3Database') {
		mustRunAfter(
			phase5fShardTasks,
			startLane,
			stopLane,
			tasks.named('capturePhase5fSoapCoexistence'),
			tasks.named('verifyPhase5fRuntimeEvidence'),
			tasks.named('phase5fJakartaWebRoutesSmoke'))
	}
}
