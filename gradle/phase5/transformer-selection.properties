# Process every resource using UTF-8 unless a reviewed exclusion says otherwise.
*=UTF-8

# jruby.jar contains a Rake test fixture named sample.mf that is not a valid
# Java manifest. Eclipse Transformer otherwise selects it as a Feature resource
# and aborts the complete WAR transform. It contains no javax package reference.
META-INF/jruby.home/lib/ruby/gems/1.8/gems/rake-0.8.3/test/data/sample.mf=!
