tasks.register('freezePhase4XFireContracts') {
	group = 'verification'
	description = 'Explicitly freezes the approved live XFire oracle in source control'
	doLast {
		if (providers.gradleProperty('approvePhase4Oracle').orNull != 'true') {
			throw new GradleException(
				'Refusing to freeze the oracle without -PapprovePhase4Oracle=true')
		}
		def oracle = phase4EvidenceDir.get().dir('oracle').asFile
		def required = [
			'wsdl/ADService.wsdl',
			'wsdl/ModelADService.wsdl',
			'wsdl/ExternalSales.wsdl',
			'wsdl/WebService.wsdl',
			'request-ADService.xml',
			'request-ModelADService.xml',
			'request-ExternalSales.xml',
			'request-WebService.xml',
			'responses/ADService.xml',
			'responses/ModelADService.xml',
			'responses/ExternalSales.xml',
			'responses/WebService.xml',
			'responses/ADService.headers',
			'responses/ModelADService.headers',
			'responses/ExternalSales.headers',
			'responses/WebService.headers',
			'round-trips.tsv',
			'operations.tsv',
			'operation-round-trips.tsv',
			'operation-known-residuals.tsv',
			'operation-contract-mismatches.tsv'
		]
		def operationEvidenceRoot = new File(oracle, 'operations')
		def operationEvidence = project.fileTree(operationEvidenceRoot)
			.matching {
				include '**/request.xml'
				include '**/response.xml'
				include '**/headers'
				include '**/case.tsv'
			}
			.files.collect {
				'operations/' + operationEvidenceRoot.toPath()
					.relativize(it.toPath()).toString()
					.replace(File.separatorChar, '/' as char)
			}
			.sort()
		if (operationEvidence.size() != 132) {
			throw new GradleException(
				"Expected four evidence files for each of 33 operations, got "
					+ operationEvidence.size())
		}
		required.addAll(operationEvidence)
		def missing = required.findAll { !new File(oracle, it).isFile() }
		if (!missing.isEmpty()) {
			throw new GradleException("Cannot freeze incomplete oracle: ${missing}")
		}
		required.each { relativePath ->
			def source = new File(oracle, relativePath)
			def target = new File(phase4FrozenContracts, relativePath)
			target.parentFile.mkdirs()
			target.bytes = normalizePhase4Contract(relativePath, source.bytes)
		}
		def frozenPaths = project.fileTree(phase4FrozenContracts)
			.matching {
				exclude 'manifest.sha256', 'normalization-policy.md'
			}
			.files.collect {
				phase4FrozenContracts.toPath().relativize(it.toPath()).toString()
			}
			.sort()
		def digest = MessageDigest.getInstance('SHA-256')
		new File(phase4FrozenContracts, 'manifest.sha256').withWriter('UTF-8') { writer ->
			frozenPaths.each { relativePath ->
				digest.reset()
				def hash = digest.digest(
					new File(phase4FrozenContracts, relativePath).bytes)
					.collect { String.format('%02x', it) }.join()
				writer.println("${hash}  ${relativePath}")
			}
		}
	}
}

tasks.register('verifyPhase4FrozenContracts') {
	group = 'verification'
	description = 'Fails on missing, added, or changed frozen XFire contract evidence'
	inputs.dir phase4FrozenContracts
	doLast {
		def manifest = new File(phase4FrozenContracts, 'manifest.sha256')
		if (!manifest.isFile()) {
			throw new GradleException('Frozen Phase 4 contract manifest is missing')
		}

		def expected = manifest.readLines().collectEntries { line ->
			def match = line =~ /^([0-9a-f]{64})  (.+)$/
			if (!match.matches()) {
				throw new GradleException("Malformed contract manifest line: ${line}")
			}
			[(match[0][2]): match[0][1]]
		}
		def actualFiles = project.fileTree(phase4FrozenContracts)
			.matching { exclude 'manifest.sha256', 'normalization-policy.md' }
			.files.collect {
				phase4FrozenContracts.toPath().relativize(it.toPath()).toString()
			}.toSet()
		if (actualFiles != expected.keySet()) {
			throw new GradleException(
				"Frozen contract file set drifted; expected ${expected.keySet()}, got ${actualFiles}")
		}
		def digest = MessageDigest.getInstance('SHA-256')
		expected.each { relativePath, expectedHash ->
			digest.reset()
			def actualHash = digest.digest(new File(phase4FrozenContracts, relativePath).bytes)
				.collect { String.format('%02x', it) }.join()
			if (actualHash != expectedHash) {
				throw new GradleException(
					"Frozen contract changed without approval: ${relativePath}")
			}
		}
	}
}

tasks.register('verifyPhase4OperationScenarios') {
	group = 'verification'
	description = 'Fails unless every SOAP operation has one owned scenario decision'
	def operationsFile = file(
		'org.adempiere.webservice/contracts/xfire-v1/operations.tsv')
	def scenariosFile = file('gradle/phase4/operation-scenarios.tsv')
	inputs.files operationsFile, scenariosFile
	doLast {
		def operationKeys = operationsFile.readLines()
			.findAll { it && !it.startsWith('#') }
			.collect { line ->
				def fields = line.split('\t', -1)
				"${fields[0]}.${fields[1]}"
			} as Set
		def rows = scenariosFile.readLines()
			.findAll { it && !it.startsWith('#') }
		def scenarioKeys = [] as Set
		def allowedScenarios = [
			'none',
			'fault-only-legacy-login-defect',
			'valid-credential-security-fault',
			'binding-residual',
			'valid-credential-config-fault',
			'authenticated-success'
		] as Set
		def allowedStatuses = [
			'captured',
			'pending',
			'residual-captured'
		] as Set
		rows.eachWithIndex { line, index ->
			def fields = line.split('\t', -1)
			if (fields.length != 8) {
				throw new GradleException(
					"Scenario row ${index + 2} must have 8 fields")
			}
			def key = "${fields[0]}.${fields[1]}"
			if (!scenarioKeys.add(key)) {
				throw new GradleException("Duplicate scenario row ${key}")
			}
			if (!allowedScenarios.contains(fields[3])) {
				throw new GradleException(
					"Unknown additional scenario ${fields[3]} for ${key}")
			}
			if (!allowedStatuses.contains(fields[4])) {
				throw new GradleException(
					"Unknown scenario status ${fields[4]} for ${key}")
			}
			if (fields[2].isEmpty() || fields[5].isEmpty()
					|| fields[6].isEmpty() || fields[7].isEmpty()) {
				throw new GradleException(
					"Scenario ownership is incomplete for ${key}")
			}
			if (fields[4] == 'captured'
					&& fields[3] in [
						'valid-credential-security-fault',
						'valid-credential-config-fault',
						'authenticated-success'
					]) {
				def scenarioDirectory = new File(
					phase4FrozenContracts,
					"operations/${fields[0]}/${fields[1]}/${fields[3]}")
				def missing = [
					'request.xml',
					'response.xml',
					'headers',
					'case.tsv'
				].findAll { !new File(scenarioDirectory, it).isFile() }
				if (!missing.isEmpty()) {
					throw new GradleException(
						"Captured scenario evidence is incomplete for ${key}: ${missing}")
				}
			}
		}
		if (scenarioKeys != operationKeys) {
			throw new GradleException(
				"Scenario keys differ from operation inventory: "
					+ "missing=${operationKeys - scenarioKeys}, "
					+ "added=${scenarioKeys - operationKeys}")
		}
	}
}

tasks.register('verifyPhase4OracleMatchesFrozen') {
	group = 'verification'
	description = 'Compares fresh live XFire evidence with the approved frozen oracle'
	dependsOn tasks.named('phase4OraclePreflight')
	dependsOn tasks.named('verifyPhase4FrozenContracts')
	doLast {
		def manifest = new File(phase4FrozenContracts, 'manifest.sha256')
		def expectedPaths = manifest.readLines().collect {
			(it =~ /^[0-9a-f]{64}  (.+)$/)[0][1]
		}.findAll {
			!it.contains('/valid-credential-')
				&& !it.contains('/authenticated-success/')
		}
		def oracle = phase4EvidenceDir.get().dir('oracle').asFile
		def drift = expectedPaths.findAll { relativePath ->
			def live = new File(oracle, relativePath)
			def frozen = new File(phase4FrozenContracts, relativePath)
			!live.isFile() ||
				!Arrays.equals(
					normalizePhase4Contract(relativePath, live.bytes), frozen.bytes)
		}
		if (!drift.isEmpty()) {
			throw new GradleException("Live XFire contract drifted: ${drift}")
		}
	}
}

tasks.register('phase4ContractMutationProof') {
	group = 'verification'
	description = 'Proves WSDL, operation, response, and fault mutations are detected'
	dependsOn tasks.named('verifyPhase4FrozenContracts')
	doLast {
		def manifest = new File(phase4FrozenContracts, 'manifest.sha256')
			.readLines().collectEntries { line ->
				def match = line =~ /^([0-9a-f]{64})  (.+)$/
				[(match[0][2]): match[0][1]]
			}
		def mutations = [
			[
				path: 'wsdl/ADService.wsdl',
				before: 'name="ADService"',
				after: 'name="MutatedADService"'
			],
			[
				path: 'operations.tsv',
				before: 'ADService\tgetVersion\t',
				after: 'ADService\tgetVersionMutated\t'
			],
			[
				path: 'operations/ADService/getVersion/baseline/response.xml',
				before: '>0.7.0</out>',
				after: '>mutated</out>'
			],
			[
				path: 'operations/ExternalSales/getProductsCatalog/baseline/response.xml',
				before: '<faultstring>Invalid user/password</faultstring>',
				after: '<faultstring>Mutated fault</faultstring>'
			]
		]
		def digest = MessageDigest.getInstance('SHA-256')
		def evidenceLines = []
		mutations.each { mutation ->
			def source = new File(phase4FrozenContracts, mutation.path)
			def mutated = source.text.replace(mutation.before, mutation.after)
			if (mutated == source.text) {
				throw new GradleException(
					"Mutation fixture did not alter ${mutation.path}")
			}
			digest.reset()
			def mutatedHash = digest.digest(mutated.getBytes('UTF-8'))
				.collect { String.format('%02x', it) }.join()
			if (mutatedHash == manifest[mutation.path]) {
				throw new GradleException(
					"Contract mutation was not detected for ${mutation.path}")
			}
			evidenceLines.add(
				"PASS: mutation changed frozen SHA-256 for ${mutation.path}.")
		}
		def evidence = phase4EvidenceDir.get().file('contracts/mutation-proof.txt').asFile
		evidence.parentFile.mkdirs()
		evidence.text = evidenceLines.join('\n') + '\n'
	}
}

