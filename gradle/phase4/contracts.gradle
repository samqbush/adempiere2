def readPhase4DescriptorPaths = {
	def activeDescriptorList =
		phase5DescriptorList.isFile() ? phase5DescriptorList : phase4DescriptorList
	activeDescriptorList.readLines()
		.collect { it.trim() }
		.findAll { it && !it.startsWith('#') }
}
def parsePhase4Xml = { File input ->
	def withoutDoctype = input.getText('UTF-8')
		.replaceFirst(/(?s)<!DOCTYPE.*?>/, '')
	new XmlSlurper(false, false).parseText(withoutDoctype)
}
def phase4LocalName = { node ->
	node.name().toString().tokenize(':').last()
}
def normalizePhase4Contract = { String relativePath, byte[] content ->
	if (!relativePath.endsWith('.headers') &&
		!relativePath.endsWith('/headers')) {
		return content
	}
	def normalized = new String(content, 'UTF-8')
		.replaceAll(/(?m)^Set-Cookie: JSESSIONID=[^;]+;/,
			'Set-Cookie: JSESSIONID=<SESSION>;')
		.replaceAll(/(?m)^Date: .+$/, 'Date: <DATE>')
	normalized.getBytes('UTF-8')
}
def classifyPhase4Route = { String descriptor, String name, String pattern ->
	if (descriptor == 'org.adempiere.webservice/WEB-INF/web.xml') {
		return ['service-to-service', 'phase4-soap']
	}
	if (descriptor.contains('/http-invoker.sar/')) {
		return ['service-to-service', 'phase5-non-soap']
	}
	if (descriptor.startsWith('serverRoot/')) {
		return pattern == '*.jnlp' ?
			['anonymous/public', 'phase5-non-soap'] :
			['infrastructure', 'phase5-non-soap']
	}
	if (descriptor.startsWith('webCM/')) {
		return ['anonymous/public', 'phase5-non-soap']
	}
	if (descriptor.startsWith('JasperReportsWebApp/')) {
		return ['service-to-service', 'phase5-non-soap']
	}
	if (name.toLowerCase().contains('login') ||
		name.toLowerCase().contains('registration') ||
		name.toLowerCase().contains('help') ||
		pattern == '/index.jsp/*' ||
		pattern == '/productServlet/*' ||
		pattern == '/searchServlet') {
		return ['anonymous/public', 'phase5-non-soap']
	}
	return ['end-user-authenticated', 'phase5-non-soap']
}
def classifyPhase4Operation = { String operation ->
	def lower = operation.toLowerCase()
	if (lower == 'login' || lower == 'ignoredatarow' ||
		lower == 'refreshdatarow') {
		return 'session-state'
	}
	if (lower.startsWith('set') || lower.startsWith('create') ||
		lower.startsWith('update') || lower.startsWith('delete') ||
		lower.startsWith('save') || lower.startsWith('add') ||
		lower.startsWith('upload') || lower.startsWith('run')) {
		return 'mutating'
	}
	return 'read-only'
}
def readPhase4Operations = {
	def operationsFile = new File(phase4FrozenContracts, 'operations.tsv')
	operationsFile.readLines()
		.findAll { it && !it.startsWith('#') }
		.collect { line ->
			def fields = line.split('\t', -1)
			if (fields.length != 18) {
				throw new GradleException("Malformed Phase 4 operation row: ${line}")
			}
			[
				service: fields[0],
				operation: fields[1],
				namespace: fields[2],
				requestParts: fields[4],
				scope: fields[13],
				mutability: fields[14],
				authentication: fields[15]
			]
		}
}
def phase4XmlValue = { String type ->
	switch (type) {
		case 'xsd:boolean':
			return 'false'
		case 'xsd:int':
		case 'xsd:long':
		case 'xsd:short':
		case 'xsd:decimal':
			return '0'
		case 'xsd:string':
			return 'phase4-invalid'
		case 'tns:ArrayOf_tns1_Order':
			// XFire does not bind an empty element as the required RPC array part.
			return '\n      <svc:orders/>\n    '
		default:
			return ''
	}
}

tasks.register('generatePhase4EdgeInventory') {
	group = 'verification'
	description = 'Inventories all servlet descriptors and static CXF services'
	inputs.files(
		phase4DescriptorList,
		new File(phase4FrozenContracts, 'operations.tsv'),
		readPhase4DescriptorPaths().collect { rootProject.file(it) })
	outputs.files(
		phase4EvidenceDir.map { it.file('edge/routes.tsv') },
		phase4EvidenceDir.map { it.file('edge/services.tsv') })
	doLast {
		def descriptorPaths = readPhase4DescriptorPaths()
		if (descriptorPaths.isEmpty() ||
			descriptorPaths.size() != descriptorPaths.toSet().size()) {
			throw new GradleException(
				"Web descriptor inventory must be non-empty and unique, got ${descriptorPaths}")
		}
		def missing = descriptorPaths.findAll { !rootProject.file(it).isFile() }
		if (!missing.isEmpty()) {
			throw new GradleException("Missing Phase 4 descriptors: ${missing}")
		}

		def routesOutput = phase4EvidenceDir.get().file('edge/routes.tsv').asFile
		routesOutput.parentFile.mkdirs()
		def routeCount = 0
		routesOutput.withWriter('UTF-8') { writer ->
			writer.println(
				'# descriptor\tkind\tname\timplementation\turl_pattern\tconfigured_security\ttraffic_class\tbehavioral_gate\towner')
			descriptorPaths.each { relativePath ->
				def descriptor = parsePhase4Xml(rootProject.file(relativePath))
				def servletClasses = descriptor.servlet.collectEntries {
					[(it.'servlet-name'.text()): it.'servlet-class'.text().trim()]
				}
				def filterClasses = descriptor.filter.collectEntries {
					[(it.'filter-name'.text()): it.'filter-class'.text().trim()]
				}
				def securedPatterns = descriptor.'security-constraint'.collectMany { constraint ->
					constraint.'web-resource-collection'.collectMany {
						it.'url-pattern'*.text()
					}
				}.toSet()
				descriptor.'servlet-mapping'.each { mapping ->
					mapping.'url-pattern'.each { pattern ->
						def name = mapping.'servlet-name'.text()
						def routeClass = classifyPhase4Route(
							relativePath, name, pattern.text())
						writer.println([
							relativePath,
							'servlet',
							name,
							servletClasses[name] ?: '',
							pattern.text(),
							securedPatterns.contains(pattern.text()),
							routeClass[0],
							routeClass[1],
							routeClass[1] == 'phase4-soap' ? 'phase4' : 'phase5'
						].join('\t'))
						routeCount++
					}
				}
				descriptor.'filter-mapping'.each { mapping ->
					mapping.'url-pattern'.each { pattern ->
						def name = mapping.'filter-name'.text()
						def routeClass = classifyPhase4Route(
							relativePath, name, pattern.text())
						writer.println([
							relativePath,
							'filter',
							name,
							filterClasses[name] ?: '',
							pattern.text(),
							securedPatterns.contains(pattern.text()),
							routeClass[0],
							routeClass[1],
							routeClass[1] == 'phase4-soap' ? 'phase4' : 'phase5'
						].join('\t'))
						routeCount++
					}
				}
			}
		}
		if (routeCount == 0) {
			throw new GradleException('Phase 4 route inventory is empty')
		}

		def services = readPhase4Operations().groupBy { it.service }
		if (services.size() != 4) {
			throw new GradleException(
				"Phase 4 requires exactly four CXF services, got ${services.keySet()}")
		}
		def servicesOutput = phase4EvidenceDir.get().file('edge/services.tsv').asFile
		servicesOutput.withWriter('UTF-8') { writer ->
			writer.println(
				'# service\tnamespace\tprovider\tscope\tstyle')
			services.sort().each { serviceName, operations ->
				def namespaces = operations*.namespace.toSet()
				def scopes = operations*.scope.toSet()
				if (namespaces.size() != 1 || scopes.size() != 1) {
					throw new GradleException(
						"Inconsistent CXF service metadata for ${serviceName}")
				}
				writer.println([
					serviceName,
					namespaces.first(),
					"org.adempiere.webservice.cxf.${serviceName}Provider",
					scopes.first(),
					'message'
				].join('\t'))
			}
		}
		logger.lifecycle(
			"Phase 4 edge inventory: ${descriptorPaths.size()} descriptors, " +
			"${routeCount} mapped servlet/filter routes, ${services.size()} CXF services")
	}
}

tasks.register('verifyPhase4RouteClasses') {
	group = 'verification'
	description = 'Preserves Phase 4 SOAP assertions while Phase 5 owns reviewed route contracts'
	dependsOn tasks.named('generatePhase4EdgeInventory')
	inputs.files phase4RouteClasses, phase5RouteContracts
	doLast {
		def generated = phase4EvidenceDir.get().file('edge/routes.tsv').asFile
		if (!phase5RouteContracts.isFile()) {
			throw new GradleException('Reviewed Phase 5 route contract is missing')
		}
		def contractLines = phase5RouteContracts.readLines()
		def contractRows = contractLines
			.findAll { it && !it.startsWith('#') }
			.collect { it.split('\t', -1) }
		if (contractRows.isEmpty() || contractRows.any { it.length != 15 }) {
			throw new GradleException(
				'Phase 5 route contract is empty or malformed')
		}
		def projected = new StringBuilder()
		projected.append(
			'# descriptor\tkind\tname\timplementation\turl_pattern\tconfigured_security\ttraffic_class\tbehavioral_gate\towner')
			.append(System.lineSeparator())
		contractRows.each {
			projected.append(it.take(9).join('\t')).append(System.lineSeparator())
		}
		if (projected.toString().getBytes('UTF-8') != generated.bytes) {
			throw new GradleException(
				'Web route classification drifted; regenerate and review gradle/phase5/route-contracts.tsv')
		}
		def generatedRows = generated.readLines()
			.findAll { it && !it.startsWith('#') }
		if (generatedRows.size() != contractRows.size()) {
			throw new GradleException(
				"Generated ${generatedRows.size()} routes but reviewed ${contractRows.size()}")
		}
		def fields = contractRows.collect { it.take(9) as String[] }
		def malformed = fields.findAll { it.length != 9 || !it[6] || !it[7] || !it[8] }
		if (!malformed.isEmpty()) {
			throw new GradleException("Unowned or malformed Phase 4 route rows: ${malformed}")
		}
		def validClasses = [
			'anonymous/public',
			'end-user-authenticated',
			'service-to-service',
			'infrastructure'
		]
		def invalidClasses = fields.findAll { !validClasses.contains(it[6]) }
		if (!invalidClasses.isEmpty()) {
			throw new GradleException("Invalid Phase 4 route classes: ${invalidClasses}")
		}
		def soapRows = fields.findAll { it[7] == 'phase4-soap' }
		if (soapRows.size() != 2 || soapRows.any {
			it[6] != 'service-to-service' || it[8] != 'phase4'
		}) {
			throw new GradleException(
				"Phase 4 SOAP route ownership changed: ${soapRows}")
		}
		if (!phase5RouteContracts.text.contains(
			'# callback/webhook\tnone found; adding one requires an explicit route rule and behavioral gate')) {
			throw new GradleException(
				'Route contract must explicitly record the absent callback/webhook class')
		}
	}
}

tasks.register('verifyPhase4XFireRemovalInventory') {
	group = 'verification'
	description = 'Fails when an XFire reference is missing from the reviewed removal inventory'
	inputs.file phase4XFireRemoval
	doLast {
		if (!phase4XFireRemoval.isFile()) {
			throw new GradleException('Phase 4 XFire removal inventory is missing')
		}

		def rows = phase4XFireRemoval.readLines()
			.collect { it.trim() }
			.findAll { it && !it.startsWith('#') }
			.collect { line ->
				def fields = line.split('\t', -1)
				if (fields.length != 3) {
					throw new GradleException("Malformed XFire inventory row: ${line}")
				}
				[path: fields[0], disposition: fields[1], rationale: fields[2]]
			}
		def duplicatePaths = rows.groupBy { it.path }.findAll { _, entries -> entries.size() != 1 }
		if (!duplicatePaths.isEmpty()) {
			throw new GradleException("Duplicate XFire inventory paths: ${duplicatePaths.keySet()}")
		}
		def validDispositions = ['remove', 'retain-evidence', 'migrate']
		def invalid = rows.findAll {
			!validDispositions.contains(it.disposition) || !it.rationale
		}
		if (!invalid.isEmpty()) {
			throw new GradleException("Invalid XFire inventory rows: ${invalid}")
		}

		def textExtensions = [
			'classpath', 'gradle', 'iml', 'java', 'md', 'sh', 'tsv', 'txt', 'xml'
		]
		def discovered = rootProject.fileTree(rootProject.projectDir)
			.matching {
				exclude '.git/**'
				exclude '.gradle/**'
				exclude 'build/**'
				exclude '**/.gradle/**'
				exclude '**/build/**'
				exclude '**/WEB-INF/classes/**'
				exclude '**/dist/**'
			}
			.files
			.findAll { it.isFile() }
			.collect { rootProject.projectDir.toPath().relativize(it.toPath()).toString()
				.replace(File.separatorChar, '/' as char) }
			.findAll { relativePath ->
				relativePath != 'gradle/phase4/xfire-removal.tsv'
			}
			.findAll { relativePath ->
				def file = rootProject.file(relativePath)
				def extension = relativePath.contains('.') ?
					relativePath.substring(relativePath.lastIndexOf('.') + 1) : ''
				def namedArtifact = file.name.toLowerCase().contains('xfire')
				namedArtifact || (textExtensions.contains(extension) &&
					file.getText('UTF-8').toLowerCase().contains('xfire'))
			}
			.toSet()
		def expected = rows*.path.toSet()
		def untracked = discovered - expected
		def stale = expected - discovered
		if (!untracked.isEmpty() || !stale.isEmpty()) {
			throw new GradleException(
				"XFire inventory drifted; untracked=${untracked.sort()}, stale=${stale.sort()}")
		}
	}
}

tasks.register('verifyPhase4XFireAbsent') {
	group = 'verification'
	description = 'Fails when active source, descriptors, or binaries retain XFire'
	def activeRoots = [
		rootProject.file('.classpath'),
		rootProject.file('adempiere.iml'),
		rootProject.file('org.adempiere.webservice/.classpath'),
		rootProject.file('org.adempiere.webservice/EclipseMultiProject.classpath'),
		rootProject.file('org.adempiere.webservice/org.adempiere.webservice.iml'),
		rootProject.file('org.adempiere.webservice/WEB-INF/lib'),
		rootProject.file('org.adempiere.webservice/WEB-INF/src'),
		rootProject.file('org.adempiere.webservice/WEB-INF/web.xml'),
		rootProject.file('org.adempiere.webservice/src/business'),
		rootProject.file('org.adempiere.webservice/src/businessTest'),
		rootProject.file('org.adempiere.webservice/src/cxf'),
		rootProject.file('org.adempiere.webservice/src/router')
	]
	inputs.files activeRoots
	doLast {
		def files = activeRoots.collectMany { root ->
			root.isDirectory() ? rootProject.fileTree(root).files : [root]
		}.findAll { it.isFile() }
		def violations = files.findAll { file ->
			def lowerName = file.name.toLowerCase()
			if (lowerName.contains('xfire')) {
				return true
			}
			def extension = lowerName.contains('.') ?
				lowerName.substring(lowerName.lastIndexOf('.') + 1) : ''
			if (!['classpath', 'gradle', 'iml', 'java', 'xml'].contains(extension)) {
				return false
			}
			def text = file.getText('UTF-8').toLowerCase()
			return text.contains('org.codehaus.xfire')
					|| text.contains('xfireconfigurableservlet')
					|| text.contains('meta-inf/xfire')
		}
		if (!violations.isEmpty()) {
			throw new GradleException(
				"Retired XFire remains active: ${violations.sort()}")
		}
	}
}

tasks.register('generatePhase4OperationBaselineRequests') {
	group = 'verification'
	description = 'Generates one deterministic unauthenticated dispatch request for every SOAP operation'
	inputs.file new File(phase4FrozenContracts, 'operations.tsv')
	outputs.dir phase4EvidenceDir.map { it.dir('oracle/operations') }
	doLast {
		def outputRoot = phase4EvidenceDir.get().dir('oracle/operations').asFile
		project.delete(outputRoot)
		def operations = readPhase4Operations()
		operations.each { operation ->
			def caseDir = new File(
				outputRoot, "${operation.service}/${operation.operation}/baseline")
			caseDir.mkdirs()
			def parts = operation.requestParts ?
				operation.requestParts.split(',').collect { encoded ->
					def separator = encoded.indexOf(':')
					if (separator <= 0) {
						throw new GradleException(
							"Malformed request part ${encoded} for ${operation.service}.${operation.operation}")
					}
					def name = encoded.substring(0, separator)
					def type = encoded.substring(separator + 1)
					def value = phase4XmlValue(type)
					value ?
						"    <svc:${name}>${value}</svc:${name}>" :
						"    <svc:${name}/>"
				} : []
			def operationBody = parts.isEmpty() ?
				"  <svc:${operation.operation}/>" :
				(["  <svc:${operation.operation}>"] + parts +
					["  </svc:${operation.operation}>"]).join('\n')
			new File(caseDir, 'request.xml').text = """\
<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:svc="${operation.namespace}">
 <soapenv:Body>
${operationBody}
 </soapenv:Body>
</soapenv:Envelope>
"""
			new File(caseDir, 'case.tsv').text =
				'# case\tscope\tmutability\tauthentication\texpectation\n' +
				[
					'baseline',
					operation.scope,
					operation.mutability,
					operation.authentication,
					'dispatch-success-or-application-fault'
				].join('\t') + '\n'
		}
		if (operations.size() != 33) {
			throw new GradleException(
				"Expected 33 generated operation baselines, got ${operations.size()}")
		}
	}
}

tasks.register('verifyPhase4OperationBaselineExceptions') {
	group = 'verification'
	description = 'Fails when an approved legacy operation baseline exception is stale or malformed'
	inputs.files(
		new File(phase4FrozenContracts, 'operations.tsv'),
		phase4OperationBaselineExceptions)
	doLast {
		def operationKeys = readPhase4Operations().collect {
			"${it.service}.${it.operation}"
		}.toSet()
		def rows = phase4OperationBaselineExceptions.readLines()
			.findAll { it && !it.startsWith('#') }
			.collect { line ->
				def fields = line.split('\t', -1)
				if (fields.length != 5 || fields.any { !it }) {
					throw new GradleException(
						"Malformed Phase 4 operation baseline exception: ${line}")
				}
				[
					key: "${fields[0]}.${fields[1]}",
					fault: fields[2],
					owner: fields[3],
					closingAction: fields[4]
				]
			}
		def duplicates = rows.groupBy { it.key }
			.findAll { _, entries -> entries.size() != 1 }
		def stale = rows.findAll { !operationKeys.contains(it.key) }
		if (!duplicates.isEmpty() || !stale.isEmpty()) {
			throw new GradleException(
				"Invalid Phase 4 operation baseline exceptions; "
					+ "duplicates=${duplicates.keySet()}, stale=${stale*.key}")
		}
	}
}

