import groovy.xml.XmlSlurper
import java.security.MessageDigest

def phase3Topology = rootProject.file('gradle/phase3/topology.tsv')
def phase3Artifacts = rootProject.file('gradle/phase3/artifacts.txt')
def phase3TomcatContexts = rootProject.file('gradle/phase3/tomcat-contexts.txt')
def phase3BuildRoot = rootProject.layout.buildDirectory.dir('phase3')
def phase3EvidenceDir = phase3BuildRoot.map { it.dir('evidence') }
def phase3RuntimeRoot = phase3BuildRoot.map { it.dir('runtime') }
def phase3AdempiereHome = phase3RuntimeRoot.map { it.dir('Adempiere') }
def phase3InstallDir = phase3BuildRoot.map { it.dir('install') }
def phase3TomcatHome = phase3BuildRoot.map { it.dir('tomcat') }
def phase3DbHost = providers.gradleProperty('phase3DbHost')
	.orElse(providers.environmentVariable('ADEMPIERE_PHASE3_DB_HOST'))
	.orElse('127.0.0.1')
def phase3DbPort = providers.gradleProperty('phase3DbPort')
	.orElse(providers.environmentVariable('ADEMPIERE_PHASE3_DB_PORT'))
	.orElse('5432')
def phase3DbName = providers.gradleProperty('phase3DbName')
	.orElse(providers.environmentVariable('ADEMPIERE_PHASE3_DB_NAME'))
	.orElse('adempiere_phase3_ci')
def phase3DbUser = providers.gradleProperty('phase3DbUser')
	.orElse(providers.environmentVariable('ADEMPIERE_PHASE3_DB_USER'))
	.orElse('adempiere_phase3_ci')
def phase3DbPassword = providers.gradleProperty('phase3DbPassword')
	.orElse(providers.environmentVariable('ADEMPIERE_PHASE3_DB_PASSWORD'))
	.orElse('adempiere_phase3_ci')
def phase3DbSystemPassword = providers.gradleProperty('phase3DbSystemPassword')
	.orElse(providers.environmentVariable('ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD'))
	.orElse('')
def phase3DbSystemUser = providers.gradleProperty('phase3DbSystemUser')
	.orElse(providers.environmentVariable('ADEMPIERE_PHASE3_DB_SYSTEM_USER'))
	.orElse('postgres')
def phase3DatabaseMarker = 'ADempiere Phase 3 disposable database'
def phase3RoleMarker = 'ADempiere Phase 3 disposable database role'
def phase3MigrationRelease = {
	def properties = new Properties()
	rootProject.file('gradle/phase2/runtime.properties').withInputStream {
		properties.load(it)
	}
	properties.getProperty('migration.release')
}
def phase3JavaLauncher = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(21)
}

def readPhase3Topology = {
	phase3Topology.readLines()
		.collect { it.trim() }
		.findAll { it && !it.startsWith('#') }
		.collect { line ->
			def fields = line.split('\t', -1)
			if (fields.length != 4) {
				throw new GradleException("Invalid Phase 3 topology row: ${line}")
			}
			[
				surface: fields[0],
				antRole: fields[1],
				gradlePath: fields[2],
				classification: fields[3]
			]
		}
}

tasks.register('verifyPhase3Topology') {
	group = 'verification'
	description = 'Reconciles the complete Ant product reactor with the Gradle project graph'
	inputs.files(
		phase3Topology,
		rootProject.file('utils_dev/build.xml'),
		rootProject.file('settings.gradle'),
		rootProject.file('base/build.xml'),
		rootProject.file('looks/build.xml'))
	doLast {
		def rows = readPhase3Topology()
		def duplicates = rows.groupBy { it.surface }.findAll { _, matches -> matches.size() != 1 }
		if (!duplicates.isEmpty()) {
			throw new GradleException("Duplicate Phase 3 topology surfaces: ${duplicates.keySet()}")
		}

		def reactor = new XmlSlurper(false, false).parse(rootProject.file('utils_dev/build.xml'))
		def antJarEntries = reactor.target
			.find { it.@name.text() == 'jar' }
			.ant
			.collect { it.@dir.text() }
		def expectedAntJarEntries = rows
			.findAll { it.antRole == 'jar' }
			.collect { it.surface }
		if (antJarEntries != expectedAntJarEntries) {
			throw new GradleException(
				"Ant jar reactor differs. Expected ${expectedAntJarEntries}, got ${antJarEntries}")
		}

		def expectedGradleProjects = rows
			.findAll { it.gradlePath != '-' }
			.collect { it.gradlePath }
			.sort()
		def actualGradleProjects = rootProject.subprojects*.path.sort()
		if (actualGradleProjects != expectedGradleProjects) {
			throw new GradleException(
				"Gradle topology differs. Expected ${expectedGradleProjects}, got ${actualGradleProjects}")
		}

		def validClassifications = [
			'shared',
			'ant-only',
			'ant-embedded',
			'gradle-only',
			'phase3-quarantined'
		]
		def invalid = rows.findAll { !validClassifications.contains(it.classification) }
		if (!invalid.isEmpty()) {
			throw new GradleException("Unclassified Phase 3 topology rows: ${invalid}")
		}
		if (!rootProject.file('install/build.xml').isFile() ||
			!rootProject.file('looks/build.xml').isFile() ||
			!rootProject.file('base/build.xml').text.contains('../looks/src')) {
			throw new GradleException('The install/looks product surfaces are not wired as inventoried')
		}
		def quarantine = rootProject.file('gradle/phase3/quarantine.txt').readLines()
			.collect { it.trim() }
			.findAll { it && !it.startsWith('#') }
			.collect { it.split('\t', -1)[0] }
			.sort()
		def classifiedQuarantine = rows
			.findAll { it.classification == 'phase3-quarantined' }
			.collect { it.surface }
			.sort()
		if (quarantine != classifiedQuarantine) {
			throw new GradleException(
				"Phase 3 quarantine differs. Expected ${classifiedQuarantine}, got ${quarantine}")
		}

		logger.lifecycle(
			"Phase 3 topology: ${antJarEntries.size()} Ant jar entries, " +
			"${actualGradleProjects.size()} Gradle projects, " +
			"${rows.count { it.classification == 'ant-only' }} Ant-only, " +
			"${rows.count { it.classification == 'gradle-only' }} Gradle-only")
	}
}

tasks.register('verifyPhase3ArtifactInventory') {
	group = 'verification'
	description = 'Fails when the installed distribution omits a required Phase 3 artifact class'
	dependsOn tasks.named('verifyPhase3Topology')
	inputs.file phase3Artifacts
	doLast {
		def missing = []
		phase3Artifacts.readLines()
			.collect { it.trim() }
			.findAll { it && !it.startsWith('#') }
			.each { pattern ->
				if (rootProject.fileTree(rootProject.projectDir) {
					include pattern
				}.empty) {
					missing << pattern
				}
			}
		if (!missing.isEmpty()) {
			throw new GradleException("Missing Phase 3 distribution artifacts: ${missing}")
		}
	}
}

tasks.register('verifyPhase3AntJavaLevel') {
	group = 'verification'
	description = 'Fails when a Phase 2 Ant carry-over surface still targets Java 11'
	inputs.file rootProject.file('gradle/phase2/ant-java-carryover.txt')
	doLast {
		def legacyPins = []
		rootProject.file('gradle/phase2/ant-java-carryover.txt').readLines()
			.collect { it.trim() }
			.findAll { it && !it.startsWith('#') }
			.each { relativePath ->
				rootProject.file(relativePath)
					.text
					.readLines()
					.findAll { it =~ /(?:source|target|release|javasource)="11"/ }
					.each { line -> legacyPins << "${relativePath}: ${line.trim()}" }
			}
		if (!legacyPins.isEmpty()) {
			throw new GradleException("Java 11 Ant carry-over remains: ${legacyPins}")
		}
	}
}

tasks.register('generatePhase3ArtifactManifest') {
	group = 'verification'
	description = 'Writes a normalized per-file content manifest for the installed Phase 3 product'
	dependsOn tasks.named('verifyPhase3ArtifactInventory')
	inputs.file phase3TomcatContexts
	outputs.file phase3EvidenceDir.map { it.file('artifacts.tsv') }
	doLast {
		def expectedContexts = phase3TomcatContexts.readLines()
			.collect { it.trim() }
			.findAll { it && !it.startsWith('#') }
		def webapps = phase3AdempiereHome.get().dir('tomcat/webapps').asFile
		def actualContexts = webapps.listFiles()
			.findAll { it.isFile() && it.name.endsWith('.war') }
			.collect { it.name }
			.sort()
		if (actualContexts != expectedContexts.sort()) {
			throw new GradleException(
				"Tomcat context inventory differs. Expected ${expectedContexts}, got ${actualContexts}")
		}

		def installedHome = phase3AdempiereHome.get().asFile
		def roots = ['lib', 'packages', 'zkpackages', 'tomcat/webapps', 'migration', 'data']
		def files = roots.collectMany { relativeRoot ->
			def root = new File(installedHome, relativeRoot)
			root.exists() ? rootProject.fileTree(root).files : []
		}.findAll { it.isFile() }.unique().sort { left, right ->
			installedHome.toPath().relativize(left.toPath()).toString() <=>
				installedHome.toPath().relativize(right.toPath()).toString()
		}
		if (files.isEmpty()) {
			throw new GradleException('The installed Phase 3 product manifest would be empty')
		}

		def output = phase3EvidenceDir.get().file('artifacts.tsv').asFile
		output.parentFile.mkdirs()
		output.withWriter('UTF-8') { writer ->
			writer.println('# path\tsize\tsha256')
			files.each { installedFile ->
				def digest = MessageDigest.getInstance('SHA-256')
				installedFile.withInputStream { input ->
					byte[] buffer = new byte[65536]
					for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
						digest.update(buffer, 0, read)
					}
				}
				def relative = installedHome.toPath()
					.relativize(installedFile.toPath())
					.toString()
					.replace(File.separatorChar, '/' as char)
				writer.println(
					"${relative}\t${installedFile.length()}\t${digest.digest().encodeHex()}")
			}
		}
		logger.lifecycle("Recorded ${files.size()} installed artifacts in ${output}")
	}
}

tasks.register('capturePhase3TopologyEvidence') {
	group = 'verification'
	description = 'Copies the approved topology inputs into the Phase 3 evidence directory'
	dependsOn tasks.named('verifyPhase3Topology')
	doLast {
		def output = phase3EvidenceDir.get().file('topology.tsv').asFile
		output.parentFile.mkdirs()
		output.text = phase3Topology.text
	}
}

tasks.register('guardPhase3DisposableRuntime', Exec) {
	group = 'verification'
	description = 'Refuses non-local database targets and install paths outside build/phase3'
	commandLine(
		'bash',
		rootProject.file('scripts/phase3/guard-disposable-runtime.sh'),
		rootProject.projectDir,
		phase3RuntimeRoot.get().asFile,
		phase3AdempiereHome.get().asFile,
		phase3InstallDir.get().asFile,
		phase3DbHost.get(),
		phase3DbName.get(),
		phase3DbUser.get())
}

tasks.register('preparePhase3Tomcat', Exec) {
	group = 'verification'
	description = 'Downloads and checksum-verifies the pinned Tomcat 9 bridge into build/phase3'
	dependsOn tasks.named('guardPhase3DisposableRuntime')
	commandLine(
		'bash',
		rootProject.file('scripts/phase3/prepare-tomcat9.sh'),
		rootProject.file('gradle/phase2/runtime.properties'),
		phase3TomcatHome.get().asFile)
}

def configurePhase3Ant = { Exec task, boolean noDatabaseRestore ->
	task.group = 'verification'
	task.dependsOn tasks.named('guardPhase3DisposableRuntime')
	task.dependsOn tasks.named('preparePhase3Tomcat')
	task.dependsOn tasks.named('verifyPhase3Topology')
	task.workingDir rootProject.projectDir
	task.environment 'ADEMPIERE_HOME', phase3AdempiereHome.get().asFile.absolutePath
	task.environment 'ADEMPIERE_ROOT', phase3RuntimeRoot.get().asFile.absolutePath
	task.environment 'ADEMPIERE_INSTALL', phase3InstallDir.get().asFile.absolutePath
	task.environment 'ADEMPIERE_VERSION_FILE', '394LTS'
	task.environment 'ADEMPIERE_NONINTERACTIVE', 'true'
	task.environment 'ADEMPIERE_DISPOSABLE_DATABASE_MARKER', phase3DatabaseMarker
	task.environment 'ADEMPIERE_DISPOSABLE_ROLE_MARKER', phase3RoleMarker
	task.environment(
		'JAVA_HOME',
		phase3JavaLauncher.get().metadata.installationPath.asFile.absolutePath)
	task.commandLine(
		'ant',
		'build',
		"-Dnodbrestore=${noDatabaseRestore}",
		"-Denv.ADEMPIERE_ROOT=${phase3RuntimeRoot.get().asFile.absolutePath}",
		"-Denv.ADEMPIERE_HOME=${phase3AdempiereHome.get().asFile.absolutePath}",
		"-Denv.ADEMPIERE_INSTALL=${phase3InstallDir.get().asFile.absolutePath}",
		'-Denv.ADEMPIERE_VERSION_FILE=394LTS',
		"-Dphase3.apps.path=${phase3TomcatHome.get().asFile.absolutePath}",
		"-Dphase3.db.host=${phase3DbHost.get()}",
		"-Dphase3.db.port=${phase3DbPort.get()}",
		"-Dphase3.db.name=${phase3DbName.get()}",
		"-Dphase3.db.user=${phase3DbUser.get()}",
		"-Dphase3.db.password=${phase3DbPassword.get()}",
		"-Dphase3.db.system.password=${phase3DbSystemPassword.get()}",
		"-Dmigration.path=${phase3MigrationRelease()}")
}

tasks.register('phase3AntNoDatabaseBuild', Exec) {
	description = 'Builds, installs, and runs silent setup in the guarded Phase 3 home without restoring a database'
	configurePhase3Ant(delegate, true)
}

tasks.register('phase3AntDatabaseBuild', Exec) {
	description = 'Builds and installs against the guarded disposable PostgreSQL Phase 3 database'
	configurePhase3Ant(delegate, false)
}

tasks.register('cleanupPhase3Database', Exec) {
	group = 'verification'
	description = 'Drops only the marker-owned Phase 3 disposable database and role'
	environment 'ADEMPIERE_PHASE3_DB_SYSTEM_PASSWORD', phase3DbSystemPassword.get()
	commandLine(
		'bash',
		rootProject.file('scripts/phase3/cleanup-phase3-postgres.sh'),
		phase3DbHost.get(),
		phase3DbPort.get(),
		phase3DbName.get(),
		phase3DbUser.get(),
		phase3DbSystemUser.get(),
		phase3DatabaseMarker,
		phase3RoleMarker)
}

tasks.named('phase3AntDatabaseBuild') {
	finalizedBy tasks.named('cleanupPhase3Database')
}

tasks.named('verifyPhase3ArtifactInventory') {
	mustRunAfter tasks.named('phase3AntNoDatabaseBuild'), tasks.named('phase3AntDatabaseBuild')
}

tasks.register('capturePhase3DatabaseEvidence', Exec) {
	group = 'verification'
	description = 'Verifies the installed PostgreSQL release and records release-scoped migration and seed evidence'
	dependsOn tasks.named('phase3AntDatabaseBuild')
	commandLine(
		'bash',
		rootProject.file('scripts/phase3/capture-database-evidence.sh'),
		rootProject.projectDir,
		phase3EvidenceDir.get().dir('database').asFile,
		phase3DbHost.get(),
		phase3DbPort.get(),
		phase3DbName.get(),
		phase3DbUser.get(),
		phase3DbPassword.get(),
		phase3DbSystemUser.get(),
		phase3DbSystemPassword.get(),
		phase3MigrationRelease())
}

tasks.register('phase3TomcatSmoke', Exec) {
	group = 'verification'
	description = 'Starts the installed Tomcat 9 product and verifies status and legacy context reachability'
	dependsOn tasks.named('phase3AntDatabaseBuild')
	environment(
		'JAVA_HOME',
		phase3JavaLauncher.get().metadata.installationPath.asFile.absolutePath)
	commandLine(
		'bash',
		rootProject.file('scripts/phase3/smoke-tomcat9.sh'),
		phase3TomcatHome.get().asFile,
		phase3AdempiereHome.get().dir('tomcat').asFile,
		phase3AdempiereHome.get().asFile,
		'8888',
		phase3EvidenceDir.get().dir('tomcat').asFile)
}

tasks.register('phase3NoDatabaseDistribution') {
	group = 'verification'
	description = 'Canonical Phase 3 full-product distribution gate without database restore'
	dependsOn tasks.named('phase3AntNoDatabaseBuild')
	dependsOn tasks.named('verifyPhase3AntJavaLevel')
	dependsOn tasks.named('generatePhase3ArtifactManifest')
	dependsOn tasks.named('capturePhase3TopologyEvidence')
}

tasks.register('phase3InstalledProduct') {
	group = 'verification'
	description = 'Canonical Phase 3 installed-product gate on PostgreSQL 14.6 and Tomcat 9'
	dependsOn ':base:phase3MetadataValidation'
	dependsOn tasks.named('capturePhase3DatabaseEvidence')
	dependsOn tasks.named('generatePhase3ArtifactManifest')
	dependsOn tasks.named('capturePhase3TopologyEvidence')
	dependsOn tasks.named('phase3TomcatSmoke')
}

tasks.named('cleanupPhase3Database') {
	mustRunAfter tasks.named('capturePhase3DatabaseEvidence')
	mustRunAfter tasks.named('generatePhase3ArtifactManifest')
	mustRunAfter tasks.named('phase3TomcatSmoke')
	mustRunAfter tasks.named('phase3InstalledProduct')
}

gradle.projectsEvaluated {
	project(':base').tasks.named('phase3MetadataValidation') {
		mustRunAfter tasks.named('phase3TomcatSmoke'), tasks.named('capturePhase3DatabaseEvidence')
	}
	tasks.named('cleanupPhase3Database') {
		mustRunAfter project(':base').tasks.named('phase3MetadataValidation')
	}
}
