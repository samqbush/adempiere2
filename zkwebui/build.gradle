def canonicalArchiveDigest = { File archive ->
	def digest = java.security.MessageDigest.getInstance('SHA-256')
	def rows = []
	new java.util.zip.ZipFile(archive).withCloseable { zip ->
		zip.entries().findAll { !it.directory }.each { entry ->
			def content = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
			def entryDigest = java.security.MessageDigest.getInstance('SHA-256')
				.digest(content).encodeHex().toString()
			rows << "${entry.name}\t${entryDigest}"
		}
	}
	digest.digest(rows.sort().join('\n').getBytes('UTF-8'))
		.encodeHex().toString()
}

tasks.register('verifyPhase5cTransformer') {
	group = 'verification'
	description = 'Proves deterministic Jakarta transformation on a representative fixture'
	dependsOn(
		tasks.named('transformPhase5cFixture'),
		tasks.named('transformPhase5cFixtureSecond'))
	inputs.files transformerFixtureOutput, transformerFixtureOutputSecond
	doLast {
		def first = transformerFixtureOutput.get().asFile
		def second = transformerFixtureOutputSecond.get().asFile
		if (canonicalArchiveDigest(first) != canonicalArchiveDigest(second)) {
			throw new GradleException('Transformer fixture output is not deterministic')
		}
		def names = []
		def content = new ByteArrayOutputStream()
		new java.util.zip.ZipFile(first).withCloseable { zip ->
			zip.entries().findAll { !it.directory }.each { entry ->
				names << entry.name
				content.write(zip.getInputStream(entry).withCloseable {
					it.readAllBytes()
				})
			}
		}
		def text = content.toString('ISO-8859-1')
		if (!text.contains('jakarta/servlet/Filter') ||
				text.contains('javax/servlet/Filter')) {
			throw new GradleException(
				'Transformer did not replace the servlet namespace in bytecode')
		}
		if (!names.contains('META-INF/services/jakarta.servlet.Filter') ||
				names.contains('META-INF/services/javax.servlet.Filter')) {
			throw new GradleException(
				'Transformer did not rewrite the service resource path')
		}
		if (!text.contains('http://java.sun.com/xml/ns/j2ee')) {
			throw new GradleException(
				'Transformer unexpectedly rewrote the descriptor fixture; ' +
				'descriptors are owned by the Phase 5d/5f manual migration')
		}
		def rules = rootProject.file('gradle/phase5/transformer-rules.tsv')
		if (!rules.text.contains('servlet-descriptors\tmanual-migration') ||
				!rules.text.contains('service-resource-paths\ttransform')) {
			throw new GradleException(
				'Phase 5 transformer allowlist/denylist is incomplete')
		}
	}
}

def transformerCorpusReport = layout.buildDirectory.file(
	'phase5c/transformer/legacy-corpus-report.txt')
def transformerCorpusDryRunOutput = layout.buildDirectory.file(
	'phase5c/transformer/legacy-corpus-dry-run.war')

// Phase 5d: the corpus is the *verified* frozen legacy WAR, not whatever
// lib/webui.war happened to contain after the last Ant run. lib/webui.war is now
// a staged copy of that same frozen artifact, so pointing at the verified source
// removes an incidental build-output dependency and makes this report
// database-neutral instead of requiring a full Phase 3 distribution.
def phase5dFrozenLegacyWar = rootProject.layout.buildDirectory.file(
	'phase5d/legacy-webui/webui.war')

tasks.register('phase5cTransformerCorpusReport', JavaExec) {
	group = 'verification'
	description = 'Runs a non-shipping transformer dry run over the frozen legacy web WAR'
	dependsOn rootProject.tasks.named('verifyPhase5dLegacyWebArtifacts')
	classpath = configurations.phase5Transformer
	mainClass = 'org.eclipse.transformer.cli.JakartaTransformerCLI'
	inputs.file phase5dFrozenLegacyWar
	outputs.file transformerCorpusReport
	def reportStream = [value: null]
	doFirst {
		def report = transformerCorpusReport.get().asFile
		report.parentFile.mkdirs()
		delete transformerCorpusDryRunOutput
		reportStream.value = new FileOutputStream(report)
		standardOutput = reportStream.value
		errorOutput = reportStream.value
		args(
			phase5dFrozenLegacyWar.get().asFile.absolutePath,
			transformerCorpusDryRunOutput.get().asFile.absolutePath,
			'--dryrun',
			'--verbose',
			'--stripSignatures',
			'--selection',
			rootProject.file('gradle/phase5/transformer-selection.properties')
				.toURI().toString())
	}
	doLast {
		reportStream.value.close()
		def report = transformerCorpusReport.get().asFile.text
		if (!report.contains('Return Code [ 0 ] [ Success ]')) {
			throw new GradleException(
				'Legacy corpus transformer dry run did not complete successfully')
		}
		def dryRunOutput = transformerCorpusDryRunOutput.get().asFile
		if (dryRunOutput.exists()) {
			delete dryRunOutput
		}
		if (dryRunOutput.exists()) {
			throw new GradleException(
				'Transformer corpus output could not be removed from build storage')
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyPhase5cTransformer')
	dependsOn tasks.named('modernUiTest')
	dependsOn tasks.named('browserContractTest')
}

tasks.register('phase5fWebuiContractTest', Test) {
	group = 'verification'
	description = 'Runs focused Phase 5f timeline behavior and database-effect tests'
	dependsOn tasks.named('phase5fWebuiContractClasses')
	testClassesDirs = sourceSets.phase5fWebuiContract.output.classesDirs
	classpath = sourceSets.phase5fWebuiContract.runtimeClasspath
	useJUnitPlatform()
	reports.junitXml.required = true
	reports.junitXml.outputLocation =
		layout.buildDirectory.dir('test-results/phase5fWebuiContractTest')
	reports.html.required = true
	reports.html.outputLocation =
		layout.buildDirectory.dir('reports/tests/phase5fWebuiContractTest')
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

tasks.register('verifyPhase5fWebuiInheritedRoutes', Exec) {
	group = 'verification'
	description = 'Verifies and mutation-proves the Phase 5f timeline and DSP WAR contract'
	dependsOn(
		tasks.named('verifyPhase5dModernWebWar'),
		tasks.named('phase5fWebuiContractTest'))
	inputs.files(
		tasks.named('war').flatMap { it.archiveFile },
		file('src/phase5d/webapp/css/phase5d-modern.css'),
		rootProject.file('scripts/phase5/verify-phase5f-webui-inherited-routes.py'))
	outputs.file layout.buildDirectory
		.file('phase5f/webui-inherited-routes/mutation-report.tsv')
	commandLine(
		'python3',
		rootProject.file('scripts/phase5/verify-phase5f-webui-inherited-routes.py'),
		'--war',
		tasks.named('war').get().archiveFile.get().asFile,
		'--css',
		file('src/phase5d/webapp/css/phase5d-modern.css'),
		'--report',
		layout.buildDirectory.file(
			'phase5f/webui-inherited-routes/mutation-report.tsv').get().asFile)
}

// The functional WAR repackages Ant-built runtime libraries and therefore has
// its own Phase 5d lifecycle. Keep generic `build` focused on Gradle-owned
// compilation/tests; the canonical Phase 5d gate invokes and verifies `war`
// explicitly after the Phase 3 distribution exists.
tasks.named('assemble') {
	setDependsOn([])
}
