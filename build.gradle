plugins {
	id 'java-library'
	id 'maven-publish'
	id 'signing'
	id 'org.cyclonedx.bom' version '1.8.2'
}

allprojects {
    apply plugin: 'java-library'
    group = 'io.github.adempiere'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    dependencyLocking {
        lockAllConfigurations()
    }

    plugins.withId('maven-publish') {
        publishing {
            repositories {
                maven {
                    name = 'phase2'
                    url = rootProject.layout.buildDirectory.dir('phase2-maven-repo')
                }
            }
            publications.withType(MavenPublication).configureEach {
                pom {
                    properties.put('maven.compiler.release', '21')
                    properties.put('adempiere.minimumJdk', '21')
                }
            }
        }
    }

	tasks.withType(Javadoc) {
    	options.addStringOption('Xdoclint:none', '-quiet')
    }
}

dependencies {
	//api '<library-group>:<library-name>:<library-version>'
}

java {
    withJavadocJar()
    withSourcesJar()
}

tasks.register('verifyJava21Bytecode') {
    dependsOn allprojects.collect { it.tasks.matching { task -> task.name == 'classes' } }
    doLast {
        def incompatible = []
        allprojects.each { project ->
            project.fileTree(project.layout.buildDirectory.dir('classes/java/main')).matching {
                include '**/*.class'
            }.each { classFile ->
                classFile.withInputStream { input ->
                    def header = new DataInputStream(input)
                    if (header.readInt() == 0xCAFEBABE) {
                        header.readUnsignedShort()
                        def major = header.readUnsignedShort()
                        if (major != 65) {
                            incompatible << "${project.path}:${classFile.name}=${major}"
                        }
                    }
                }
            }
        }
        if (!incompatible.empty) {
            throw new GradleException(
                "Published classes are not Java 21 bytecode: ${incompatible.take(20)}")
        }
    }
}

tasks.register('verifyProjectTopology') {
    doLast {
        def expected = file('gradle/phase1/gradle-projects.txt').readLines()
            .findAll { !it.blank && !it.startsWith('#') }
        def actual = rootProject.subprojects*.path.sort()
        if (actual != expected.sort()) {
            throw new GradleException("Gradle topology differs. Expected ${expected}, got ${actual}")
        }
        if (findProject(':base:test') != null) {
            throw new GradleException('Dormant base/test project must remain unregistered')
        }
    }
}

tasks.register('verifyTestClassification') {
    doLast {
        def roots = [
            file('base/test/src'),
            file('org.adempiere.test/src/test/java'),
            file('install/src/test/java'),
            file('serverRoot/src/test/server/org/compiere/ldap')
        ]
        def failures = []
        roots.each { root ->
            fileTree(root).matching { include '**/*.java' }.each { source ->
                def text = source.text
                def executable = text =~ /@(Test|ParameterizedTest|RepeatedTest|TestFactory)\b/
                if (executable) {
                    def unit = text.contains('@Tag("UnitTest")') ||
                        text.contains('extends CommonUnitTestSetup') ||
                        text.contains('implements UnitTestTag')
                    def integration = text.contains('@Tag("IntegrationTest")') ||
                        text.contains('extends CommonGWSetup') ||
                        text.contains('extends CommonSystemSetup') ||
                        text.contains('extends CommonIntegrationTestUtilities') ||
                        text.contains('implements IntegrationTestTag')
                    if (unit == integration) {
                        failures << "${root.toPath().relativize(source.toPath())}: " +
                            (unit ? 'ambiguous' : 'unclassified')
                    }
                }
            }
        }
        if (!failures.empty) {
            throw new GradleException("Test classification failures: ${failures}")
        }
    }
}

def testEnabledProjects = file('gradle/phase2/test-enabled-projects.txt').readLines()
    .collect { it.trim() }
    .findAll { it && !it.startsWith('#') }

tasks.register('verifyTestResults') {
    dependsOn testEnabledProjects.collect { "${it}:test" }
    doLast {
        testEnabledProjects.each { projectPath ->
            def project = findProject(projectPath)
            if (project == null) {
                throw new GradleException(
                    "Unknown test-enabled project ${projectPath}")
            }
            def resultFiles = project.fileTree(
                project.layout.buildDirectory.dir('test-results/test')) {
                include 'TEST-*.xml'
            }
            if (resultFiles.empty) {
                throw new GradleException(
                    "No ${projectPath} JUnit XML results were produced")
            }
            def executed = 0
            resultFiles.each { result ->
                executed += new XmlSlurper().parse(result).@tests.toInteger()
            }
            if (executed == 0) {
                throw new GradleException("${projectPath} executed zero tests")
            }
            logger.lifecycle("${projectPath} executed ${executed} tests")
        }
    }
}

tasks.register('verifyPublicationContracts') {
    doLast {
        def expected = [:]
        file('gradle/phase1/publications.tsv').eachLine { line ->
            if (line && !line.startsWith('#')) {
                def fields = line.split('\t')
                expected[fields[0]] = [fields[1], fields[2]]
            }
        }
        def actual = [:]
        subprojects.each { project ->
            def publishing = project.extensions.findByName('publishing')
            def publication = publishing?.publications?.findByName('mavenJava')
            if (publication != null) {
                actual[project.path] = [publication.groupId, publication.artifactId]
            }
        }
        if (actual != expected) {
            throw new GradleException(
                "Publication contracts differ. Expected ${expected}, got ${actual}")
        }
        subprojects.each { project ->
            def publication = project.extensions.findByName('publishing')
                ?.publications?.findByName('mavenJava')
            if (publication != null) {
                def properties = publication.pom.properties.get()
                if (properties['maven.compiler.release'] != '21' ||
                    properties['adempiere.minimumJdk'] != '21') {
                    throw new GradleException(
                        "${project.path} does not declare JDK 21 publication metadata")
                }
            }
        }
    }
}

tasks.register('verifyReleaseVersion') {
    doLast {
        if (!System.getenv('ADEMPIERE_RELEASE')?.toBoolean()) {
            return
        }
        def candidate = System.getenv('ADEMPIERE_LIBRARY_VERSION')
        if (candidate == null || candidate.blank ||
            candidate.startsWith('local') || candidate.endsWith('-SNAPSHOT')) {
            throw new GradleException(
                'A non-local, non-SNAPSHOT ADEMPIERE_LIBRARY_VERSION is required for release')
        }
        if (!(candidate ==~ /[A-Za-z0-9][A-Za-z0-9._-]*/)) {
            throw new GradleException(
                "Release version ${candidate} contains unsupported characters")
        }
        def used = file('gradle/phase2/used-release-versions.txt').readLines()
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') }
        if (used.contains(candidate)) {
            throw new GradleException(
                "Release version ${candidate} already exists in the repository ledger")
        }
    }
}

tasks.register('verifyJdkInternalApiInventory') {
    doLast {
        def inventoryOutput = new ByteArrayOutputStream()
        exec {
            commandLine 'bash', 'scripts/phase2/scan-jdk-internals.sh'
            standardOutput = inventoryOutput
        }
        def expected = file('gradle/phase2/jdk-internals.tsv').text
        def actual = inventoryOutput.toString('UTF-8')
        if (actual != expected) {
            throw new GradleException(
                'JDK internal/reflection inventory changed; regenerate and classify gradle/phase2/jdk-internals.tsv')
        }
        def unowned = actual.readLines().findAll {
            it && !it.startsWith('#') && it.split('\t', -1).last() == 'UNCLASSIFIED'
        }
        if (!unowned.empty) {
            throw new GradleException(
                "Unclassified JDK internal/reflection findings: ${unowned.take(20)}")
        }
    }
}

tasks.register('verifyJdepsInternals') {
    dependsOn allprojects.collect { it.tasks.matching { task -> task.name == 'jar' } }
    doLast {
        def launcher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }.get()
        def jdeps = launcher.metadata.installationPath.file('bin/jdeps').asFile
        def findings = []
        subprojects.each { project ->
            project.tasks.matching { it.name == 'jar' }.each { jarTask ->
                def archive = jarTask.archiveFile.get().asFile
                if (archive.exists()) {
                    def jdepsOutput = new ByteArrayOutputStream()
                    def errors = new ByteArrayOutputStream()
                    def result = exec {
                        commandLine jdeps, '--jdk-internals', '--multi-release', '21', archive
                        standardOutput = jdepsOutput
                        errorOutput = errors
                        ignoreExitValue = true
                    }
                    def report = jdepsOutput.toString('UTF-8').trim()
                    if (result.exitValue != 0 || report) {
                        findings << "${project.path}: ${report ?: errors.toString('UTF-8').trim()}"
                    }
                }
            }
        }
        if (!findings.empty) {
            throw new GradleException(
                "JDK-internal bytecode dependencies found: ${findings.take(20)}")
        }
    }
}

tasks.register('verifyPhase2RuntimePins', Exec) {
    commandLine 'bash', 'scripts/phase2/verify-runtime-pins.sh'
}

apply from: 'gradle/phase3/distribution.gradle'

tasks.withType(Javadoc) {
	failOnError false
	options.addStringOption('Xdoclint:none', '-quiet')
	options.addStringOption('encoding', 'UTF-8')
	options.addStringOption('charSet', 'UTF-8')
}


def entityType = 'D'
version = System.getenv("ADEMPIERE_LIBRARY_VERSION") ?: "local-1.0.0"

jar {
	manifest {
		attributes(
			"Implementation-Title": "Adempiere",
			"Implementation-Version": version,
			"EntityType": entityType)
	}
}
